<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzU4NzAyMDM4Mw==&amp;mid=2247483969&amp;idx=1&amp;sn=1724d9a5c897a8a1df295e92e8b7a20e&amp;chksm=fdf32371ca84aa672ab34ffefea97b682eab3b20e38a8d191821019cf9504705c62bb9fa29ff&amp;scene=126&amp;sessionid=1681657054#rd">http://mp.weixin.qq.com/s?__biz=MzU4NzAyMDM4Mw==&amp;mid=2247483969&amp;idx=1&amp;sn=1724d9a5c897a8a1df295e92e8b7a20e&amp;chksm=fdf32371ca84aa672ab34ffefea97b682eab3b20e38a8d191821019cf9504705c62bb9fa29ff&amp;scene=126&amp;sessionid=1681657054#rd</a></blockquote><p style="text-align: center;"><br/></p><p style="text-align: center;"><strong><span style="font-size: 24px;">向东航飞行事故遇难同胞致以沉痛哀悼</span></strong></p><p style="text-align: center;"><span style="font-size: 24px;"><strong><br/></strong></span></p><p style="text-align: center;"><img class="rich_pages wxw-img js_insertlocalimg" data-backh="208" data-backw="578" data-ratio="0.359375" data-s="300,640" data-src="https://mmbiz.qpic.cn/sz_mmbiz_jpg/ENAgOLHJw06afU6F9G03xIEVvkjAocrbNgj2RpbricSc6YliaRnkJMVic1HiabAjcCPcxcBuh7TibNEHicIaVQ7Vp6tw/640?wx_fmt=jpeg" data-type="jpeg" data-w="1280" style="width: 100%;height: auto;" src="../Images/8cedde41c0da86da8d20f41a7d56594e.png" data-original-src="https://mmbiz.qpic.cn/sz_mmbiz_jpg/ENAgOLHJw06afU6F9G03xIEVvkjAocrbNgj2RpbricSc6YliaRnkJMVic1HiabAjcCPcxcBuh7TibNEHicIaVQ7Vp6tw/640?wx_fmt=jpeg"/></p><p style="text-align: center;"><br/></p><p style="text-align: center;"><br/></p><p style="text-align: center;"><strong><span style="background-color: rgb(255, 255, 255);color: rgb(136, 136, 136);">斯人未远行，散作满天星。隔空遥相忆，愿君且安息。</span></strong><span style="background-color: rgb(255, 255, 255);color: rgb(136, 136, 136);"/></p><p style="text-align: center;"><br/></p><p style="text-align: center;"><strong><span style="font-size: 18px;"><img class="rich_pages wxw-img" data-ratio="1" data-src="https://mmbiz.qpic.cn/sz_mmbiz_png/ENAgOLHJw06afU6F9G03xIEVvkjAocrbic2MjDwHUuCqTwydO2FXszA5gecich1HBASlBtdzcmfMicYBMYOHuf4ag/640?wx_fmt=png"
