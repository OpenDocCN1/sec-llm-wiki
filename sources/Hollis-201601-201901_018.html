<h1>作为2019年的程序员，如何快速成长？</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzI3NzE0NjcwMg==&amp;mid=2650122969&amp;idx=1&amp;sn=da440915bdcaf336e41caec7849f242d&amp;chksm=f36bb7f8c41c3eee1317b747f7a0e44d998603ceddf23ba36f53f52dd9087338a4fec45cbc03&amp;scene=126&amp;sessionid=1681657763#rd">http://mp.weixin.qq.com/s?__biz=MzI3NzE0NjcwMg==&amp;mid=2650122969&amp;idx=1&amp;sn=da440915bdcaf336e41caec7849f242d&amp;chksm=f36bb7f8c41c3eee1317b747f7a0e44d998603ceddf23ba36f53f52dd9087338a4fec45cbc03&amp;scene=126&amp;sessionid=1681657763#rd</a></blockquote><section class="output_wrapper" data-mpa-powered-by="yiban.io"><figure style="font-size: inherit;color: inherit;line-height: inherit;"/><p>本文来自作者投稿，原作者陈彩华，就职于广州贝聊科技。</p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;">面试候选人的时候，有个比较常见的问题：对于一份工作，你最关注哪些因素？回答往往是薪资待遇，公司氛围，公司发展前景，工作强度等。个人比较欣赏的答案是：<strong style="font-size: inherit;color: inherit;line-height: inherit;">个人能力的成长</strong>。想收获一个薪资好，公司发展前景好的工作机会，关键和根本还是取决于个人的能力，能力是因，好的机会是果。</p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;">面对工作，与其选择满不情愿，最后收获痛苦煎熬和差强人意的结果，不如思考如何提升工作效率和自身能力，在工作中关注自身能力成长，并去刻意练习，想办法提升，最终往往收获的能力的提升，和比较良好的结果。</p><h1>下面谈谈几点关于成长的心得：<br/></h1><section class="mpa-template" data-mpa-template-id="1120346" data-mpa-color="null" data-mpa-category="收藏"><section data-mpa-template-id="1115154" data-mpa-color="null" data-mpa-category="fav" style="color: rgb(0, 0, 0);font-size: medium;"><section><section><section class="mpa-template" data-mpa-template-id="1120345" data-mpa-color="null" data-mpa-category="fav"><section><section class="Powered-by-XIUMI V5" powered-by="xiumi.us" style=""><section class="" style="margin-top: 10px;margin-bottom: 10px;"><section class="" style="margin-left: 0.8em;float: left;"><section class="" style="width: 2.5em;display: inline-block;vertical-align: bottom;overflow: hidden !important;"><img data-ratio="0.9166667" data-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ5356MYCKUhGibkYgq86ia9QJic31gicJ5VwDXlGAibC3ozgxpdxGAHU2z0ttQ/640" data-w="60" style="vertical-align: middle;height: auto !important;" src="../Images/820eb28bacba6ad26eff81465863adfb.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ5356MYCKUhGibkYgq86ia9QJic31gicJ5VwDXlGAibC3ozgxpdxGAHU2z0ttQ/640"/></section><section class="" style="margin-top: 0.5em;display: inline-block;vertical-align: top;font-size: 24px;"><section mpa-is-content="t"><span style="font-size: 17px;" mpa-is-content="t">持续分享输出</span></section></section></section><img class="" data-ratio="0.0057143" data-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ53sevjGldiccr28DGK6m1Pu2PbBuQ8sFl1aiblnpicBMjZ4lgK7ibdv0T92g/640" data-w="700" style="width: 557.778px;float: left;display: inline-block;vertical-align: middle;background-color: rgb(160, 160, 160);height: auto !important;" src="../Images/30297613b73683bf1ea14b3d11442fcd.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ53sevjGldiccr28DGK6m1Pu2PbBuQ8sFl1aiblnpicBMjZ4lgK7ibdv0T92g/640"/><section class="" style="clear: both;"/></section><p><span style="color: inherit;font-size: inherit;font-family: -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;">坚持写博客，持续分享输出，可以说是今年给我带来收获最大的行动。写博客可以看做是一种高效学习的方法，最终的收获是远远大于读别人的博客。</span><br/></p></section></section></section></section></section></section></section><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;">最大的收获其实在于写作的过程：<br/></p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;"><strong style="font-size: inherit;color: inherit;line-height: inherit;">知识体系</strong></p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;">写作需要查阅大量的资料，这个过程中可以把原来模糊的知识梳理清晰，串联起各个模糊的点，形成知识面，逐步构建形成自己的知识体系。</p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;"><br/>例如之前写过一篇Netty总结相关的博客，其实在写这篇博客之前对于Netty的了解非常模糊，如何开发无从下手，很多地方的理解是似是而非的，为了输出清晰的博客，需要查阅了大量相关的文档资料，并研究了部分源码，前前后后差不多花了一个月，最后写出博客后对于Netty的整个体系有一个清晰的理解，如何上手开发和解决相关的问题也有了清晰的方向。</p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;"><strong style="font-size: inherit;color: inherit;line-height: inherit;">梳理总结能力</strong></p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;">很多知识体系的脉络并不是很清晰，写作中锻炼出来的梳理能力可以用于高效梳理知识脉络，工作中可以用于梳理复杂业务体系，系统架构代码。</p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;">当文章顺利发表，可以收获</p><ul style="" class=" list-paddingleft-2"><li><p><strong style="font-size: inherit;color: inherit;line-height: inherit;">知识的巩固</strong>，当有读者指出文章中的错漏、模糊的地方，可以进一步帮我们强化巩固背后相应的知识点</p></li><li><p><strong style="font-size: inherit;color: inherit;line-height: inherit;">技术交流</strong>，通过文章中留下交流的联系方式，可以收获和业界同行交流问题的机会和人脉资源。</p></li><li><p><span style="font-size: inherit;color: inherit;line-height: inherit;">稿费，比如公众号投稿</span></p></li></ul><section class="mpa-template" data-mpa-template-id="1120346" data-mpa-color="null" data-mpa-category="收藏"><section data-mpa-template-id="1115154" data-mpa-color="null" data-mpa-category="fav" style="color: rgb(0, 0, 0);font-size: medium;"><section><section><section class="mpa-template" data-mpa-template-id="1120345" data-mpa-color="null" data-mpa-category="fav"><section><section class="Powered-by-XIUMI V5" powered-by="xiumi.us" style=""><section class="" style="margin-top: 10px;margin-bottom: 10px;"><section class="" style="margin-left: 0.8em;float: left;"><section class="" style="width: 2.5em;display: inline-block;vertical-align: bottom;overflow: hidden !important;"><img data-ratio="0.9166667" data-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ5356MYCKUhGibkYgq86ia9QJic31gicJ5VwDXlGAibC3ozgxpdxGAHU2z0ttQ/640" data-w="60" style="vertical-align: middle;height: auto !important;" src="../Images/820eb28bacba6ad26eff81465863adfb.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ5356MYCKUhGibkYgq86ia9QJic31gicJ5VwDXlGAibC3ozgxpdxGAHU2z0ttQ/640"/></section><section class="" style="margin-top: 0.5em;display: inline-block;vertical-align: top;font-size: 24px;"><section mpa-is-content="t"><span style="font-size: 17px;" mpa-is-content="t">主动迎接难题与挑战，做更多</span></section></section></section><img class="" data-ratio="0.0057143" data-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ53sevjGldiccr28DGK6m1Pu2PbBuQ8sFl1aiblnpicBMjZ4lgK7ibdv0T92g/640" data-w="700" style="width: 557.778px;float: left;display: inline-block;vertical-align: middle;background-color: rgb(160, 160, 160);height: auto !important;" src="../Images/30297613b73683bf1ea14b3d11442fcd.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ53sevjGldiccr28DGK6m1Pu2PbBuQ8sFl1aiblnpicBMjZ4lgK7ibdv0T92g/640"/><section class="" style="clear: both;"/></section><p><span style="color: inherit;font-size: inherit;font-family: -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;">在考察候选人的技术实力的时候，我更倾向于通过了解对方解决的问题。技术要能解决具体问题才有价值，问题的复杂度决定技术实力的高度。</span><br/></p><p><span style="color: inherit;font-size: inherit;font-family: -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><br/></span></p></section></section></section></section></section></section></section><p><strong style="font-size: inherit;color: inherit;line-height: inherit;">解决线上问题</strong></p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;">业务的开发过程中必然存在很多需要解决的问题，比如 崩溃，死锁，性能低下，延迟高，服务器不稳定，数据丢失，某些功能不知道怎么实现。问题就是机会，主动去解决问题，万一搞定了就是你厉害。<br/>其实大多问题并不难，只需要认真去google下跟踪调试进源代码深处就能解决，这种问题其实就是谁敢上谁就行。</p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;">很多人不去解决，就是因为懒和怂。问题解决多了，就会越来越有感觉，别人也就更倾向把疑难杂症交给你。所以一个组里只有一两个人能成长起来，因为只要有一个人成长了其它人就失去了机会，并不是这一两个人比其他人优秀很多，只是他们是第一个敢于主动迎难而上的人。</p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;">线上问题可以说是能力的锻炼提升的好机会，这些问题都是一个个经验大礼包，有机会来解决这些问题，哪怕是假期连续加班加点研究解决也是值得的。</p><p><strong style="font-size: inherit;color: inherit;line-height: inherit;">挑战即机遇</strong></p><p style="font-size: inherit;color: inherit;line-height: inherit;margin-top: 1.5em;margin-bottom: 1.5em;">过去一年，我所在的公司经历一波人员“调整优化”，原有的大数据团队的开发全部走了，在这种局面下主动接下公司的大数据项目，虽然因此研究相关技术加了不少班，但是最后项目平稳交接，收获了一波大数据技术方面的知识和实践经验。回想起来，如果没有当初的主动去挑战和争取，这个机会就落不到我这里。</p><section class="mpa-template" data-mpa-template-id="1120346" data-mpa-color="null" data-mpa-category="收藏"><section data-mpa-template-id="1115154" data-mpa-color="null" data-mpa-category="fav" style="color: rgb(0, 0, 0);font-size: medium;"><section><section><section class="mpa-template" data-mpa-template-id="1120345" data-mpa-color="null" data-mpa-category="fav"><section><section class="Powered-by-XIUMI V5" powered-by="xiumi.us" style=""><section class="" style="margin-top: 10px;margin-bottom: 10px;"><section class="" style="margin-left: 0.8em;float: left;"><section class="" style="width: 2.5em;display: inline-block;vertical-align: bottom;overflow: hidden !important;"><img data-ratio="0.9166667" data-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ5356MYCKUhGibkYgq86ia9QJic31gicJ5VwDXlGAibC3ozgxpdxGAHU2z0ttQ/640" data-w="60" style="vertical-align: middle;height: auto !important;" src="../Images/820eb28bacba6ad26eff81465863adfb.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ5356MYCKUhGibkYgq86ia9QJic31gicJ5VwDXlGAibC3ozgxpdxGAHU2z0ttQ/640"/></section><section class="" style="margin-top: 0.5em;display: inline-block;vertical-align: top;font-size: 24px;"><section mpa-is-content="t"><span style="font-size: 17px;" mpa-is-content="t">管理注意力</span></section></section></section><img class="" data-ratio="0.0057143" data-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ53sevjGldiccr28DGK6m1Pu2PbBuQ8sFl1aiblnpicBMjZ4lgK7ibdv0T92g/640" data-w="700" style="width: 557.778px;float: left;display: inline-block;vertical-align: middle;background-color: rgb(160, 160, 160);height: auto !important;" src="../Images/30297613b73683bf1ea14b3d11442fcd.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/6fuT3emWI5IXSzrsYhIlSbVU4lMaKQ53sevjGldiccr28DGK6m1Pu2PbBuQ8sFl1aiblnpicBMjZ4lgK7ibdv0T92g/640"/><section class="" style="clear: both;"/></section><p><span style="color: inherit;font-size: inherit;font-family: -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;">把注意力放在如何提升能力，这样帮我们省去很多不必要的烦恼，比如被领导批评，接到不喜欢的工作任务，与其被各种负面情绪困扰痛苦，不如关注任务本身带来的收获和价值，转换为自身的能力，并融为工作的动力，让自己更加高效。</span><br/></p><p><span style="font-size: inherit;color: inherit;line-height: inherit;"><br/></span></p><p><span style="font-size: inherit;color: inherit;line-height: inherit;">减少碎片时间的浪费，比如刷朋友圈，刷抖音，打游戏等。大段时间的消耗易于察觉，但不知不觉的浪费累积的“危害”更甚。</span></p><p><span style="font-size: inherit;color: inherit;line-height: inherit;"><br/></span></p><p><span style="font-size: inherit;color: inherit;line-height: inherit;">尽量少关注参与大而无当的话题，比如谈创新必谈芯片做忧国忧民状，经常点评国际政局，这些话题关注了最多也只能过过嘴瘾，不如用来思考如何改进和提升自己。</span></p></section></section></section></section></section></section></section><section class="mpa-template" data-mpa-template-id="1120346" data-mpa-color="null" d
