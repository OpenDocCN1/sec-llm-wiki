数据，从哪里来，到哪里去，就可以放心离开了。后续的实际数据传输工作，都会由 DMA 控制器来完成，CPU 不需要参与数据传输的工作。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">传统 IO 的工作方式，从硬盘读取数据，然后再通过网卡向外发送，我们需要进行 4 上下文切换，和 4 次数据拷贝，其中 2 次数据拷贝发生在内存里的缓冲区和对应的硬件设备之间，这个是由 DMA 完成，另外 2 次则发生在内核态和用户态之间，这个数据搬移工作是由 CPU 完成的。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">为了提高文件传输的性能，于是就出现了零拷贝技术，它通过一次系统调用（</span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">sendfile</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 方法）合并了磁盘读取与网络发送两个操作，降低了上下文切换次数。另外，拷贝数据都是发生在内核中的，天然就降低了数据拷贝的次数。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">Kafka 和 Nginx 都有实现零拷贝技术，这将大大提高文件传输的性能。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">零拷贝技术是基于 PageCache 的，PageCache 会缓存最近访问的数据，提升了访问缓存数据的性能，同时，为了解决机械硬盘寻址慢的问题，它还协助 I/O 调度算法实现了 IO 合并与预读，这也是顺序读比随机读性能好的原因。这些优势，进一步提升了零拷贝的性能。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">需要注意的是，零拷贝技术是不允许进程对文件内容作进一步的加工的，比如压缩数据再发送。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">另外，当传输大文件时，不能使用零拷贝，因为可能由于 PageCache 被大文件占据，而导致「热点」小文件无法利用到 PageCache，并且大文件的缓存命中率不高，这时就需要使用「异步 IO + 直接 IO 」的方式。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">在 Nginx 里，可以通过配置，设定一个文件大小阈值，针对大文件使用异步 IO 和直接 IO，而对小文件使用零拷贝。</span></section><section data-mpa-template="t" mpa-from-tpl="t"><br mpa-from-tpl="t"/><span style="color: rgb(136, 136, 136);font-family: -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;font-variant-numeric: normal;font-variant-east-asian: normal;letter-spacing: 1px;line-height: 29.75px;widows: 1;background-color: rgb(255, 255, 255);"/><section mpa-from-tpl="t" style="white-space: normal;color: rgb(62, 62, 62);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 16px;"><p style="text-align: center;letter-spacing: 3px;line-height: 1.5em;"><span style="color: rgb(0, 0, 0);font-size: 13px;">有道无术，术可成；有术无道，止于术</span></p><p style="text-align: center;letter-spacing: 3px;line-height: 1.5em;"><span style="color: rgb(0, 0, 0);font-size: 13px;">欢迎大家关注</span><span style="font-size: 13px;color: rgb(255, 169, 0);"><strong mpa-from-tpl="t" style="color: rgb(255, 104, 39);">Java之道</strong></span><span style="color: rgb(0, 0, 0);font-size: 13px;">公众号</span></p><p style="text-align: center;letter-spacing: 3px;line-height: 1.5em;"><br mpa-from-tpl="t"/></p><p style="text-align: center;"><img data-copyright="0" data-ratio="0.5555555555555556" data-s="300,640" data-type="jpeg" data-w="900" style="visibility: visible !important;width: 677px !important;height: auto !important;" data-src="https://mmbiz.qpic.cn/mmbiz_png/1Fk759B8md4yPF1ZAnySd6Xqparsv06tG4FibicFOr7moddq2D3087xicOrF9l54yOVLQkkiaWUBheSzFfibyGMgeug/640?wx_fmt=jpeg" src="../Images/98a505e3452ddbcabece44a1b8d641d1.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/1Fk759B8md4yPF1ZAnySd6Xqparsv06tG4FibicFOr7moddq2D3087xicOrF9l54yOVLQkkiaWUBheSzFfibyGMgeug/640?wx_fmt=jpeg"/></p></section><p style="white-space: normal;color: rgb(62, 62, 62);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 16px;text-align: right;"><span style="font-size: 14px;letter-spacing: 2px;word-spacing: 2px;color: rgb(0, 0, 0);">好文章，我</span><span style="color: rgb(160, 160, 160);font-size: 14px;letter-spacing: 2px;word-spacing: 2px;"><span style="color: rgb(255, 41, 65);">在看</span>❤️</span></p></section></section>
