<h1>原来 8 张图，就可以搞懂「零拷贝」了</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzI3NzE0NjcwMg==&amp;mid=2650143442&amp;idx=3&amp;sn=2ad9410af576450e8b617b5e18c154f7&amp;chksm=f36be7f3c41c6ee50b0a775bc20641e1ea005d8f7fa528e6935a5e11b864a1fb3eebdcd1e76d&amp;scene=126&amp;sessionid=1681657510#rd">http://mp.weixin.qq.com/s?__biz=MzI3NzE0NjcwMg==&amp;mid=2650143442&amp;idx=3&amp;sn=2ad9410af576450e8b617b5e18c154f7&amp;chksm=f36be7f3c41c6ee50b0a775bc20641e1ea005d8f7fa528e6935a5e11b864a1fb3eebdcd1e76d&amp;scene=126&amp;sessionid=1681657510#rd</a></blockquote><section data-mpa-powered-by="yiban.io"><figure style="font-size: inherit;color: inherit;line-height: inherit;"/><h2 style="margin-left: 16px;margin-right: 16px;line-height: 2em;text-align: left;"><strong><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 17px;">前言</span></strong></h2><p style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">磁盘可以说是计算机系统最慢的硬件之一，读写速度相差内存 10 倍以上，所以针对优化磁盘的技术非常的多，比如零拷贝、直接 I/O、异步 I/O 等等，这些优化的目的就是为了提高系统的吞吐量，另外操作系统内核中的磁盘高速缓存区，可以有效的减少磁盘的访问次数。</span></p><p style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">这次，我们就以「文件传输」作为切入点，来分析 I/O 工作方式，以及如何优化传输文件的性能。</span></p><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.837360594795539" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mZSdVicTEpickOY2t7YvH3w7V8wktxShYnBuK0IJpRFXfJUSEDH3Ffxtg/640?wx_fmt=png" data-type="png" data-w="1076" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 266px;height: 223px;" title="" src="../Images/95856910f649a264371e570f1b44b438.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mZSdVicTEpickOY2t7YvH3w7V8wktxShYnBuK0IJpRFXfJUSEDH3Ffxtg/640?wx_fmt=png"/></figure><h2 style="margin-left: 16px;margin-right: 16px;line-height: 2em;text-align: left;"><strong><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 17px;"><br/></span></strong></h2><h2 style="margin-left: 16px;margin-right: 16px;line-height: 2em;text-align: left;"><strong><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 17px;">正文</span></strong></h2><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;"/></strong></h3><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;"> </span></strong></h3><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">为什么要有 DMA 技术?</span></strong></h3><p style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">在没有 DMA 技术前，I/O 的过程是这样的：</span></p><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">CPU 发出对应的指令给磁盘控制器，然后返回；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">磁盘控制器收到指令后，于是就开始准备数据，会把数据放入到磁盘控制器的内部缓冲区中，然后产生一个<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">中断</strong>；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">CPU 收到中断信号后，停下手头的工作，接着把磁盘控制器的缓冲区的数据一次一个字节地读进自己的寄存器，然后再把寄存器里的数据写入到内存，而在数据传输的期间 CPU 是无法执行其他任务的。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">为了方便你理解，我画了一副图：</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.587135377711294" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13meibUYyVDUQKQNrp8qAERdb7v0SvHcDGMI6RoSE4y8ibpGqF1agxyDiaiag/640?wx_fmt=png" data-type="png" data-w="1337" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 259px;height: 152px;" title="" src="../Images/c30750a4561c4372e53d941f32a22d3a.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13meibUYyVDUQKQNrp8qAERdb7v0SvHcDGMI6RoSE4y8ibpGqF1agxyDiaiag/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">可以看到，整个数据的传输过程，都要需要 CPU 亲自参与搬运数据的过程，而且这个过程，CPU 是不能做其他事情的。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">简单的搬运几个字符数据那没问题，但是如果我们用千兆网卡或者硬盘传输大量数据的时候，都用 CPU 来搬运的话，肯定忙不过来。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">计算机科学家们发现了事情的严重性后，于是就发明了 DMA 技术，也就是<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">直接内存访问（<em style="font-size: inherit;line-height: inherit;color: rgb(197, 17, 98);">Direct Memory Access</em>）</strong> 技术。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">什么是 DMA 技术？简单理解就是，<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">在进行 I/O 设备和内存的数据传输的时候，数据搬运的工作全部交给 DMA 控制器，而 CPU 不再参与任何与数据搬运相关的事情，这样 CPU 就可以去处理别的事务</strong>。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">那使用 DMA 控制器进行数据传输的过程究竟是什么样的呢？下面我们来具体看看。</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.46943231441048033" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mF08dz9WOND7zqicNq8bs0mOmu2jSaJiaFEJru35teqvibMCxPCLsyp2mg/640?wx_fmt=png" data-type="png" data-w="1832" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 242px;height: 114px;" title="" src="../Images/0a35db38a68b63f915bdbfa3f295b13d.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mF08dz9WOND7zqicNq8bs0mOmu2jSaJiaFEJru35teqvibMCxPCLsyp2mg/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">具体过程：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">用户进程调用 read 方法，向操作系统发出 I/O 请求，请求读取数据到自己的内存缓冲区中，进程进入阻塞状态；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">操作系统收到请求后，进一步将 I/O 请求发送 DMA，然后让 CPU 执行其他任务；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">DMA 进一步将 I/O 请求发送给磁盘；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">磁盘收到 DMA 的 I/O 请求，把数据从磁盘读取到磁盘控制器的缓冲区中，当磁盘控制器的缓冲区被读满后，向 DMA 发起中断信号，告知自己缓冲区已满；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">DMA 收到磁盘的信号，将磁盘控制器缓冲区中的数据拷贝到内核缓冲区中，此时不占用 CPU，CPU 可以执行其他任务</strong>；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">当 DMA 读取了足够多的数据，就会发送中断信号给 CPU；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">CPU 收到 DMA 的信号，知道数据已经准备好，于是将数据从内核拷贝到用户空间，系统调用返回；</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">可以看到， 整个数据传输的过程，CPU 不再参与数据搬运的工作，而是全程由 DMA 完成，但是 CPU 在这个过程中也是必不可少的，因为传输什么数据，从哪里传输到哪里，都需要 CPU 来告诉 DMA 控制器。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">早期 DMA 只存在在主板上，如今由于 I/O 设备越来越多，数据传输的需求也不尽相同，所以每个 I/O 设备里面都有自己的 DMA 控制器。</span></section><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;"> </span></strong></h3><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">传统的文件传输有多糟糕？</span></strong></h3><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">如果服务端要提供文件传输的功能，我们能想到的最简单的方式是：将磁盘上的文件读取出来，然后通过网络协议发送给客户端。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">传统 I/O 的工作方式是，数据读取和写入是从用户空间到内核空间来回复制，而内核空间的数据是通过操作系统层面的 I/O 接口从磁盘读取或写入。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">代码通常如下，一般会需要两个系统调用：</span></section><pre style="font-size: inherit;color: inherit;line-height: inherit;"><section style="font-size: 14px;word-spacing: 0px;letter-spacing: 0px;font-family: Consolas, Inconsolata, Courier, monospace;border-radius: 0px;padding: 0.5em;background-color: rgb(71, 73, 73);color: rgb(209, 217, 225);margin-left: 16px;margin-right: 16px;line-height: 2em;overflow-wrap: normal !important;word-break: normal !important;overflow-x: auto !important;overflow-y: auto;display: -webkit-box !important;"><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 12px;">read(file, tmp_buf, len);<br/>write(socket, tmp_buf, len);</span></section></pre><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">代码很简单，虽然就两行代码，但是这里面发生了不少的事情。</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.6163636363636363" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mZLjg2kJB3GQu4AVtqncaSnSV8YVhTMqkxO1Q5ZAWIVY8QkQDwVkW3w/640?wx_fmt=png" data-type="png" data-w="1100" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 251px;height: 155px;" title="" src="../Images/0910503113cbb9f508ccc32369a53d49.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mZLjg2kJB3GQu4AVtqncaSnSV8YVhTMqkxO1Q5ZAWIVY8QkQDwVkW3w/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">首先，期间共<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">发生了 4 次用户态与内核态的上下文切换</strong>，因为发生了两次系统调用，一次是 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">read()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> ，一次是 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">write()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">，每次系统调用都得先从用户态切换到内核态，等内核完成任务后，再从内核态切换回用户态。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">上下文切换到成本并不小，一次切换需要耗时几十纳秒到几微秒，虽然时间看上去很短，但是在高并发的场景下，这类时间容易被累积和放大，从而影响系统的性能。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">其次，还<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">发生了 4 次数据拷贝</strong>，其中两次是 DMA 的拷贝，另外两次则是通过 CPU 拷贝的，下面说一下这个过程：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">第一次拷贝</em>，把磁盘上的数据拷贝到操作系统内核的缓冲区里，这个拷贝的过程是通过 DMA 搬运的。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">第二次拷贝</em>，把内核缓冲区的数据拷贝到用户的缓冲区里，于是我们应用程序就可以使用这部分数据了，这个拷贝到过程是由 CPU 完成的。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">第三次拷贝</em>，把刚才拷贝到用户的缓冲区里的数据，再拷贝到内核的 socket 的缓冲区里，这个过程依然还是由 CPU 搬运的。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">第四次拷贝</em>，把内核的 socket 缓冲区里的数据，拷贝到网卡的缓冲区里，这个过程又是由 DMA 搬运的。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">我们回过头看这个文件传输的过程，我们只是搬运一份数据，结果却搬运了 4 次，过多的数据拷贝无疑会消耗 CPU 资源，大大降低了系统性能。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">这种简单又传统的文件传输方式，存在冗余的上文切换和数据拷贝，在高并发系统里是非常糟糕的，多了很多不必要的开销，会严重影响系统性能。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">所以，<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">要想提高文件传输的性能，就需要减少「用户态与内核态的上下文切换」和「内存拷贝」的次数</strong>。</span></section><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;"> </span></strong></h3><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">如何优化文件传输的性能？</span></strong></h3><blockquote style="line-height: inherit;padding: 15px 15px 15px 1rem;font-size: 0.9em;color: rgb(0, 0, 0);border-left-width: 5px;border-left-color: rgb(100, 149, 237);background-color: rgb(227, 242, 253);overflow: auto;overflow-wrap: normal;word-break: normal;"><section style="font-size: inherit;color: inherit;margin-left: 16px;margin-right: 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">先来看看，如何减少「用户态与内核态的上下文切换」的次数呢？</span></section></blockquote><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">读取磁盘数据的时候，之所以要发生上下文切换，这是因为用户空间没有权限操作磁盘或网卡，内核的权限最高，这些操作设备的过程都需要交由操作系统内核来完成，所以一般要通过内核去完成某些任务的时候，就需要使用操作系统提供的系统调用函数。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">而一次系统调用必然会发生 2 次上下文切换：首先从用户态切换到内核态，当内核执行完任务后，再切换回用户态交由进程代码执行。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">所以，<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">要想减少上下文切换到次数，就要减少系统调用的次数</strong>。</span></section><blockquote style="line-height: inherit;padding: 15px 15px 15px 1rem;font-size: 0.9em;color: rgb(0, 0, 0);border-left-width: 5px;border-left-color: rgb(100, 149, 237);background-color: rgb(227, 242, 253);overflow: auto;overflow-wrap: normal;word-break: normal;"><section style="font-size: inherit;color: inherit;margin-left: 16px;margin-right: 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">再来看看，如何减少「数据拷贝」的次数？</span></section></blockquote><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">在前面我们知道了，传统的文件传输方式会历经 4 次数据拷贝，而且这里面，「从内核的读缓冲区拷贝到用户的缓冲区里，再从用户的缓冲区里拷贝到 socket 的缓冲区里」，这个过程是没有必要的。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">因为文件传输的应用场景中，在用户空间我们并不会对数据「再加工」，所以数据实际上可以不用搬运到用户空间，因此<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">用户的缓冲区是没有必要存在的</strong>。</span></section><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;"> </span></strong></h3><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">如何实现零拷贝？</span></strong></h3><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">零拷贝技术实现的方式通常有 2 种：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">mmap + write</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">sendfile</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">下面就谈一谈，它们是如何减少「上下文切换」和「数据拷贝」的次数。</span></section><h4 style="color: inherit;margin: 1.6em 16px;font-weight: bold;font-size: 1.2em;line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">mmap + write</span></h4><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">在前面我们知道，</span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">read()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 系统调用的过程中会把内核缓冲区的数据拷贝到用户的缓冲区里，于是为了减少这一步开销，我们可以用 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">mmap()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 替换 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">read()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 系统调用函数。</span></section><pre style="font-size: inherit;color: inherit;line-height: inherit;"><section style="font-size: 14px;word-spacing: 0px;letter-spacing: 0px;font-family: Consolas, Inconsolata, Courier, monospace;border-radius: 0px;padding: 0.5em;background-color: rgb(71, 73, 73);color: rgb(209, 217, 225);margin-left: 16px;margin-right: 16px;line-height: 2em;overflow-wrap: normal !important;word-break: normal !important;overflow-x: auto !important;overflow-y: auto;display: -webkit-box !important;"><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 12px;">buf = mmap(file, len);<br/>write(sockfd, buf, len);</span></section></pre><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">mmap()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 系统调用函数会直接把内核缓冲区里的数据「<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">映射</strong>」到用户空间，这样，操作系统内核与用户空间就不需要再进行任何的数据拷贝操作。</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.6154545454545455" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mokPruysrVuhMBbPeLsoFylbxLo07NGXLqyzKZfHI3r29kdqkDaImsQ/640?wx_fmt=png" data-type="png" data-w="1100" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 242px;height: 149px;" title="" src="../Images/a5e475e4999380f4c6b1045c9259c7bc.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mokPruysrVuhMBbPeLsoFylbxLo07NGXLqyzKZfHI3r29kdqkDaImsQ/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">具体过程如下：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: inherit;color: inherit;line-height: inherit;margin-bottom: 0.5em;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">应用进程调用了 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">mmap()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 后，DMA 会把磁盘的数据拷贝到内核的缓冲区里。接着，应用进程跟操作系统内核「共享」这个缓冲区；</span></section></li><li style="font-size: inherit;color: inherit;line-height: inherit;margin-bottom: 0.5em;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">应用进程再调用 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">write()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">，操作系统直接将内核缓冲区的数据拷贝到 socket 缓冲区中，这一切都发生在内核态，由 CPU 来搬运数据；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">最后，把内核的 socket 缓冲区里的数据，拷贝到网卡的缓冲区里，这个过程是由 DMA 搬运的。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">我们可以得知，通过使用 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">mmap()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 来代替 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">read()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">， 可以减少一次数据拷贝的过程。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">但这还不是最理想的零拷贝，因为仍然需要通过 CPU 把内核缓冲区的数据拷贝到 socket 缓冲区里，而且仍然需要 4 次上下文切换，因为系统调用还是 2 次。</span></section><h4 style="color: inherit;margin: 1.6em 16px;font-weight: bold;font-size: 1.2em;line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">sendfile</span></h4><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">在 Linux 内核版本 2.1 中，提供了一个专门发送文件的系统调用函数 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">sendfile()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">，函数形式如下：</span></section><pre style="font-size: inherit;color: inherit;line-height: inherit;"><section style="font-size: 14px;word-spacing: 0px;letter-spacing: 0px;font-family: Consolas, Inconsolata, Courier, monospace;border-radius: 0px;padding: 0.5em;background-color: rgb(71, 73, 73);color: rgb(209, 217, 225);margin-left: 16px;margin-right: 16px;line-height: 2em;overflow-wrap: normal !important;word-break: normal !important;overflow-x: auto !important;overflow-y: auto;display: -webkit-box !important;"><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 12px;"><span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(249, 145, 87);overflow-wrap: inherit !important;word-break: inherit !important;">#<span style="letter-spacing: 1px;font-family: Optima-Regular, PingFangTC-light;color: inherit;line-height: inherit;overflow-wrap: inherit !important;word-break: inherit !important;">include</span> <span style="letter-spacing: 1px;font-family: Optima-Regular, PingFangTC-light;color: inherit;line-height: inherit;overflow-wrap: inherit !important;word-break: inherit !important;">&lt;sys/socket.h&gt;</span></span><br/><span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">ssize_t</span> sendfile(<span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">int</span> out_fd, <span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">int</span> in_fd, <span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">off_t</span> *offset, <span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">size_t</span> count);</span></section></pre><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">它的前两个参数分别是目的端和源端的文件描述符，后面两个参数是源端的偏移量和复制数据的长度，返回值是实际复制数据的长度。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">首先，它可以替代前面的 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">read()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 和 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">write()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 这两个系统调用，这样就可以减少一次系统调用，也就减少了 2 次上下文切换的开销。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">其次，该系统调用，可以直接把内核缓冲区里的数据拷贝到 socket 缓冲区里，不再拷贝到用户态，这样就只有 2 次上下文切换，和 3 次数据拷贝。如下图：</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.6236363636363637" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mD19b7SCEuj1icTmFg5kg4xmIq0vqhqKVM1o7oISMaZxoUcKCl7yGwvg/640?wx_fmt=png" data-type="png" data-w="1100" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 257px;height: 160px;" title="" src="../Images/e56b6a3c74102ab3470e0defa1e79624.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mD19b7SCEuj1icTmFg5kg4xmIq0vqhqKVM1o7oISMaZxoUcKCl7yGwvg/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">但是这还不是真正的零拷贝技术，如果网卡支持 SG-DMA（<em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">The Scatter-Gather Direct Memory Access</em>）技术（和普通的 DMA 有所不同），我们可以进一步减少通过 CPU 把内核缓冲区里的数据拷贝到 socket 缓冲区的过程。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">你可以在你的 Linux 系统通过下面这个命令，查看网卡是否支持 scatter-gather 特性：</span></section><pre style="font-size: inherit;color: inherit;line-height: inherit;"><section style="font-size: 14px;word-spacing: 0px;letter-spacing: 0px;font-family: Consolas, Inconsolata, Courier, monospace;border-radius: 0px;padding: 0.5em;background-color: rgb(71, 73, 73);color: rgb(209, 217, 225);margin-left: 16px;margin-right: 16px;line-height: 2em;overflow-wrap: normal !important;word-break: normal !important;overflow-x: auto !important;overflow-y: auto;display: -webkit-box !important;"><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 12px;">$ ethtool -k eth0 | grep scatter-gather<br/>scatter-gather: on</span></section></pre><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">于是，从 Linux 内核 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">2.4</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 版本开始起，对于支持网卡支持 SG-DMA 技术的情况下， </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">sendfile()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 系统调用的过程发生了点变化，具体过程如下：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">第一步，通过 DMA 将磁盘上的数据拷贝到内核缓冲区里；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">第二步，缓冲区描述符和数据长度传到 socket 缓冲区，这样网卡的 SG-DMA 控制器就可以直接将内核缓存中的数据拷贝到网卡的缓冲区里，此过程不需要将数据从操作系统内核缓冲区拷贝到 socket 缓冲区中，这样就减少了一次数据拷贝；</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">所以，这个过程之中，只进行了 2 次数据拷贝，如下图：</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.5913793103448276" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13m9aUVVJ2BT9QBoPQqB1iaTSn4kSL1sR9sQYLGbsPxticvZgIptotGT3Ng/640?wx_fmt=png" data-type="png" data-w="1160" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 246px;height: 146px;" title="" src="../Images/51735dd527e97e89c784bf47d2ca532e.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13m9aUVVJ2BT9QBoPQqB1iaTSn4kSL1sR9sQYLGbsPxticvZgIptotGT3Ng/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">这就是所谓的<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">零拷贝（<em style="font-size: inherit;line-height: inherit;color: rgb(197, 17, 98);">Zero-copy</em>）技术，因为我们没有在内存层面去拷贝数据，也就是说全程没有通过 CPU 来搬运数据，所有的数据都是通过 DMA 来进行传输的。</strong></span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">零拷贝技术的文件传输方式相比传统文件传输的方式，减少了 2 次上下文切换和数据拷贝次数，<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">只需要 2 次上下文切换和数据拷贝次数，就可以完成文件的传输，而且 2 次的数据拷贝过程，都不需要通过 CPU，2 次都是由 DMA 来搬运。</strong></span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">所以，总体来看，<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">零拷贝技术可以把文件传输的性能提高至少一倍以上</strong>。</span></section><h4 style="color: inherit;margin: 1.6em 16px;font-weight: bold;font-size: 1.2em;line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">使用零拷贝技术的项目</span></h4><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">事实上，Kafka 这个开源项目，就利用了「零拷贝」技术，从而大幅提升了 I/O 的吞吐率，这也是 Kafka 在处理海量数据为什么这么快的原因之一。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">如果你追溯 Kafka 文件传输的代码，你会发现，最终它调用了 Java NIO 库里的 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">transferTo</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">方法：</span></section><pre style="font-size: inherit;color: inherit;line-height: inherit;"><section style="font-size: 14px;word-spacing: 0px;letter-spacing: 0px;font-family: Consolas, Inconsolata, Courier, monospace;border-radius: 0px;padding: 0.5em;background-color: rgb(71, 73, 73);color: rgb(209, 217, 225);margin-left: 16px;margin-right: 16px;line-height: 2em;overflow-wrap: normal !important;word-break: normal !important;overflow-x: auto !important;overflow-y: auto;display: -webkit-box !important;"><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 12px;"><span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(249, 145, 87);overflow-wrap: inherit !important;word-break: inherit !important;">@Overridepublic</span> <br/><span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;color: inherit;line-height: inherit;overflow-wrap: inherit !important;word-break: inherit !important;"><span style="letter-spacing: 1px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">long</span> <span style="letter-spacing: 1px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(181, 189, 104);overflow-wrap: inherit !important;word-break: inherit !important;">transferFrom</span><span style="letter-spacing: 1px;font-family: Optima-Regular, PingFangTC-light;color: inherit;line-height: inherit;overflow-wrap: inherit !important;word-break: inherit !important;">(FileChannel fileChannel, <span style="letter-spacing: 1px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">long</span> position, <span style="letter-spacing: 1px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">long</span> count)</span> <span style="letter-spacing: 1px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">throws</span> IOException </span>{ <br/>    <span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">return</span> fileChannel.transferTo(position, count, socketChannel);<br/>}</span></section></pre><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">如果 Linux 系统支持 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">sendfile()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 系统调用，那么 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">transferTo()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 实际上最后就会使用到 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">sendfile()</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 系统调用函数。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">曾经有大佬专门写过程序测试过，在同样的硬件条件下，传统文件传输和零拷拷贝文件传输的性能差异，你可以看到下面这张测试数据图，使用了零拷贝能够缩短 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">65%</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 的时间，大幅度提升了机器传输数据的吞吐量。</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.5753246753246753" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mhTlxbSsiaomH4NJssiasze8f0m9e4Gm6iaulpafmjRfsiayIv1ib1mg9ia3w/640?wx_fmt=png" data-type="png" data-w="770" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 231px;height: 133px;" title="数据来源于：https://developer.ibm.com/articles/j-zerocopy/" src="../Images/ee09d3852dd9edc94ac18c722f77b4d6.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mhTlxbSsiaomH4NJssiasze8f0m9e4Gm6iaulpafmjRfsiayIv1ib1mg9ia3w/640?wx_fmt=png"/><section style="margin-top: 10px;text-align: center;color: rgb(153, 153, 153);font-size: 0.7em;margin-left: 16px;margin-right: 16px;line-height: 2em;"><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 12px;">数据来源于：https://developer.ibm.com/articles/j-zerocopy/</span></section></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">另外，Nginx 也支持零拷贝技术，一般默认是开启零拷贝技术，这样有利于提高文件传输的效率，是否开启零拷贝技术的配置如下：</span></section><pre style="font-size: inherit;color: inherit;line-height: inherit;"><section style="font-size: 14px;word-spacing: 0px;letter-spacing: 0px;font-family: Consolas, Inconsolata, Courier, monospace;border-radius: 0px;padding: 0.5em;background-color: rgb(71, 73, 73);color: rgb(209, 217, 225);margin-left: 16px;margin-right: 16px;line-height: 2em;overflow-wrap: normal !important;word-break: normal !important;overflow-x: auto !important;overflow-y: auto;display: -webkit-box !important;"><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 12px;">http {<br/><span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">...</span><br/>    sendfile on<br/><span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">...</span><br/>}</span></section></pre><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">sendfile 配置的具体意思: </span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">设置为 on 表示，使用零拷贝技术来传输文件：sendfile ，这样只需要 2 次上下文切换，和 2 次数据拷贝。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">设置为 off 表示，使用传统的文件传输技术：read + write，这时就需要 4 次上下文切换，和 4 次数据拷贝。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">当然，要使用 sendfile，Linux 内核版本必须要 2.1 以上的版本。</span></section><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;"> </span></strong></h3><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">PageCache 有什么作用？</span></strong></h3><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">回顾前面说道文件传输过程，其中第一步都是先需要先把磁盘文件数据拷贝「内核缓冲区」里，这个「内核缓冲区」实际上是<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">磁盘高速缓存（<em style="font-size: inherit;line-height: inherit;color: rgb(197, 17, 98);">PageCache</em>）</strong>。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">由于零拷贝使用了 PageCache 技术，可以使得零拷贝进一步提升了性能，我们接下来看看 PageCache 是如何做到这一点的。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">读写磁盘相比读写内存的速度慢太多了，所以我们应该想办法把「读写磁盘」替换成「读写内存」。于是，我们会通过 DMA 把磁盘里的数据搬运到内存里，这样就可以用读内存替换读磁盘。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">但是，内存空间远比磁盘要小，内存注定只能拷贝磁盘里的一小部分数据。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">那问题来了，选择哪些磁盘数据拷贝到内存呢？</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">我们都知道程序运行的时候，具有「局部性」，所以通常，刚被访问的数据在短时间内再次被访问的概率很高，于是我们可以用 <strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">PageCache 来缓存最近被访问的数据</strong>，当空间不足时淘汰最久未被访问的缓存。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">所以，读磁盘数据的时候，优先在 PageCache 找，如果数据存在则可以直接返回；如果没有，则从磁盘中读取，然后缓存 PageCache 中。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">还有一点，读取磁盘数据的时候，需要找到数据所在的位置，但是对于机械磁盘来说，就是通过磁头旋转到数据所在的扇区，再开始「顺序」读取数据，但是旋转磁头这个物理动作是非常耗时的，为了降低它的影响，<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">PageCache 使用了「预读功能」</strong>。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">比如，假设 read 方法每次只会读 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">32 KB</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 的字节，虽然 read 刚开始只会读 0 ～ 32 KB 的字节，但内核会把其后面的 32～64 KB 也读取到 PageCache，这样后面读取 32～64 KB 的成本就很低，如果在 32～64 KB 淘汰出 PageCache 前，进程读取到它了，收益就非常大。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">所以，PageCache 的优点主要是两个：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">缓存最近被访问的数据；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">预读功能；</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">这两个做法，将大大提高读写磁盘的性能。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">但是，在传输大文件（GB 级别的文件）的时候，PageCache 会不起作用，那就白白浪费 DMA 多做的一次数据拷贝，造成性能的降低，即使使用了 PageCache 的零拷贝也会损失性能</strong></span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">这是因为如果你有很多 GB 级别文件需要传输，每当用户访问这些大文件的时候，内核就会把它们载入 PageCache 中，于是 PageCache 空间很快被这些大文件占满。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">另外，由于文件太大，可能某些部分的文件数据被再次访问的概率比较低，这样就会带来 2 个问题：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">PageCache 由于长时间被大文件占据，其他「热点」的小文件可能就无法充分使用到 PageCache，于是这样磁盘读写的性能就会下降了；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">PageCache 中的大文件数据，由于没有享受到缓存带来的好处，但却耗费 DMA 多拷贝到 PageCache 一次；</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">所以，针对大文件的传输，不应该使用 PageCache，也就是说不应该使用零拷贝技术，因为可能由于 PageCache 被大文件占据，而导致「热点」小文件无法利用到 PageCache，这样在高并发的环境下，会带来严重的性能问题。</span></section><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;"> </span></strong></h3><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">大文件传输用什么方式实现？</span></strong></h3><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">那针对大文件的传输，我们应该使用什么方式呢？</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">我们先来看看最初的例子，当调用 read 方法读取文件时，进程实际上会阻塞在 read 方法调用，因为要等待磁盘数据的返回，如下图：</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.6784788245462403" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mHFCujA3ZVY30WuLe0DlET6aUyKZxOhUn98UyRicQ8DkZibAfxYvCY6Iw/640?wx_fmt=png" data-type="png" data-w="1157" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 212px;height: 144px;" title="" src="../Images/1deb75cabe60ab82358f3348223cb414.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mHFCujA3ZVY30WuLe0DlET6aUyKZxOhUn98UyRicQ8DkZibAfxYvCY6Iw/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">具体过程：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">当调用 read 方法时，会阻塞着，此时内核会向磁盘发起 I/O 请求，磁盘收到请求后，便会寻址，当磁盘数据准备好后，就会向内核发起 I/O 中断，告知内核磁盘数据已经准备好；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">内核收到 I/O 中断后，就将数据从磁盘控制器缓冲区拷贝到 PageCache 里；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">最后，内核再把 PageCache 中的数据拷贝到用户缓冲区，于是 read 调用就正常返回了。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">对于阻塞的问题，可以用异步 I/O 来解决，它工作方式如下图：</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.5986787778695293" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mmKwMQ1fXJDHkv5yolSib8waibP04xBXEPfibXoW6jFick0RmZOR77iaaeIw/640?wx_fmt=png" data-type="png" data-w="1211" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 238px;height: 143px;" title="" src="../Images/435ae53239eaf2181db9224677506898.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZcHKiczImueTBjnrXSnRM13mmKwMQ1fXJDHkv5yolSib8waibP04xBXEPfibXoW6jFick0RmZOR77iaaeIw/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">它把读操作分为两部分：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">前半部分，内核向磁盘发起读请求，但是可以<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">不等待数据就位就可以返回</strong>，于是进程此时可以处理其他任务；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">后半部分，当内核将磁盘中的数据拷贝到进程缓冲区后，进程将接收到内核的<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">通知</strong>，再去处理数据；</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">而且，我们可以发现，异步 I/O 并没有涉及到 PageCache，所以使用异步 I/O 就意味着要绕开 PageCache。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">绕开 PageCache 的 I/O 叫直接 I/O，使用 PageCache 的 I/O 则叫缓存 I/O。通常，对于磁盘，异步 I/O 只支持直接 I/O。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">前面也提到，大文件的传输不应该使用 PageCache，因为可能由于 PageCache 被大文件占据，而导致「热点」小文件无法利用到 PageCache。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">于是，<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">在高并发的场景下，针对大文件的传输的方式，应该使用「异步 I/O + 直接 I/O」来替代零拷贝技术</strong>。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">直接 I/O 应用场景常见的两种：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">应用程序已经实现了磁盘数据的缓存，那么可以不需要 PageCache 再次缓存，减少额外的性能损耗。在 MySQL 数据库中，可以通过参数设置开启直接 I/O，默认是不开启；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">传输大文件的时候，由于大文件难以命中 PageCache 缓存，而且会占满 PageCache 导致「热点」文件无法充分利用缓存，从而增大了性能开销，因此，这时应该使用直接 I/O。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">另外，由于直接 I/O 绕过了 PageCache，就无法享受内核的这两点的优化：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">内核的 I/O 调度算法会缓存尽可能多的 I/O 请求在 PageCache 中，最后「<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">合并</strong>」成一个更大的 I/O 请求再发给磁盘，这样做是为了减少磁盘的寻址操作；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">内核也会「<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">预读</strong>」后续的 I/O 请求放在 PageCache 中，一样是为了减少对磁盘的操作；</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">于是，传输大文件的时候，使用「异步 I/O + 直接 I/O」了，就可以无阻塞地读取文件了。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">所以，传输文件的时候，我们要根据文件的大小来使用不同的方式：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">传输大文件的时候，使用「异步 I/O + 直接 I/O」；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">传输小文件的时候，则使用「零拷贝技术」；</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">在 Nginx 中，我们可以用如下配置，来根据文件的大小来使用不同的方式：</span></section><pre style="font-size: inherit;color: inherit;line-height: inherit;"><section style="font-size: 14px;word-spacing: 0px;letter-spacing: 0px;font-family: Consolas, Inconsolata, Courier, monospace;border-radius: 0px;padding: 0.5em;background-color: rgb(71, 73, 73);color: rgb(209, 217, 225);margin-left: 16px;margin-right: 16px;line-height: 2em;overflow-wrap: normal !important;word-break: normal !important;overflow-x: auto !important;overflow-y: auto;display: -webkit-box !important;"><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 12px;"><span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(129, 162, 190);overflow-wrap: inherit !important;word-break: inherit !important;">location</span> /video/ { <br/>    <span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(129, 162, 190);overflow-wrap: inherit !important;word-break: inherit !important;">sendfile</span> <span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">on</span>; <br/>    <span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(129, 162, 190);overflow-wrap: inherit !important;word-break: inherit !important;">aio</span> <span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(204, 153, 204);overflow-wrap: inherit !important;word-break: inherit !important;">on</span>; <br/>    <span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(129, 162, 190);overflow-wrap: inherit !important;word-break: inherit !important;">directio</span> <span style="letter-spacing: 1px;font-size: 12px;font-family: Optima-Regular, PingFangTC-light;line-height: inherit;color: rgb(249, 145, 87);overflow-wrap: inherit !important;word-break: inherit !important;">1024m</span>; <br/>}</span></section></pre><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">当文件大小大于 </span><code style="font-size: inherit;line-height: inherit;word-wrap: break-word;padding: 2px 4px;border-top-left-radius: 4px;border-top-right-radius: 4px;border-bottom-right-radius: 4px;border-bottom-left-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background-color: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">directio</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 值后，使用「异步 I/O + 直接 I/O」，否则使用「零拷贝技术」。</span></section><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;"> </span></strong></h3><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">总结</span></strong></h3><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">早期 I/O 操作，内存与磁盘的数据传输的工作都是由 CPU 完成的，而此时 CPU 不能执行其他任务，会特别浪费 CPU 资源。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">于是，为了解决这一问题，DMA 技术就出现了，每个 I/O 设备都有自己的 DMA 控制器，通过这个 DMA 控制器，CPU 只需要告诉 DMA 控制器，我们要传输什么
