<h1>键盘敲入 A 字母时，操作系统期间发生了什么...</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzI3NzE0NjcwMg==&amp;mid=2650141298&amp;idx=3&amp;sn=d1cd32443ed5caa9debe47dbd7e76cd9&amp;chksm=f36bef53c41c6645097b30e97c73e4311a40f08c51c3bae91b7d3bb5e101e1480aafbe1a83f8&amp;scene=126&amp;sessionid=1681657526#rd">http://mp.weixin.qq.com/s?__biz=MzI3NzE0NjcwMg==&amp;mid=2650141298&amp;idx=3&amp;sn=d1cd32443ed5caa9debe47dbd7e76cd9&amp;chksm=f36bef53c41c6645097b30e97c73e4311a40f08c51c3bae91b7d3bb5e101e1480aafbe1a83f8&amp;scene=126&amp;sessionid=1681657526#rd</a></blockquote><section data-mpa-powered-by="yiban.io"><figure style="font-size: inherit;color: inherit;line-height: inherit;"/><h2 style="margin-left: 16px;margin-right: 16px;line-height: 2em;text-align: left;"><strong><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 17px;">前言</span></strong></h2><p style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">键盘可以说是我们最常使用的输入硬件设备了，但身为程序员的你，你知道「<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">键盘敲入 A 字母时，操作系统期间发生了什么吗</strong>」？</span></p><p style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">那要想知道这个发生的过程，我们得先了解了解「操作系统是如何管理多种多样的的输入输出设备」的，等了解完这个后，我们再来看看这个问题，你就会发现问题已经被迎刃而解了。</span></p><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.6996951219512195" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWpWnT9fsic2nzWXSWTgEDypB1YAnLoKxaYxFBDA2BdOoxmBM0Cia2Ww9g/640?wx_fmt=png" data-type="png" data-w="1312" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 256px;height: 179px;" title="" src="../Images/9b9315197933c806a3773d8404270a89.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWpWnT9fsic2nzWXSWTgEDypB1YAnLoKxaYxFBDA2BdOoxmBM0Cia2Ww9g/640?wx_fmt=png"/></figure><hr style="font-size: inherit;color: inherit;line-height: inherit;height: 1px;margin-top: 1.5rem;margin-bottom: 1.5rem;border-right: none;border-bottom: none;border-left: none;border-top-style: dashed;border-top-color: rgb(165, 165, 165);"/><h2 style="margin-left: 16px;margin-right: 16px;line-height: 2em;text-align: left;"><strong><span style="font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;font-size: 17px;">正文</span></strong></h2><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">设备控制器</span></strong></h3><p style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">我们的电脑设备可以接非常多的输入输出设备，比如键盘、鼠标、显示器、网卡、硬盘、打印机、音响等等，每个设备的用法和功能都不同，那操作系统是如何把这些输入输出设备统一管理的呢?</span></p><p style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">为了屏蔽设备之间的差异，每个设备都有一个叫<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">设备控制器（<em style="font-size: inherit;line-height: inherit;color: rgb(197, 17, 98);">Device Control</em>）</strong> 的组件，比如硬盘有硬盘控制器、显示器有视频控制器等。</span></p><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="1.1298299845440494" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWXIjMo48H5diaDnZkw2ZXoWQhYRBXJvG9Sl0Cx6Vda1Iu7spUSdhh4VQ/640?wx_fmt=png" data-type="png" data-w="647" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 240px;height: 271px;" title="计算机 I/O 系统结构" src="../Images/85532314edec6553eefcd3858ce00826.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWXIjMo48H5diaDnZkw2ZXoWQhYRBXJvG9Sl0Cx6Vda1Iu7spUSdhh4VQ/640?wx_fmt=png"/><p style="margin-top: 10px;text-align: center;color: rgb(153, 153, 153);font-size: 0.7em;margin-left: 16px;margin-right: 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">计算机 I/O 系统结构</span></p></figure><p style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">因为这些控制器都很清楚的知道对应设备的用法和功能，所以 CPU 是通过设备控制器来和设备打交道的。</span></p><p style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">设备控制器里有芯片，它可执行自己的逻辑，也有自己的寄存器，用来与 CPU 进行通信，比如：</span></p><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">通过写入这些寄存器，操作系统可以命令设备发送数据、接收数据、开启或关闭，或者执行某些其他操作。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">通过读取这些寄存器，操作系统可以了解设备的状态，是否准备好接收一个新的命令等。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">实际上，控制器是有三类寄存器，它们分别是<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">状态寄存器（<em style="font-size: inherit;line-height: inherit;color: rgb(197, 17, 98);">Status Register</em>）</strong>、 <strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">命令寄存器（<em style="font-size: inherit;line-height: inherit;color: rgb(197, 17, 98);">Command Register</em>）</strong>以及<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">数据寄存器（<em style="font-size: inherit;line-height: inherit;color: rgb(197, 17, 98);">Data Register</em>）</strong>，如下图：</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.69004329004329" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zW5gMTcETQkGhF2jb9z0uGWQwGVianr8fA1eMpUsTMwoOnlFeicjD1JGnQ/640?wx_fmt=png" data-type="png" data-w="1155" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 316px;height: 218px;" title="" src="../Images/2439572ec85b067f3fc16ac24b9d47b0.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zW5gMTcETQkGhF2jb9z0uGWQwGVianr8fA1eMpUsTMwoOnlFeicjD1JGnQ/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">这三个寄存器的作用：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">数据寄存器</em>，CPU 向 I/O 设备写入需要传输的数据，比如要打印的内容是「Hello」，CPU 就要先发送一个 H 字符给到对应的 I/O 设备。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">命令寄存器</em>，CPU 发送一个命令，告诉 I/O 设备，要进行输入/输出操作，于是就会交给 I/O 设备去工作，任务完成后，会把状态寄存器里面的状态标记为完成。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">状态寄存器</em>，目的是告诉 CPU ，现在已经在工作或工作已经完成，如果已经在工作状态，CPU 再发送数据或者命令过来，都是没有用的，直到前面的工作已经完成，状态寄存标记成已完成，CPU 才能发送下一个字符和命令。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">CPU 通过读、写设备控制器中的寄存器来控制设备，这可比 CPU 直接控制输入输出设备，要方便和标准很多。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">另外， 输入输出设备可分为两大类 ：<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">块设备（<em style="font-size: inherit;line-height: inherit;color: rgb(197, 17, 98);">Block Device</em>）</strong>和<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">字符设备（<em style="font-size: inherit;line-height: inherit;color: rgb(197, 17, 98);">Character Device</em>）</strong>。</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">块设备</em>，把数据存储在固定大小的块中，每个块有自己的地址，硬盘、USB 是常见的块设备。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">字符设备</em>，以字符为单位发送或接收一个字符流，字符设备是不可寻址的，也没有任何寻道操作，鼠标是常见的字符设备。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">块设备通常传输的数据量会非常大，于是控制器设立了一个可读写的<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">数据缓冲区</strong>。</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">CPU 写入数据到控制器的缓冲区时，当缓冲区的数据囤够了一部分，才会发给设备。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">CPU 从控制器的缓冲区读取数据时，也需要缓冲区囤够了一部分，才拷贝到内存。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">这样做是为了，减少对设备的操作次数。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">那 CPU 是如何与设备的控制寄存器和数据缓冲区进行通信的？存在两个方法：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: inherit;color: inherit;line-height: inherit;margin-bottom: 0.5em;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">端口 I/O</em>，每个控制寄存器被分配一个 I/O 端口，可以通过特殊的汇编指令操作这些寄存器，比如 </span><code style="font-size: inherit;line-height: inherit;overflow-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">in/out</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 类似的指令。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><em style="font-size: inherit;line-height: inherit;color: rgb(98, 0, 234);">内存映射 I/O</em>，将所有控制寄存器映射到内存空间中，这样就可以像读写内存一样读写数据缓冲区。</span></section></li></ul><hr style="font-size: inherit;color: inherit;line-height: inherit;height: 1px;margin-top: 1.5rem;margin-bottom: 1.5rem;border-right: none;border-bottom: none;border-left: none;border-top-style: dashed;border-top-color: rgb(165, 165, 165);"/><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">I/O 控制方式</span></strong></h3><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">在前面我知道，每种设备都有一个设备控制器，控制器相当于一个小 CPU，它可以自己处理一些事情，但有个问题是，当 CPU 给设备发送了一个指令，让设备控制器去读设备的数据，它读完的时候，要怎么通知 CPU 呢？</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">控制器的寄存器一般会有状态标记位，用来标识输入或输出操作是否完成。于是，我们想到第一种<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">轮询等待</strong>的方法，让 CPU 一直查寄存器的状态，直到状态标记为完成，很明显，这种方式非常的傻瓜，它会占用 CPU 的全部时间。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">那我们就想到第二种方法 —— <strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">中断</strong>，通知操作系统数据已经准备好了。我们一般会有一个硬件的<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">中断控制器</strong>，当设备完成任务后触发中断到中断控制器，中断控制器就通知 CPU，一个中断产生了，CPU 需要停下当前手里的事情来处理中断。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">另外，中断有两种，一种<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">软中断</strong>，例如代码调用 </span><code style="font-size: inherit;line-height: inherit;overflow-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">INT</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 指令触发，一种是<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">硬件中断</strong>，就是硬件通过中断控制器触发的。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">但中断的方式对于频繁读写数据的磁盘，并不友好，这样 CPU 容易经常被打断，会占用 CPU 大量的时间。对于这一类设备的问题的解决方法是使用 <strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">DMA（<em style="font-size: inherit;line-height: inherit;color: rgb(197, 17, 98);">Direct Memory Access</em>）</strong> 功能，它可以使得设备在 CPU 不参与的情况下，能够自行完成把设备 I/O 数据放入到内存。那要实现 DMA 功能要有 「DMA 控制器」硬件的支持。</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.3595505617977528" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zW8FUlBeIiaYPZdJapAhRK9wccv2POGXnFIc3fmpumibMhiaAfH1lWwsLGA/640?wx_fmt=png" data-type="png" data-w="1335" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 325px;height: 117px;" title="" src="../Images/9c3272491ba4067f9dcdde9598cabb73.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zW8FUlBeIiaYPZdJapAhRK9wccv2POGXnFIc3fmpumibMhiaAfH1lWwsLGA/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">DMA 的工作方式如下：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">CPU 需对 DMA 控制器下发指令，告诉它想读取多少数据，读完的数据放在内存的某个地方就可以了；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">接下来，DMA 控制器会向磁盘控制器发出指令，通知它从磁盘读数据到其内部的缓冲区中，接着磁盘控制器将缓冲区的数据传输到内存；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">当磁盘控制器把数据传输到内存的操作完成后，磁盘控制器在总线上发出一个确认成功的信号到 DMA 控制器；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">DMA 控制器收到信号后，DMA 控制器发中断通知 CPU 指令完成，CPU 就可以直接用内存里面现成的数据了；</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">可以看到， CPU 当要读取磁盘数据的时候，只需给 DMA 控制器发送指令，然后返回去做其他事情，当磁盘数据拷贝到内存后，DMA 控制机器通过中断的方式，告诉 CPU 数据已经准备好了，可以从内存读数据了。仅仅在传送开始和结束时需要 CPU 干预。</span></section><hr style="font-size: inherit;color: inherit;line-height: inherit;height: 1px;margin-top: 1.5rem;margin-bottom: 1.5rem;border-right: none;border-bottom: none;border-left: none;border-top-style: dashed;border-top-color: rgb(165, 165, 165);"/><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">设备驱动程序</span></strong></h3><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">虽然设备控制器屏蔽了设备的众多细节，但每种设备的控制器的寄存器、缓冲区等使用模式都是不同的，所以为了屏蔽「设备控制器」的差异，引入了<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">设备驱动程序</strong>。</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.9643705463182898" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zW45IL0myWcpiakxej6WPNID99Qh6u7picAN5GkaxjMLfuTtibAHQgwPI4Q/640?wx_fmt=png" data-type="png" data-w="842" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 293px;height: 283px;" title="" data-backw="425" data-backh="410" src="../Images/9d72d41032091d7f1ef8ea9c9c0f9ed0.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zW45IL0myWcpiakxej6WPNID99Qh6u7picAN5GkaxjMLfuTtibAHQgwPI4Q/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">设备控制器不属于操作系统范畴，它是属于硬件，而设备驱动程序属于操作系统的一部分，操作系统的内核代码可以像本地调用代码一样使用设备驱动程序的接口，而设备驱动程序是面向设备控制器的代码，它发出操控设备控制器的指令后，才可以操作设备控制器。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">不同的设备控制器虽然功能不同，但是<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">设备驱动程序会提供统一的接口给操作系统</strong>，这样不同的设备驱动程序，就可以以相同的方式接入操作系统。如下图：</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.578005115089514" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWYxgiackloozmxtyUepwR0tia0qqBqI0Jt2k2xs6pOHPib0MoNkafS04rw/640?wx_fmt=png" data-type="png" data-w="782" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 296px;height: 171px;" title="" src="../Images/1b3f44225fd56279d873c4ec7fcc5399.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWYxgiackloozmxtyUepwR0tia0qqBqI0Jt2k2xs6pOHPib0MoNkafS04rw/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">前面提到了不少关于中断的事情，设备完成了事情，则会发送中断来通知操作系统。那操作系统就需要有一个地方来处理这个中断，这个地方也就是在设备驱动程序里，它会及时响应控制器发来的中断请求，并根据这个中断的类型调用响应的<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">中断处理程序</strong>进行处理。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">通常，设备驱动程序初始化的时候，要先注册一个该设备的中断处理函数。</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.8012048192771084" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWpGibemc1THUiaL7x41IIEk9DzWBjeErko933OwTNfhwunMfVRtARNLRw/640?wx_fmt=png" data-type="png" data-w="996" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 312px;height: 250px;" title="" src="../Images/4b4b30be660e591688d9c37782717ef9.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWpGibemc1THUiaL7x41IIEk9DzWBjeErko933OwTNfhwunMfVRtARNLRw/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">我们来看看，中断处理程序的处理流程：</span></section><ol style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">在 I/O 时，设备控制器如果已经准备好数据，则会通过中断控制器向 CPU 发送中断请求；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">保护被中断进程的 CPU 上下文；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">转入相应的设备中断处理函数；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">进行中断处理；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">恢复被中断进程的上下文；</span></section></li></ol><hr style="font-size: inherit;color: inherit;line-height: inherit;height: 1px;margin-top: 1.5rem;margin-bottom: 1.5rem;border-right: none;border-bottom: none;border-left: none;border-top-style: dashed;border-top-color: rgb(165, 165, 165);"/><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">通用块层</span></strong></h3><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">对于块设备，为了减少不同块设备的差异带来的影响，Linux 通过一个统一的<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">通用块层</strong>，来管理不同的块设备。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">通用块层是处于文件系统和磁盘驱动中间的一个块设备抽象层，它主要有两个功能：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">第一个功能，向上为文件系统和应用程序，提供访问块设备的标准接口，向下把各种不同的磁盘设备抽象为统一的块设备，并在内核层面，提供一个框架来管理这些设备的驱动程序；</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">第二功能，通用层还会给文件系统和应用程序发来的 I/O 请求排队，接着会对队列重新排序、请求合并等方式，也就是 I/O 调度，主要目的是为了提高磁盘读写的效率。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">Linux 内存支持 5 种 I/O 调度算法，分别是：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">没有调度算法</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">先入先出调度算法</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">完全公平调度算法</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">优先级调度</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">最终期限调度算法</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">第一种，没有调度算法，是的，你没听错，它不对文件系统和应用程序的 I/O 做任何处理，这种算法常用在虚拟机 I/O 中，此时磁盘 I/O 调度算法交由物理机系统负责。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">第二种，先入先出调度算法，这是最简单的 I/O 调度算法，先进入 I/O 调度队列的 I/O 请求先发生。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">第三种，完全公平调度算法，大部分系统都把这个算法作为默认的 I/O 调度器，它为每个进程维护了一个 I/O 调度队列，并按照时间片来均匀分布每个进程的 I/O 请求。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">第四种，优先级调度算法，顾名思义，优先级高的 I/O 请求先发生， 它适用于运行大量进程的系统，像是桌面环境、多媒体应用等。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">第五种，最终期限调度算法，分别为读、写请求创建了不同的 I/O 队列，这样可以提高机械磁盘的吞吐量，并确保达到最终期限的请求被优先处理，适用于在 I/O 压力比较大的场景，比如数据库等。</span></section><hr style="font-size: inherit;color: inherit;line-height: inherit;height: 1px;margin-top: 1.5rem;margin-bottom: 1.5rem;border-right: none;border-bottom: none;border-left: none;border-top-style: dashed;border-top-color: rgb(165, 165, 165);"/><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">存储系统 I/O 软件分层</span></strong></h3><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">前面说到了不少东西，设备、设备控制器、驱动程序、通用块层，现在再结合文件系统原理，我们来看看 Linux 存储系统的 I/O 软件分层。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">可以把 Linux 存储系统的 I/O 由上到下可以分为三个层次，分别是文件系统层、通用块层、设备层。他们整个的层次关系如下图：</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="1.684" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWDnNN1b89V1gOT4oQibpEGLoWev4IJzJNuuaYEdMiafVgnExwEVc0e3ng/640?wx_fmt=png" data-type="png" data-w="500" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 207px;height: 349px;" title="" src="../Images/a87017888c592cea05cc2d99c96cc1a5.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWDnNN1b89V1gOT4oQibpEGLoWev4IJzJNuuaYEdMiafVgnExwEVc0e3ng/640?wx_fmt=png"/></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">这三个层次的作用是：</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">文件系统层，包括虚拟文件系统和其他文件系统的具体实现，它向上为应用程序统一提供了标准的文件访问接口，向下会通过通用块层来存储和管理磁盘数据。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">通用块层，包括块设备的 I/O 队列和 I/O 调度器，它会对文件系统的 I/O 请求进行排队，再通过 I/O 调度器，选择一个 I/O 发给下一层的设备层。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="color: inherit;line-height: inherit;font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">设备层，包括硬件设备、设备控制器和驱动程序，负责最终物理设备的 I/O 操作。</span></section></li></ul><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">有了文件系统接口之后，不但可以通过文件系统的命令行操作设备，也可以通过应用程序，调用 </span><code style="font-size: inherit;line-height: inherit;overflow-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">read</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">、</span><code style="font-size: inherit;line-height: inherit;overflow-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">write</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 函数，就像读写文件一样操作设备，所以说设备在 Linux 下，也只是一个特殊的文件。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">但是，除了读写操作，还需要有检查特定于设备的功能和属性。于是，需要 </span><code style="font-size: inherit;line-height: inherit;overflow-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin-right: 2px;margin-left: 2px;color: rgb(248, 35, 117);background: rgb(248, 248, 248);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">ioctl</span></code><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"> 接口，它表示输入输出控制接口，是用于配置和修改特定设备属性的通用接口。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">另外，存储系统的 I/O 是整个系统最慢的一个环节，所以 Linux 提供了不少缓存机制来提高 I/O 的效率。</span></section><ul style="font-size: inherit;color: inherit;line-height: inherit;padding-left: 32px;margin-left: 16px;margin-right: 16px;" class="list-paddingleft-2"><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">为了提高文件访问的效率，会使用<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">页缓存、索引节点缓存、目录项缓存</strong>等多种缓存机制，目的是为了减少对块设备的直接调用。</span></section></li><li style="font-size: 15px;color: inherit;line-height: inherit;margin-bottom: 0.5em;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;"><section style="line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">为了提高块设备的访问效率， 会使用<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">缓冲区</strong>，来缓存块设备的数据。</span></section></li></ul><hr style="font-size: inherit;color: inherit;line-height: inherit;height: 1px;margin-top: 1.5rem;margin-bottom: 1.5rem;border-right: none;border-bottom: none;border-left: none;border-top-style: dashed;border-top-color: rgb(165, 165, 165);"/><h3 style="text-align: center;"><strong><span style="font-size: 17px;font-family: Optima-Regular, PingFangTC-light;">键盘敲入字母时，期间发生了什么？</span></strong></h3><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">看完前面的内容，相信你对输入输出设备的管理有了一定的认识，那接下来就从操作系统的角度回答开头的问题「键盘敲入字母时，操作系统期间发生了什么？」</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">我们先来看看 CPU 的硬件架构图：</span></section><figure style="font-size: inherit;color: inherit;line-height: inherit;"><img data-ratio="0.7302083333333333" data-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWFLQfMe682xScyGftdvRebKQZmBfPe58niaDew06lx53ibzZRMHflUVzg/640?wx_fmt=png" data-type="png" data-w="960" style="font-size: inherit;color: inherit;line-height: inherit;display: block;margin-right: auto;margin-left: auto;width: 321px;height: 234px;" title="CPU 的硬件架构图" src="../Images/05f4e54a79aafe0a7b0f0688bed1ecad.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/J0g14CUwaZfQ4NPAa3l2ic6Jaib9asM8zWFLQfMe682xScyGftdvRebKQZmBfPe58niaDew06lx53ibzZRMHflUVzg/640?wx_fmt=png"/><section style="margin-top: 10px;text-align: center;color: rgb(153, 153, 153);font-size: 0.7em;margin-left: 16px;margin-right: 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">CPU 的硬件架构图</span></section></figure><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">CPU 里面的内存接口，直接和系统总线通信，然后系统总线再接入一个 I/O 桥接器，这个 I/O 桥接器，另一边接入了内存总线，使得 CPU 和内存通信。再另一边，又接入了一个 I/O 总线，用来连接 I/O 设备，比如键盘、显示器等。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">那当用户输入了键盘字符，<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">键盘控制器</strong>就会产生扫描码数据，并将其缓冲在键盘控制器的寄存器中，紧接着键盘控制器通过总线给 CPU 发送<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">中断请求</strong>。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">CPU 收到中断请求后，操作系统会<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">保存被中断进程的 CPU 上下文</strong>，然后调用键盘的<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">中断处理程序</strong>。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">键盘的中断处理程序是在<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">键盘驱动程序</strong>初始化时注册的，那键盘<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">中断处理函数</strong>的功能就是从键盘控制器的寄存器的缓冲区读取扫描码，再根据扫描码找到用户在键盘输入的字符，如果输入的字符是显示字符，那就会把扫描码翻译成对应显示字符的  ASCII 码，比如用户在键盘输入的是字母 A，是显示字符，于是就会把扫描码翻译成 A 字符的 ASCII 码。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">得到了显示字符的 ASCII 码后，就会把 ASCII 码放到「读缓冲区队列」，接下来就是要把显示字符显示屏幕了，显示设备的驱动程序会定时从「读缓冲区队列」读取数据放到「写缓冲区队列」，最后把「写缓冲区队列」的数据一个一个写入到显示设备的控制器的寄存器中的数据缓冲区，最后将这些数据显示在屏幕里。</span></section><section style="font-size: inherit;color: inherit;margin: 1.7em 16px;line-height: 2em;"><span style="font-size: 15px;font-family: Optima-Regular, PingFangTC-light;letter-spacing: 1px;">显示出结果后，<strong style="font-size: inherit;line-height: inherit;color: rgb(48, 79, 254);">恢复被中断进程的上下文</strong>。</span></section><section data-mpa-template="t" mpa-from-tpl="t"><br mpa-from-tpl="t"/><span style="color: rgb(136, 136, 136);font-family: -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;font-variant-numeric: normal;font-variant-east-asian: normal;letter-spacing: 1px;line-height: 29.75px;widows: 1;background-color: rgb(255, 255, 255);"/><section mpa-from-tpl="t" style="white-space: normal;color: rgb(62, 62, 62);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 16px;"><p style="text-align: center;letter-spacing: 3px;line-height: 1.5em;"><span style="color: rgb(0, 0, 0);font-size: 13px;">有道无术，术可成；有术无道，止于术</span></p><p style="text-align: center;letter-spacing: 3px;line-height: 1.5em;"><span style="color: rgb(0, 0, 0);font-size: 13px;">欢迎大家关注</span><span style="font-size: 13px;color: rgb(255, 169, 0);"><strong mpa-from-tpl="t" style="color: rgb(255, 104, 39);">Java之道</strong></span><span style="color: rgb(0, 0, 0);font-size: 13px;">公众号</span></p><p style="text-align: center;letter-spacing: 3px;line-height: 1.5em;"><br mpa-from-tpl="t"/></p><p style="text-align: center;"><img data-copyright="0" data-ratio="0.5555555555555556" data-s="300,640" data-type="jpeg" data-w="900" style="visibility: visible !important;width: 677px !important;height: auto !important;" data-src="https://mmbiz.qpic.cn/mmbiz_png/1Fk759B8md4yPF1ZAnySd6Xqparsv06tG4FibicFOr7moddq2D3087xicOrF9l54yOVLQkkiaWUBheSzFfibyGMgeug/640?wx_fmt=jpeg" src="../Images/98a505e3452ddbcabece44a1b8d641d1.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/1Fk759B8md4yPF1ZAnySd6Xqparsv06tG4FibicFOr7moddq2D3087xicOrF9l54yOVLQkkiaWUBheSzFfibyGMgeug/640?wx_fmt=jpeg"/></p></section><p style="white-space: normal;color: rgb(62, 62, 62);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 16px;text-align: right;"><span style="font-size: 14px;letter-spacing: 2px;word-spacing: 2px;color: rgb(0, 0, 0);">好文章，我</span><span style="color: rgb(160, 160, 160);font-size: 14px;letter-spacing: 2px;word-spacing: 2px;"><span style="color: rgb(255, 41, 65);">在看</span>❤️</span></p></section></section>
