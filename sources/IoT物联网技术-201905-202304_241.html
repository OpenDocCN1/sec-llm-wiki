<h1>IoT入门：拆解物联网全栈开发工作</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MjM5OTA4MzA0MA==&amp;mid=2454925233&amp;idx=1&amp;sn=47d20aa8e3a35a0a7b8c6162c93789c7&amp;chksm=b16762fe8610ebe8302457da528b018e49010079058cf7cfd3b18577048f1b2886879b668fc1&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/s?__biz=MjM5OTA4MzA0MA==&amp;mid=2454925233&amp;idx=1&amp;sn=47d20aa8e3a35a0a7b8c6162c93789c7&amp;chksm=b16762fe8610ebe8302457da528b018e49010079058cf7cfd3b18577048f1b2886879b668fc1&amp;scene=27#wechat_redirect</a></blockquote><section data-tool="mdnice&#x7F16;&#x8F91;&#x5668;" data-website="https://www.mdnice.com" style="font-size: 16px;color: black;padding: 0 10px;line-height: 1.6;word-spacing: 0px;letter-spacing: 0px;word-break: break-word;word-wrap: break-word;text-align: left;font-family: Optima-Regular, Optima, PingFangSC-light, PingFangTC-light, 'PingFang SC', Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;margin-top: -10px;"><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"/><ul style="margin-top: 8px;margin-bottom: 8px;padding-left: 25px;color: black;list-style-type: disc;" class="list-paddingleft-2"><li><p>物联网系统</p></li><li><p>设备端的开发</p></li><ul class="list-paddingleft-2" style="list-style-type: square;"><li><p>不需要网关的设备</p></li><li><p>需要网关的设备</p></li><li><p>WiFi类设备<br/></p></li></ul><li><p>物联网平台开发</p></li><li><p>业务应用开发</p></li></ul><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;"><br/></p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;"><span style="color:#00AAAA;">物联网</span>的概念已经被炒了好多年了，奇怪的是：市场中对这个概念的反应总是<span style="color:#00AAAA;">不愠不火</span>。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">随着<span style="color:#00AAAA;">5G</span> 的迅速普及，不知道是否能够再次把这个领域带火起来。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">但是不管怎样，很多大学已经把物联网这个<span style="color:#00AAAA;">专业</span>给坐实了。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">前几天，一位大一的小伙伴私信我：<span style="color:#00AAAA;">进入物联网专业已经快一年时间了，却不知道以后出去干什么？</span></p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这篇文章，我们就从<span style="color:#00AAAA;">开发者的角度</span>，来简单看一下物联网这个领域使用了哪些<span style="color:#00AAAA;">技术栈</span>、有哪些<span style="color:#00AAAA;">开发工作</span>。</p><h2 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;color: black;border-bottom: 2px solid rgb(239, 112, 96);font-size: 1.3em;"><span style="display: none;"/><span style="display: inline-block;font-weight: bold;background: rgb(239, 112, 96);color: #ffffff;padding: 3px 10px 1px;border-top-right-radius: 3px;border-top-left-radius: 3px;margin-right: 3px;">物联网系统</span><span style="display: inline-block;vertical-align: bottom;border-bottom: 36px solid #efebe9;border-right: 20px solid transparent;"> </span></h2><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.8351851851851851" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk4AZ46SAsDq3THPNVq8eoqohl97nmpph7KAYHKBh1JxE2mwyuOTfluw/640?wx_fmt=png" data-type="png" data-w="1080" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/80f3992dcf2d8af26beeed9a9d20f8d3.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk4AZ46SAsDq3THPNVq8eoqohl97nmpph7KAYHKBh1JxE2mwyuOTfluw/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这张图从<span style="color:#00AAAA;">开发者的角度</span>，展示了一个物联网系统中的各种角色，包括它们之间的通信。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">如果从软件开发<span style="color:#00AAAA;">岗位</span>的角度来对这几个模块进行划分的话，这个系统中主要包括：</p><blockquote data-tool="mdnice编辑器" style="display: block;font-size: 0.9em;overflow: auto;overflow-scrolling: touch;border-left: 3px solid rgba(0, 0, 0, 0.4);color: #6a737d;padding-top: 10px;padding-bottom: 10px;padding-left: 20px;padding-right: 10px;margin-bottom: 20px;margin-top: 20px;border-left-color: rgb(239, 112, 96);background: #fff9f9;"><ol style="margin-top: 8px;margin-bottom: 8px;padding-left: 25px;color: black;list-style-type: decimal;" class="list-paddingleft-2"><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">前端、后端开发：负责物联网平台和业务应用的开发;</p></section></li><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">嵌入式软件：主要是设备端的开发，这部分根据使用的不同技术(或者说硬件模块)，又可以分为很多不同的子领域;</p></section></li><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">移动端开发：Android APP, iOS APP, H5 小程序，还有目前的鸿蒙系统APP。</p></section></li></ol></blockquote><h2 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;color: black;border-bottom: 2px solid rgb(239, 112, 96);font-size: 1.3em;"><span style="display: none;"/><span style="display: inline-block;font-weight: bold;background: rgb(239, 112, 96);color: #ffffff;padding: 3px 10px 1px;border-top-right-radius: 3px;border-top-left-radius: 3px;margin-right: 3px;">设备端的开发</span><span style="display: inline-block;vertical-align: bottom;border-bottom: 36px solid #efebe9;border-right: 20px solid transparent;"> </span></h2><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.5235732009925558" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkIlsCJCClETA13l3BL7MEiab4GVzqSPUiaZ0QNrj0YWibiaibFgLcESMJUzQ/640?wx_fmt=png" data-type="png" data-w="806" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/9cad156d81918981998f49511037ffd5.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkIlsCJCClETA13l3BL7MEiab4GVzqSPUiaZ0QNrj0YWibiaibFgLcESMJUzQ/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这里描述的设备，还是属于比较<span style="color:#00AAAA;">狭隘</span>的范畴，仅仅包含了具有<span style="color:#00AAAA;">通信功能的物理硬件实体</span>。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">如果从<span style="color:#00AAAA;">广义</span>的物联网来看，任何物品，只要能够接入网络，都可以称之为设备，或者称之为 thing。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">比如：把一件衣服附上一个<span style="color:#00AAAA;">电子标签</span>，也是物联网的一个小分子。</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.5026737967914439" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk74NMjC7aAmEbCT9AzvHibUWcBMsDq4TibrCn7NHwulUMkjf528CnnAJw/640?wx_fmt=png" data-type="png" data-w="748" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/fd9e42415523acd1069ef42d19923b33.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk74NMjC7aAmEbCT9AzvHibUWcBMsDq4TibrCn7NHwulUMkjf528CnnAJw/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">我们这里，仍旧以传统意义上的设备来讲解，比如：智慧路灯，智能手表，智能家居里的门磁、报警器等等。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">对设备端的开发进行分类的话，从<span style="color:#00AAAA;">通信方式</span>这个角度来进行划分比较清晰。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">一个设备要想接入到网络，肯定需要通信功能，包括：<span style="color:#00AAAA;">有线</span>通信，<span style="color:#00AAAA;">无线</span>通信。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">在一些传统行业，或者对通信质量要求比较高的场景下，部署有线网络还是比较常见的，例如一些工业场景中。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">对于一些民用领域，<span style="color:#00AAAA;">大部分</span>还是以无线通信为主。</p><h4 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;color: black;font-size: 18px;"><span style="display: none;"/>1. 不需要网关的设备<span style="display: none;"/></h4><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这一类设备，利用 <span style="color:#00AAAA;">2G/3G/4G</span> 基站来进行数据的传输，产品的形态是：</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.46547314578005117" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkSWsZfsdq5tUshRyicB90OMuqvYwvmVaWA7BFjibqUbnetwGSHyHeMPqQ/640?wx_fmt=png" data-type="png" data-w="782" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/4a39468f7e7538eb463c4d9c5361be65.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkSWsZfsdq5tUshRyicB90OMuqvYwvmVaWA7BFjibqUbnetwGSHyHeMPqQ/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">也就是 <span style="color:#00AAAA;">单片机+通信模块</span>的方式。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">通信模块包括：GPRS 模块、4G 模块、NB-IoT 等等。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">在开发这一类产品的时候，<span style="color:#00AAAA;">单片机</span>负责产品的功能部分；<span style="color:#00AAAA;">通信模块</span>负责通信部分。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">单片机与通信模块之间，在<span style="color:#00AAAA;">硬件上</span>通过 <span style="color:#00AAAA;">UART</span> 口通信居多，在<span style="color:#00AAAA;">协议上</span>可以通过 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">AT</code> 指令，或者其他的一些专有协议。</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.5891238670694864" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk75srdjsphEMibk85pIkGhkyiarjTjQogFqSHnib7zTibUhNXhiaXb4ibcZdA/640?wx_fmt=png" data-type="png" data-w="662" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/d79c46a1d54231b16a03ffd4f5c7ae02.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk75srdjsphEMibk85pIkGhkyiarjTjQogFqSHnib7zTibUhNXhiaXb4ibcZdA/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">近几年，在传统的消费类电子产品上，添加一个通信模块，让产品达到连网的功能，还是比较流行的。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这一类的产品的软件开发工作，与一般的<span style="color:#00AAAA;">单片机</span>开发并无两样。无非是增加了一些通过网络来上报数据，或者从网络接收控制指令。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">只要熟悉所使用的<span style="color:#00AAAA;">通信协议</span>即可。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">上面的这种产品形态，需要对硬件进行重新设计，比较适合<span style="color:#00AAAA;">从零开始</span>的产品开发。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">那么对于那些已有的产品，如果想连接到物联网平台上，但是又不想重新设计，又该怎么办呢？</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">有需求就有供给！</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">比如：一些扫地机、吸尘器的厂商，由于找不到其他可以创新、突破的点，于是就开始内卷，纷纷加上连网的功能。</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="1.8178807947019868" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk9lSZkfnibe94WWnIRicr0vPmdqeJrl7kMILE3IamLWAt7FvGcIDuyW0A/640?wx_fmt=png" data-type="png" data-w="604" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/6831ea7fa5b7f86e0f78eab52f7af53d.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk9lSZkfnibe94WWnIRicr0vPmdqeJrl7kMILE3IamLWAt7FvGcIDuyW0A/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">他们直接在产品中，添加一个 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">ESP8266</code> 或者 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">ESP32</code> 模组，就立刻升级成一个<span style="color:#00AAAA;">智能产品</span>，多么高大上。当然了， 价格也同样高大上起来了！</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;"><code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">ESP8266</code> 或者 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">ESP32</code> 与一般的通信模组有一点不一样：它是一个<span style="color:#00AAAA;">完整的单片机</span>，只不过它们的主要用途就是专门用来<span style="color:#00AAAA;">解决通信问题</span>，而不是一般的功能控制。</p><h4 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;color: black;font-size: 18px;"><span style="display: none;"/>2. 需要网关的设备<span style="display: none;"/></h4><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="1.4536817102137767" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkkt4WlcEx5guibOsDVvmmMAvKzMYRmyg3xzic2b1L1LNU7Ad3iadPdLhog/640?wx_fmt=png" data-type="png" data-w="842" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/daa314b6e772fdaec2a57a1326f18c2c.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkkt4WlcEx5guibOsDVvmmMAvKzMYRmyg3xzic2b1L1LNU7Ad3iadPdLhog/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">如果提到智能家居，可能大部分的人会想到一个词语 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">ZigBee</code>，这是一个局域网的<span style="color:#00AAAA;">无线通信协议</span>，大概在 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">2005</code> 年左右就开始在智能家居中崭露头角了。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">与 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">ZigBee</code> 类似的无线通信协议还有：<code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">ZWave</code>、<code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">RF433</code>、<code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">BLE</code> 等等。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">它们的作用都是类似的：都是为了让多个设备能够<span style="color:#00AAAA;">组网</span>，节点之间以多跳的方式传输数据，达到通信的目的。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这些数据最终会汇总到一个叫做<span style="color:#00AAAA;">网关</span>的设备，然后与云端的服务器进行通信。</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.44537037037037036" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkia0nXygJjGEAvadDT4pRibf8KbMHZtzOGrrww1xicMUiawAlyDryDRt2eA/640?wx_fmt=png" data-type="png" data-w="1080" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/e4da015b44b405ad2a032cb21b8f5991.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkia0nXygJjGEAvadDT4pRibf8KbMHZtzOGrrww1xicMUiawAlyDryDRt2eA/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这一类产品的开发，包括：<span style="color:#00AAAA;">网关开发</span> 和 <span style="color:#00AAAA;">设备开发</span>这两种。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;"><span style="color:#00AAAA;">网关</span>的开发稍微复杂一些。从功能上来说，网关需要实现：</p><blockquote data-tool="mdnice编辑器" style="display: block;font-size: 0.9em;overflow: auto;overflow-scrolling: touch;border-left: 3px solid rgba(0, 0, 0, 0.4);color: #6a737d;padding-top: 10px;padding-bottom: 10px;padding-left: 20px;padding-right: 10px;margin-bottom: 20px;margin-top: 20px;border-left-color: rgb(239, 112, 96);background: #fff9f9;"><ol style="margin-top: 8px;margin-bottom: 8px;padding-left: 25px;color: black;list-style-type: decimal;" class="list-paddingleft-2"><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">设备的管理(与物联网平台的设备管理不是一个概念);</p></section></li><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">规则引擎(在断网的状态下实现场景联动等功能);</p></section></li><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">通信协议转换(把物理网平台的通信协议转成设备私有协议);</p></section></li></ol></blockquote><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">有些网关中，还会集成不同的无线通信协议模块，比如：把 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">ZigBee</code>、<code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">BLE</code>、<code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">红外</code>等功能，<span style="color:#00AAAA;">集成在一个网关中</span>，这样的话，不同通信方式的设备就可以在一个系统中共存了。</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.6194444444444445" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkOiahBN4daVibDpTiaMCAG5PnP9icKUYa42CfZJEysM8Q6qiaXsuicHXiaMd3g/640?wx_fmt=png" data-type="png" data-w="1080" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/ea38f471332d22a84f66ab1ef557d131.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkOiahBN4daVibDpTiaMCAG5PnP9icKUYa42CfZJEysM8Q6qiaXsuicHXiaMd3g/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">此时，网关就要做更多的工作：</p><blockquote data-tool="mdnice编辑器" style="display: block;font-size: 0.9em;overflow: auto;overflow-scrolling: touch;border-left: 3px solid rgba(0, 0, 0, 0.4);color: #6a737d;padding-top: 10px;padding-bottom: 10px;padding-left: 20px;padding-right: 10px;margin-bottom: 20px;margin-top: 20px;border-left-color: rgb(239, 112, 96);background: #fff9f9;"><ol style="margin-top: 8px;margin-bottom: 8px;padding-left: 25px;color: black;list-style-type: decimal;" class="list-paddingleft-2"><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">上行链路(连接到云平台)：需要做到协议的统一，也就是说云平台才不关系下面到底是什么样的无线通信技术，云平台只会以统一的数据格式来表示每个设备;</p></section></li><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">下行链路(连接到设备)：协议转换，把云平台发来的统一的数据格式，转换成不同的无线通信协议特有的数据格式;</p></section></li></ol></blockquote><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">设备的开发工作就相对纯粹一点了，它只需要处理某一种无线协议即可。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这一类设备的开发，一般都是使用相应的<span style="color:#00AAAA;">通信模组</span>，底层的协议栈都是提供好的。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">开发者需要做的工作主要就是熟悉应用层的通信协议，完成指令的解析和数据上报工作。</p><h4 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;color: black;font-size: 18px;"><span style="display: none;"/>3. WiFi 类设备<span style="display: none;"/></h4><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.6092592592592593" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk0fsLylcqJcMKuhVYibic7rFF7HiaRHia2MFhX673RkDAAPT79eycEjM2dA/640?wx_fmt=png" data-type="png" data-w="1080" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/fd0701cf3e5555f7bd1c322f99dce64f.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk0fsLylcqJcMKuhVYibic7rFF7HiaRHia2MFhX673RkDAAPT79eycEjM2dA/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这一类产品最常见的就是各种品牌的<span style="color:#00AAAA;">网络摄像头(IPCamera)</span>，比如：小米、360、萤石等等。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">摄像头如果作为一个<span style="color:#00AAAA;">单品</span>来使用，只要把家中的 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">WiFi</code> <span style="color:#00AAAA;">SSID 和 密码</span>配置到摄像头中，就可以使用官方的 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">APP</code> 来远程查看实时画面了。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">如果把摄像头<span style="color:#00AAAA;">集成</span>在一个智能家居的系统中，就需要二次开发。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">摄像头厂家一般都会提供 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">SDK</code>，作为开发者需要做的事情就是：调用 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">SDK</code> 中的 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">API</code> 函数，获取实时画面、发送指令控制摄像头云台转动。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这里有一个底层的技术很有意思：<span style="color:#00AAAA;">P2P 网络穿透</span>。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">我们买来一个网络摄像机，是<span style="color:#00AAAA;">不可能</span>有一个独立的 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">IP</code> 地址的。也就是说：其他设备(手机)是没办法通过 <span style="color:#00AAAA;">IP:PORT</span> 的编程方式，直接连接到摄像头的。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">但是为了实时画面的传输质量，为了减轻服务器的转发压力，手机最好可以直接与摄像头建立 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">TCP</code> 通信。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">此时，<code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">P2P</code> 网络穿透给这种需求提供了可能。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">在早期的时候，深圳有大批的摄像头厂商使用的都是 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">TUTK</code> 这家公司的 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">P2P</code> 网络穿透服务。</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.7895791583166333" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk2L9rv17pKRC7p48EY6MejsD1v4034Cu5tOB4v7b15mwdIy9T0UJ10g/640?wx_fmt=png" data-type="png" data-w="998" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/0b3d2e2a19d34d4920777ac4fedca855.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWk2L9rv17pKRC7p48EY6MejsD1v4034Cu5tOB4v7b15mwdIy9T0UJ10g/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">在 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">P2P Master</code>(就是一台服务器)的协助下，实现移动端与摄像头之间的网络穿透，直接建立 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">TCP</code> 连接。</p><h2 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;color: black;border-bottom: 2px solid rgb(239, 112, 96);font-size: 1.3em;"><span style="display: none;"/><span style="display: inline-block;font-weight: bold;background: rgb(239, 112, 96);color: #ffffff;padding: 3px 10px 1px;border-top-right-radius: 3px;border-top-left-radius: 3px;margin-right: 3px;">物联网平台开发</span><span style="display: inline-block;vertical-align: bottom;border-bottom: 36px solid #efebe9;border-right: 20px solid transparent;"> </span></h2><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">物联网平台，作为连接业务应用和设备的<span style="color:#00AAAA;">中间层</span>，屏蔽了各种复杂的设备接口，实现设备的快速接入。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">目前，做的比较大的就是那么几家巨头：<span style="color:#00AAAA;">亚马逊</span>的 AWS 平台，<span style="color:#00AAAA;">阿里云、腾讯、华为</span>的物联网平台。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">以上这几家的<span style="color:#00AAAA;">物联网平台</span>，仅仅是他们的云平台中的一个组成部分。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">它们的目标就是提供一个通用的通信标准和 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">SDK</code>，快速的接入各种硬件设备，通过设备接入数量、通信数据的流量，以及提供各种业务层的服务来赚钱。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">另外，还有一些下一梯队的公司，开发了自己的、专门针对物联网领域的平台。由于知名度不高，只能以合作开发项目的形式来吸引硬件设备的接入。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">从开发的角度来看，物联网平台的开发<span style="color:#00AAAA;">技术栈</span>主要是<span style="color:#00AAAA;">后台开发</span>。由于这部分技术栈我不太熟悉，就不去深入讨论了。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">物联网平台<span style="color:#00AAAA;">最宝贵的就是数据</span>，如何利用这些数据，这就是业务应用的事情了。</p><h2 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;color: black;border-bottom: 2px solid rgb(239, 112, 96);font-size: 1.3em;"><span style="display: none;"/><span style="display: inline-block;font-weight: bold;background: rgb(239, 112, 96);color: #ffffff;padding: 3px 10px 1px;border-top-right-radius: 3px;border-top-left-radius: 3px;margin-right: 3px;">业务应用开发</span><span style="display: inline-block;vertical-align: bottom;border-bottom: 36px solid #efebe9;border-right: 20px solid transparent;"> </span></h2><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.5593667546174143" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkFxPFQY2eaI64HLytlREtjCc3HjCjt3PUrQGaicye7V2leOOpUibvuIyQ/640?wx_fmt=png" data-type="png" data-w="758" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/6d57d5356095718ce94918e2a1df7ef3.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3aZHYFdpRlpZKtNWwkJibVWkFxPFQY2eaI64HLytlREtjCc3HjCjt3PUrQGaicye7V2leOOpUibvuIyQ/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">所谓的业务应用，简单来说，就是通过调用物联网平台提供的 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">API</code>，实现设备管理、数据上报、命令下发等业务场景。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">设备管理是在设备接入基础上，提供了更丰富完备的设备管理能力，简化海量设备管理复杂性，提升管理效率。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">从物联网平台的<span style="color:#00AAAA;">设备和数据</span>中，可以衍生出各种不同的业务应用场景，这就要根据实际的系统功能来进行按需开发了。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">比如：智慧城市、智慧照明、智慧工业、车联网等行业应用。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">涉及到的<span style="color:#00AAAA;">技术栈</span>是：<span style="color:#00AAAA;">前端</span>和<span style="color:#00AAAA;">后端</span>开发。</p><br data-tool="mdnice编辑器"/><center data-tool="mdnice编辑器"><span style="color:LightSeaGreen;font-size:24px;">------ End ------</span></center><p style="text-align: center;"><br/></p></section><p style="text-align: center;"><img class="rich_pages" data-galleryid="" data-ratio="0.78125" data-src="https://mmbiz.qpic.cn/mmbiz_gif/tnMEWNbfO5fOwfXgfpIopvTOGSEtGyxibWRqSy70bytyxoPicb5OOGawY5Tj9N9IpJOZp9yv2GQkgaCzM6nUycDw/640?wx_fmt=gif" data-type="gif" data-w="640" style="width: 259px;height: 202px;" src="../Images/d7c479528f0ac9a0a47dd1fe91369814.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_gif/tnMEWNbfO5fOwfXgfpIopvTOGSEtGyxibWRqSy70bytyxoPicb5OOGawY5Tj9N9IpJOZp9yv2GQkgaCzM6nUycDw/640?wx_fmt=gif"/></p>
