<h1>IoT物联网设备OTA：全量升级和增量升级</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MjM5OTA4MzA0MA==&amp;mid=2454925111&amp;idx=2&amp;sn=ef765e8b6539710747ee70fa39dd3efd&amp;chksm=b16762788610eb6e1a6503bc7d9e3b360fad8b54502b802117585407c17d5c22899aa3804f78&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/s?__biz=MjM5OTA4MzA0MA==&amp;mid=2454925111&amp;idx=2&amp;sn=ef765e8b6539710747ee70fa39dd3efd&amp;chksm=b16762788610eb6e1a6503bc7d9e3b360fad8b54502b802117585407c17d5c22899aa3804f78&amp;scene=27#wechat_redirect</a></blockquote><section data-tool="mdnice&#x7F16;&#x8F91;&#x5668;" data-website="https://www.mdnice.com" style="font-size: 16px;color: black;padding: 0px 10px;line-height: 1.6;word-spacing: 0px;letter-spacing: 0px;word-break: break-word;overflow-wrap: break-word;text-align: left;font-family: Optima-Regular, Optima, PingFangSC-light, PingFangTC-light, &quot;PingFang SC&quot;, Cambria, Cochin, Georgia, Times, &quot;Times New Roman&quot;, serif;margin-top: -10px;"><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"/><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">各位看官好，上一篇文章我们聊了一下关于 <span style="color:LightSeaGreen;">OTA</span> 升级过程中，新的软件包是如何<span style="color:LightSeaGreen;">从开发者的电脑上</span>，安全的下载到<span style="color:LightSeaGreen;">嵌入式设备</span>中的。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这个流程似乎很简单，不就是下载一个文件而已嘛，怎么还值得写成一篇文章呢？</p><p style="text-align: center;"><img class="rich_pages js_insertlocalimg" data-ratio="0.7598784194528876" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8z0mUTztTycJAvfmYVgQUjbpSWYILLuI1JkcLAOgLt3VoGhkujWzvDw/640?wx_fmt=png" data-type="png" data-w="658" style="" src="../Images/5f9b67d991c464567917e7a52b3143d1.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8z0mUTztTycJAvfmYVgQUjbpSWYILLuI1JkcLAOgLt3VoGhkujWzvDw/640?wx_fmt=png"/></p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">其实这<span style="color:LightSeaGreen;">不仅仅</span>是下载文件这么简单，这其中涉及到如何对众多的终端设备进行<span style="color:LightSeaGreen;">批量升级</span>的策略问题。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">如果你亲自在 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">AWS</code> 的平台上操刀一次，就知道这其中有很多<span style="color:LightSeaGreen;">细节问题</span>是需要考虑的。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">一失足成千古恨哪！一旦设备升级策略忽略了一个小细节，也许某一天就是我们的深渊！</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.9099099099099099" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8DnEeOp0jPDfJ0STRJlf5Kyr0emY0BggMJNwbUqiabAibAiaYG4BVvy7qQ/640?wx_fmt=png" data-type="png" data-w="888" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/74a6007c676d514324ba9ad2e0037f8b.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8DnEeOp0jPDfJ0STRJlf5Kyr0emY0BggMJNwbUqiabAibAiaYG4BVvy7qQ/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">包括产品的<span style="color:LightSeaGreen;">生产过程</span>也是如此，那些踩过的坑，真是一把鼻涕一把泪，这个问题后面有时间专门写一篇。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">今天，我们继续 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">OTA </code>升级过程中后续的阶段。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">还记得我们之前的假设吗？</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">设备中正在执行的 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">V1</code> 版本的程序，包括这 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">3</code> 个文件，它们位于文件系统中的 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">/root/app</code> 目录下：</p><blockquote data-tool="mdnice编辑器" style="display: block;font-size: 0.9em;overflow: auto;overflow-scrolling: touch;border-left: 3px solid rgba(0, 0, 0, 0.4);color: #6a737d;padding-top: 10px;padding-bottom: 10px;padding-left: 20px;padding-right: 10px;margin-bottom: 20px;margin-top: 20px;border-left-color: rgb(239, 112, 96);background: #fff9f9;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">main: 主程序;</p><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">config.ini: 配置文件(包括一个配置项：version=V1_0);</p><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">mylib.so: 实现了某个算法的动态库，被 main 程序调用;</p></blockquote><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">现在，新的版本 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">V2</code> 优化了算法，压缩包名称是 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">app_V2.0.tgz</code>，其中包括文件：</p><blockquote data-tool="mdnice编辑器" style="display: block;font-size: 0.9em;overflow: auto;overflow-scrolling: touch;border-left: 3px solid rgba(0, 0, 0, 0.4);color: #6a737d;padding-top: 10px;padding-bottom: 10px;padding-left: 20px;padding-right: 10px;margin-bottom: 20px;margin-top: 20px;border-left-color: rgb(239, 112, 96);background: #fff9f9;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">main: 没有变化;</p><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">config.ini: 配置项修改了：version=V2_0;</p><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">mylib.so: 优化了算法，主要就是想升级这个动态库;</p><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">upgrade.sh: 一个脚本程序，新增的文件;</p></blockquote><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">升级包 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">app_V2.0.tgz</code> 已经被下载到设备本地的文件系统中了，假设解压到目录  <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">/root/upgrade</code> 中。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">现在需要做的事情就是：新版本程序，去替代 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">/root/app</code> 目录中的旧版本程序。</p><br data-tool="mdnice编辑器"/><center data-tool="mdnice编辑器"><span style="color:LightSeaGreen;font-size:24px;">upgrade.sh 升级脚本</span></center><br data-tool="mdnice编辑器"/><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">我们首先要明白一个问题：执行升级指令、下载压缩包，都是此刻<span style="color:LightSeaGreen;">正在执行</span>的 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">main</code> 程序来执行的。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">如果把<span style="color:LightSeaGreen;">复制替换</span>的操作也让 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">main</code> 程序来执行的话，肯定是会出问题的：它不可能去复制一个新的 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">main</code> 文件，来<span style="color:LightSeaGreen;">把自己替换掉</span>！</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.7407407407407407" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8VX9cM7Y1LlttX1ofWjSoRaZsem2p0tE0HyWEwebZicOuhmh7aibdOu8g/640?wx_fmt=png" data-type="png" data-w="648" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/4b911056239b381831f125b8202eddb1.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8VX9cM7Y1LlttX1ofWjSoRaZsem2p0tE0HyWEwebZicOuhmh7aibdOu8g/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">写过<span style="color:LightSeaGreen;">单片机</span>程序的小伙伴肯定都知道：当新的固件下载到 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">flash</code> 之后，一般都是重新启动设备，然后由 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">bootloader</code> 来执行具体的文件复制操作。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">那么对于带有<span style="color:LightSeaGreen;">文件系统</span>的设备来说，也可以模仿类似的操作方式。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">比如：当设备重新启动后，当执行 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">/etc/rc.local</code> 时，此时 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">main</code> 应用程序还没有启动。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">此时就可以在 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">rc.local</code> 这个文件中去做升级操作。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">但是这样的方式，相当于是轻微的<span style="color:LightSeaGreen;">侵入</span>了操作系统，总感觉这样做不太好。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">此刻， <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">upgrade.sh</code> 升级脚本开始登场了！</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.8484848484848485" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8xGfSREo4u6QgJjkicDU4mEo8rxVUuvjJ9pfQFTYRhm5eRlXEExvUP0w/640?wx_fmt=png" data-type="png" data-w="528" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/b9c7a098d57bcb098a2dc9dbe4d9f60c.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8xGfSREo4u6QgJjkicDU4mEo8rxVUuvjJ9pfQFTYRhm5eRlXEExvUP0w/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这个脚本文件的主要作用就是用来<span style="color:LightSeaGreen;">控制升级过程</span>。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这里隐藏这一个很重要的思想：<code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">upgrade.sh</code> <span style="color:LightSeaGreen;font-size:18px;">是放在升级包中的，它并没有固化在终端设备中</span>。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这样的话，<span style="color:LightSeaGreen;">每次</span>执行升级任务时，都可以根据<span style="color:LightSeaGreen;">本次的</span>升级需要，来<span style="color:LightSeaGreen;">灵活的</span>编写升级脚本。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">换句话说：只要能保证升级的<span style="color:LightSeaGreen;">通道</span>没有问题，那么升级的过程就<span style="color:LightSeaGreen;">完全由这个脚本文件来控制</span>，你想怎么搞，就怎么搞！</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="1.0666666666666667" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8Ntsoj3SNxiccwfhicMjicpQa99NHDekcrpRWicYiaXYLcsNvlM6z8vL9EGA/640?wx_fmt=png" data-type="png" data-w="300" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/5776bbf01e231121537e7f34045e156a.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8Ntsoj3SNxiccwfhicMjicpQa99NHDekcrpRWicYiaXYLcsNvlM6z8vL9EGA/640?wx_fmt=png"/></figure><br data-tool="mdnice编辑器"/><center data-tool="mdnice编辑器"><span style="color:LightSeaGreen;font-size:24px;">完全升级</span></center><br data-tool="mdnice编辑器"/><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">所谓的<span style="color:LightSeaGreen;">完全升级</span>，就是把旧版本的程序全部丢弃，把升级包中的新程序全部复制过去。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">此时，升级脚本文件 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">upgrade.sh</code> 就完成下面这几个主要工作：</p><blockquote data-tool="mdnice编辑器" style="display: block;font-size: 0.9em;overflow: auto;overflow-scrolling: touch;border-left: 3px solid rgba(0, 0, 0, 0.4);color: #6a737d;padding-top: 10px;padding-bottom: 10px;padding-left: 20px;padding-right: 10px;margin-bottom: 20px;margin-top: 20px;border-left-color: rgb(239, 112, 96);background: #fff9f9;"><ol style="margin-top: 8px;margin-bottom: 8px;padding-left: 25px;color: black;list-style-type: decimal;" class="list-paddingleft-2"><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">停止(kill)当前正在执行的 V1.0 版本的程序;</p></section></li><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">删除 /root/app 目录下的所有旧文件;</p></section></li><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">把升级包中所有的新版本文件 /root/upgrade/* 复制到 /root/app 目录下;</p></section></li></ol></blockquote><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">这样的完全升级方式是最无脑、最粗鲁的。</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">当然，还有一些<span style="color:LightSeaGreen;">细节问题</span>是需要考虑的。比如：如果复制文件过程中出现错误怎么办？</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">还有一点，既然刚才提到了配置文件 <code style="font-size: 14px;word-wrap: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">config.ini</code>，不知您是否会有这样一个疑问：</p><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">如果<span style="color:LightSeaGreen;">配置信息</span>被用户修改了，那么升级之后，所有的配置信息又被<span style="color:LightSeaGreen;">恢复为默认值</span>了，用户的私人配置信息全丢了怎么办？</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="0.804642166344294" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8xAC0e9RlQxYH9ITcdoFVLFRhDtuAbuqZ6pJI9YqmOfSf5aRNzG8CTg/640?wx_fmt=png" data-type="png" data-w="1034" style="display: block;margin: 0 auto;width: auto;max-width: 100%;" src="../Images/839ee552281b9ebec0a30e80154a3f66.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV8xAC0e9RlQxYH9ITcdoFVLFRhDtuAbuqZ6pJI9YqmOfSf5aRNzG8CTg/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">关于这个问题，我们就继续来聊一下增量升级！</p><br data-tool="mdnice编辑器"/><center data-tool="mdnice编辑器"><span style="color:LightSeaGreen;font-size:24px;">增量 p: break-word;padding: 2px 4px;border-radius: 4px;margin: 0 2px;background-color: rgba(27,31,35,.05);font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;word-break: break-all;color: rgb(239, 112, 96);">upgrade.sh</code> 这个升级脚本中：</p><blockquote data-tool="mdnice编辑器" style="display: block;font-size: 0.9em;overflow: auto;overflow-scrolling: touch;border-left: 3px solid rgba(0, 0, 0, 0.4);color: #6a737d;padding-top: 10px;padding-bottom: 10px;padding-left: 20px;padding-right: 10px;margin-bottom: 20px;margin-top: 20px;border-left-color: rgb(239, 112, 96);background: #fff9f9;"><ol style="margin-top: 8px;margin-bottom: 8px;padding-left: 25px;color: black;list-style-type: decimal;" class="list-paddingleft-2"><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">停止(kill)当前正在执行的 V1.0 版本的程序;</p></section></li><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">把 /root/upgrade/mylib.so 文件复制到 /root/app 目录下;</p></section></li><li><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;text-align: left;color: rgb(1,1,1);font-weight: 500;"><p style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0px;color: black;line-height: 26px;">使用 sed 命令来修改 config.ini 文件中的 version 字段;</p></section></li></ol></blockquote><p data-tool="mdnice编辑器" style="font-size: 16px;padding-top: 8px;padding-bottom: 8px;margin: 0;line-height: 26px;color: black;">PS：此时升级包中，只需要包含必要的文件就可以了，不需要把其他用不到的文件也放进去了。</p><figure data-tool="mdnice编辑器" style="margin: 0;margin-top: 10px;margin-bottom: 10px;"><img data-ratio="1.4260869565217391" data-src="https://mmbiz.qpic.cn/mmbiz_png/WC13ibsIvG3bwNWZ6wbGAPjugeHaEibhV898vcPtG6ZKFymg
