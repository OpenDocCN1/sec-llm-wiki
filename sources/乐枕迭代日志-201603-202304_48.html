                        <script type="text/javascript" nonce="1402657412" reportloaderror="">
              (function () {
                var content = "一些写创业的书，都是只写能讲的、确定的、正面的东西，《创业维艰》写的更真实，书中很多陈述式的表达我都想给它加一些语气词。\n\n「对于一家企业来说，真正的难题并不是设置一个宏伟的、难以实现的、大胆的目标，而是你在没有实现宏伟目标之时不得不忍痛裁员的过程。真正的难题不是聘请出色的人才，而是这些“出色的人才”逐渐滋生一种优越感并开始提出过分的要求。真正的难题不是绘制一张组织结构图表，而是让大家在你刚设计好的组织结构内相互交流。真正的难题不是拥有伟大的梦想，而是你在半夜一身冷汗地惊醒时发现，梦想变成了一场噩梦。」"; // 只保留a标签
                var jsTextContent = document.getElementById("js_text_content");
                var jsTextContentFake = document.getElementById("js_text_content_fake");
                // console.log(content);
                content = content.replace(/&amp;lt;(\/?)(?!((a(\s|&amp;gt;))|(\/a))).*?&amp;gt;/g, (s) =&amp;gt; {
                  return s.html(true);
                });
                jsTextContent.innerHTML = window.__emojiFormat(content);
                if (parseFloat(window.getComputedStyle(jsTextContent).height) &amp;gt; parseFloat(window.getComputedStyle(jsTextContentFake).height)) {
