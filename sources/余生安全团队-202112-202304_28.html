              (function () {
                var content = "祝大家2022年新年快乐！\n\n成长，改变，无论在哪个时代，都是催人奋进的力量。我相信，一直和我们同行的你，也是一样。每个时代都有一个时代的焦虑和不安，也有一个时代的期待和希望。顺势而为，势在人为。去探索，去经历，去后悔，去改变。\n\n祝愿新的一年，我们都会感受更多幸福的温暖。\n\n新的一年里，更多和伙伴一起，迎风沐雨，携手向前。新的一年里，为自己设定一个美好的小目标，去实现，去达成。所有美好的憧憬里，我们都会在你身边。\n\n生活的魅力在于，一切成败得失，回望总是如诗。生活的勇气在于，历经风雨，看透世情，心中依然热爱。愿我们永远保持热爱，共赴山海！\n\n--&amp;amp;nbsp;节选自雷军微博"; // 只保留a标签
