<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzI2MjQ1NTA4MA==&amp;mid=2247487832&amp;idx=1&amp;sn=c2495c75ca0c1c0795c76a29b47b9a95&amp;chksm=ea4bbb1fdd3c3209e35600ca48d79e00a0414ec1e406b3902e6da1f3c6ae171f85beb5c5cc4c&amp;scene=126&amp;sessionid=1681322322#rd">http://mp.weixin.qq.com/s?__biz=MzI2MjQ1NTA4MA==&amp;mid=2247487832&amp;idx=1&amp;sn=c2495c75ca0c1c0795c76a29b47b9a95&amp;chksm=ea4bbb1fdd3c3209e35600ca48d79e00a0414ec1e406b3902e6da1f3c6ae171f85beb5c5cc4c&amp;scene=126&amp;sessionid=1681322322#rd</a></blockquote><section style="font-size: 16px;"><p>我弟弟叫聂臣，也写了一篇《我的前半生》，事情虽然都一起经历过，但我也看的眼眶湿润了，纪念一下那段时光吧。</p><p><br/></p><section><img data-ratio="1.5132890939712524" data-src="https://mmbiz.qpic.cn/mmbiz_jpg/yXsxtS2cfwbXBiab9srZ7lFrl4ibWTncadS4JA5ficrT6ickIrTp1dTOLqmyd53NSMXiaLAEQS1CmKVXO7PMxnU6Zew/640?wx_fmt=jpeg" data-type="jpg" data-w="602" src="../Images/87ecdec4cc44b34d5ee26abbaf032a42.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_jpg/yXsxtS2cfwbXBiab9srZ7lFrl4ibWTncadS4JA5ficrT6ickIrTp1dTOLqmyd53NSMXiaLAEQS1CmKVXO7PMxnU6Zew/640?wx_fmt=jpeg"/>​</section><section><img data-ratio="1.5278246402740479" data-src="https://mmbiz.qpic.cn/mmbiz_jpg/yXsxtS2cfwbXBiab9srZ7lFrl4ibWTncaddF0Asc78OwySrrG17IsN7wGflhicQWK07D9q3z1Lp7BNnoaDvQC3bXw/640?wx_fmt=jpeg" data-type="jpg" data-w="593" src="../Images/d91db9992e102132ee16daa69120ba75.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_jpg/yXsxtS2cfwbXBiab9srZ7lFrl4ibWTncaddF0Asc78OwySrrG17IsN7wGflhicQWK07D9q3z1Lp7BNnoaDvQC3bXw/640?wx_fmt=jpeg"/>​</section><section><img data-ratio="1.5008209943771362" data-src="https://mmbiz.qpic.cn/mmbiz_jpg/yXsxtS2cfwbXBiab9srZ7lFrl4ibWTncadia49qRL2tIsyY5ichfjq6ISTIjmFueA8RTmLds1yqEoWica3fDghLzia2g/640?wx_fmt=jpeg" data-type="jpg" data-w="609" src="../Images/50bc55aee70616643bfe392a2a948adc.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_jpg/yXsxtS2cfwbXBiab9srZ7lFrl4ibWTncadia49qRL2tIsyY5ichfjq6ISTIjmFueA8RTmLds1yqEoWica3fDghLzia2g/640?wx_fmt=jpeg"/>​</section><section>
