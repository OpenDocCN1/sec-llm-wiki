<h1>没有猝死，就是胜利！</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzI2MjQ1NTA4MA==&amp;mid=2247486462&amp;idx=1&amp;sn=6091d4d99e4d3b775a11341ad4c329fd&amp;chksm=ea4ba1b9dd3c28af2bc76ecdd66a9fa36eb0362efefa2f7ba6dd944925dc2ebe2a9b3e532b4a&amp;scene=126&amp;sessionid=1681322331#rd">http://mp.weixin.qq.com/s?__biz=MzI2MjQ1NTA4MA==&amp;mid=2247486462&amp;idx=1&amp;sn=6091d4d99e4d3b775a11341ad4c329fd&amp;chksm=ea4ba1b9dd3c28af2bc76ecdd66a9fa36eb0362efefa2f7ba6dd944925dc2ebe2a9b3e532b4a&amp;scene=126&amp;sessionid=1681322331#rd</a></blockquote><div><p style="text-align:left;font-family:'PingFang SC';font-size:16px;"><span style="letter-spacing:2px;color:#333333;">人类的悲欢并不相通</span></p>
<p style="text-align:left;font-family:'PingFang SC';font-size:16px;"><span style="letter-spacing:2px;color:#333333;">朋友圈都在狂欢</span></p>
<p style="text-align:left;font-family:'PingFang SC';font-size:16px;"><span style="letter-spacing:2px;color:#333333;">而我</span></p>
<span style="text-align:left;font-family:'PingFang SC';font-size:16px;"><span style="letter-spacing:2px;color:#333333;">却一心只想吃小龙虾</span></span>
<p style="text-align:left;font-family:'PingFang SC';font-size:16px;"/>
<p style="text-align:left;font-family:'PingFang SC';font-size:16px;"><span style="letter-spacing:2px;color:#333333;">没有硝烟的战斗</span></p>
<p style="text-align:left;font-family:'PingFang SC';font-size:16px;"><span style="letter-spacing:2px;color:#333333;">每个人都是英雄</span></p>
<p style="text-align:left;font-family:'PingFang SC';font-size:16px;"/>
<p style="text-align:left;font-family:'PingFang SC';font-size:16px;"><span style="letter-spacing:2px;color:#333333;">大家过年好！</span></p>
</div>
