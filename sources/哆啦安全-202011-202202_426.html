<h1>Android10系统开发实现跳过开机向导、插电源线不休眠等默认配置</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=Mzg2NzUzNzk1Mw==&amp;mid=2247484592&amp;idx=2&amp;sn=1573537f2aab2362d6737706e61d7527&amp;chksm=cebb41fef9ccc8e8cddd02676e56932940af110913c01d2e6d07df3a8c4427fb271a1e322c54&amp;scene=126&amp;sessionid=1681666912#rd">http://mp.weixin.qq.com/s?__biz=Mzg2NzUzNzk1Mw==&amp;mid=2247484592&amp;idx=2&amp;sn=1573537f2aab2362d6737706e61d7527&amp;chksm=cebb41fef9ccc8e8cddd02676e56932940af110913c01d2e6d07df3a8c4427fb271a1e322c54&amp;scene=126&amp;sessionid=1681666912#rd</a></blockquote><section data-tool="mdnice&#x7F16;&#x8F91;&#x5668;" data-website="https://www.mdnice.com" style="font-size: 16px;color: black;padding-right: 10px;padding-left: 10px;line-height: 1.6;letter-spacing: 0px;word-break: break-word;overflow-wrap: break-word;text-align: left;font-family: Optima-Regular, Optima, PingFangSC-light, PingFangTC-light, &quot;PingFang SC&quot;, Cambria, Cochin, Georgia, Times, &quot;Times New Roman&quot;, serif;"><section data-tool="mdnice编辑器" data-website="https://www.mdnice.com" style="font-size: 16px;color: black;padding-right: 10px;padding-left: 10px;line-height: 1.6;letter-spacing: 0px;word-break: break-word;overflow-wrap: break-word;text-align: left;font-family: Optima-Regular, Optima, PingFangSC-light, PingFangTC-light, &quot;PingFang SC&quot;, Cambria, Cochin, Georgia, Times, &quot;Times New Roman&quot;, serif;"><section data-tool="mdnice编辑器" data-website="https://www.mdnice.com" style="font-size: 16px;color: black;padding-right: 10px;padding-left: 10px;line-height: 1.6;letter-spacing: 0px;word-break: break-word;overflow-wrap: break-word;text-align: left;font-family: Optima-Regular, Optima, PingFangSC-light, PingFangTC-light, &quot;PingFang SC&quot;, Cambria, Cochin, Georgia, Times, &quot;Times New Roman&quot;, serif;"><figure data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;display: flex;flex-direction: column;justify-content: center;align-items: center;"><section data-tool="mdnice编辑器" data-website="https://www.mdnice.com" style="font-size: 16px;color: black;padding-right: 10px;padding-left: 10px;line-height: 1.6;letter-spacing: 0px;word-break: break-word;overflow-wrap: break-word;text-align: left;font-family: Optima-Regular, Optima, PingFangSC-light, PingFangTC-light, &quot;PingFang SC&quot;, Cambria, Cochin, Georgia, Times, &quot;Times New Roman&quot;, serif;"><h2 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;font-size: 22px;">一、前言</h2><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;">在刷机玩机过程中,常常遇到刷机之后烦人的开机引导设置。特别是有强迫症的人，多希望开机之后就跳转到主界面。经过研究了一下，可以通过修改安卓源码中的默认设置跳过开机引导，此外还有很多其他功能，比如是否打开蓝牙、锁屏等等功能都可以通过默认配置进行修改。</p><h2 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;font-size: 22px;"><span style="display: none;"/>二、安卓系统默认配置设置介绍</h2><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;">安卓源码中默认属性配置存放路径如下:</p><pre data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;border-radius: 5px;box-shadow: rgba(0, 0, 0, 0.55) 0px 2px 10px;"><span style="display: block;background: url(&quot;https://mmbiz.qpic.cn/mmbiz_png/9vkUcew54332H80AibECriccicgZhPfoPEzwJvB6DPLr40sv274AYnKjjfDbM8fKVn4ibsC8WfFJvKCwT5um5myBicQ/640?wx_fmt=png&quot;) 10px 10px / 40px no-repeat rgb(40, 44, 52);height: 30px;width: 100%;margin-bottom: -7px;border-radius: 5px;"/><code style="overflow-x: auto;padding: 16px;color: #abb2bf;display: -webkit-box;font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;font-size: 12px;-webkit-overflow-scrolling: touch;padding-top: 15px;background: #282c34;border-radius: 5px;">frameworks/base/packages/SettingsProvider/res/values/defaults.xml<br/></code></pre><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;">该文件中有很多系统初始化的配置信息，以下列举几个:</p><pre data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;border-radius: 5px;box-shadow: rgba(0, 0, 0, 0.55) 0px 2px 10px;"><span style="display: block;background: url(&quot;https://mmbiz.qpic.cn/mmbiz_png/9vkUcew54332H80AibECriccicgZhPfoPEzwJvB6DPLr40sv274AYnKjjfDbM8fKVn4ibsC8WfFJvKCwT5um5myBicQ/640?wx_fmt=png&quot;) 10px 10px / 40px no-repeat rgb(40, 44, 52);height: 30px;width: 100%;margin-bottom: -7px;border-radius: 5px;"/><code style="overflow-x: auto;padding: 16px;color: #abb2bf;display: -webkit-box;font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;font-size: 12px;-webkit-overflow-scrolling: touch;padding-top: 15px;background: #282c34;border-radius: 5px;"><span style="color: #5c6370;font-style: italic;line-height: 26px;">&lt;!--默认是否打开蓝牙--&gt;</span><br/> <span style="line-height: 26px;">&lt;<span style="color: #e06c75;line-height: 26px;">bool</span> <span style="color: #d19a66;line-height: 26px;">name</span>=<span style="color: #98c379;line-height: 26px;">"def_bluetooth_on"</span>&gt;</span>true<span style="line-height: 26px;">&lt;/<span style="color: #e06c75;line-height: 26px;">bool</span>&gt;</span><br/><span style="color: #5c6370;font-style: italic;line-height: 26px;">&lt;!--默认是打开安装非应用市场的app--&gt;</span><br/><span style="line-height: 26px;">&lt;<span style="color: #e06c75;line-height: 26px;">bool</span> <span style="color: #d19a66;line-height: 26px;">name</span>=<span style="color: #98c379;line-height: 26px;">"def_install_non_market_apps"</span>&gt;</span>false<span style="line-height: 26px;">&lt;/<span style="color: #e06c75;line-height: 26px;">bool</span>&gt;</span><br/><span style="color: #5c6370;font-style: italic;line-height: 26px;">&lt;!--默认是否开启包验证--&gt;</span><br/><span style="line-height: 26px;">&lt;<span style="color: #e06c75;line-height: 26px;">bool</span> <span style="color: #d19a66;line-height: 26px;">name</span>=<span style="color: #98c379;line-height: 26px;">"def_package_verifier_enable"</span>&gt;</span>true<span style="line-height: 26px;">&lt;/<span style="color: #e06c75;line-height: 26px;">bool</span>&gt;</span><br/><span style="color: #5c6370;font-style: italic;line-height: 26px;">&lt;!--默认是否开启数据线连接电源情况下不休眠--&gt;</span><br/><span style="line-height: 26px;">&lt;<span style="color: #e06c75;line-height: 26px;">bool</span> <span style="color: #d19a66;line-height: 26px;">name</span>=<span style="color: #98c379;line-height: 26px;">"def_stay_on_while_plugged_in"</span>&gt;</span>false<span style="line-height: 26px;">&lt;/<span style="color: #e06c75;line-height: 26px;">bool</span>&gt;</span><br/><span style="color: #5c6370;font-style: italic;line-height: 26px;">&lt;!--本文的关键属性======默认是否开启跳过开机向导--&gt;</span><br/><span style="line-height: 26px;">&lt;<span style="color: #e06c75;line-height: 26px;">bool</span> <span style="color: #d19a66;line-height: 26px;">name</span>=<span style="color: #98c379;line-height: 26px;">"def_user_setup_complete"</span>&gt;</span>false<span style="line-height: 26px;">&lt;/<span style="color: #e06c75;line-height: 26px;">bool</span>&gt;</span><br/></code></pre><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;">从以上属性看defaults.xml中绝大多数属性的值要么false，要么true，修改起来非常方便。</p><h2 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;font-size: 22px;"><span style="display: none;"/>三、修改默认属性实战</h2><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;">我们将以上列举的属性值true改为false,false改为true。如下:</p><pre data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;border-radius: 5px;box-shadow: rgba(0, 0, 0, 0.55) 0px 2px 10px;"><span style="display: block;background: url(&quot;https://mmbiz.qpic.cn/mmbiz_png/9vkUcew54332H80AibECriccicgZhPfoPEzwJvB6DPLr40sv274AYnKjjfDbM8fKVn4ibsC8WfFJvKCwT5um5myBicQ/640?wx_fmt=png&quot;) 10px 10px / 40px no-repeat rgb(40, 44, 52);height: 30px;width: 100%;margin-bottom: -7px;border-radius: 5px;"/><code style="overflow-x: auto;padding: 16px;color: #abb2bf;display: -webkit-box;font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;font-size: 12px;-webkit-overflow-scrolling: touch;padding-top: 15px;background: #282c34;border-radius: 5px;"><span style="color: #5c6370;font-style: italic;line-height: 26px;">&lt;!--关闭蓝牙--&gt;</span><br/> <span style="line-height: 26px;">&lt;<span style="color: #e06c75;line-height: 26px;">bool</span> <span style="color: #d19a66;line-height: 26px;">name</span>=<span style="color: #98c379;line-height: 26px;">"def_bluetooth_on"</span>&gt;</span>false<span style="line-height: 26px;">&lt;/<span style="color: #e06c75;line-height: 26px;">bool</span>&gt;</span><br/><span style="color: #5c6370;font-style: italic;line-height: 26px;">&lt;!--允许--&gt;</span><br/><span style="line-height: 26px;">&lt;<span style="color: #e06c75;line-height: 26px;">bool</span> <span style="color: #d19a66;line-height: 26px;">name</span>=<span style="color: #98c379;line-height: 26px;">"def_install_non_market_apps"</span>&gt;</span>true<span style="line-height: 26px;">&lt;/<span style="color: #e06c75;line-height: 26px;">bool</span>&gt;</span><br/><span style="color: #5c6370;font-style: italic;line-height: 26px;">&lt;!--关闭包验证--&gt;</span><br/><span style="line-height: 26px;">&lt;<span style="color: #e06c75;line-height: 26px;">bool</span> <span style="color: #d19a66;line-height: 26px;">name</span>=<span style="color: #98c379;line-height: 26px;">"def_package_verifier_enable"</span>&gt;</span>true<span style="line-height: 26px;">&lt;/<span style="color: #e06c75;line-height: 26px;">bool</span>&gt;</span><br/><span style="color: #5c6370;font-style: italic;line-height: 26px;">&lt;!--连接电源情况下不休眠--&gt;</span><br/><span style="line-height: 26px;">&lt;<span style="color: #e06c75;line-height: 26px;">bool</span> <span style="color: #d19a66;line-height: 26px;">name</span>=<span style="color: #98c379;line-height: 26px;">"def_stay_on_while_plugged_in"</span>&gt;</span>true<span style="line-height: 26px;">&lt;/<span style="color: #e06c75;line-height: 26px;">bool</span>&gt;</span><br/><span style="color: #5c6370;font-style: italic;line-height: 26px;">&lt;!--本文的关键属性======开启跳过开机向导--&gt;</span><br/><span style="line-height: 26px;">&lt;<span style="color: #e06c75;line-height: 26px;">bool</span> <span style="color: #d19a66;line-height: 26px;">name</span>=<span style="color: #98c379;line-height: 26px;">"def_user_setup_complete"</span>&gt;</span>true<span style="line-height: 26px;">&lt;/<span style="color: #e06c75;line-height: 26px;">bool</span>&gt;</span><br/></code></pre><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;">修改以上属性完成之后编译。双清手机刷机，可以看到修改的属性生效，比如开机之后直接进入主界面了。</p><p style="text-align: center;line-height: 1.5em;"><br/></p><figure data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;display: flex;flex-direction: column;justify-content: center;align-items: center;"/><span style="letter-spacing: 0px;">[</span><strong style="letter-spacing: 0px;">上一篇</strong><span style="letter-spacing: 0px;">]</span><a href="https://mp.weixin.qq.com/s?__biz=Mzg2MjU1NDE1NA==&amp;mid=2247484090&amp;idx=1&amp;sn=85c10fa5435e82565df37a26f664b911&amp;scene=21#wechat_redirect" data-linktype="2" style="letter-spacing: 0px;box-sizing: border-box;color: rgb(30, 107, 184);outline: none;cursor: pointer;transition: color 0.3s ease 0s;touch-action: manipulation;overflow-wrap: break-word;font-weight: bold;border-bottom: 1px solid rgb(30, 107, 184);">玩转Android10源码开发定制(14)修改安卓源码手机永不休眠</a><p style="padding-top: 8px;padding-bottom: 8px;white-space: normal;max-width: 100%;min-height: 1em;color: rgb(0, 0, 0);font-family: Optima-Regular, Optima, PingFangSC-light, PingFangTC-light, &quot;PingFang SC&quot;, Cambria, Cochin, Georgia, Times, &quot;Times New Roman&quot;, serif;font-size: 16px;text-align: left;background-color: rgb(255, 255, 255);line-height: normal;box-sizing: border-box !important;overflow-wrap: break-word !important;"><a target="_blank" href="http://mp.weixin.qq.com/s?__biz=Mzg2MjU1NDE1NA==&amp;mid=2247484090&amp;idx=1&amp;sn=85c10fa5435e82565df37a26f664b911&amp;chksm=ce0753fff970dae9505a4bc25bc
