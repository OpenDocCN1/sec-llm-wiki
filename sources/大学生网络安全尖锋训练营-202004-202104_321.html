<h1>教诲如春风，师恩深似海</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzUzODkwMDMxNA==&amp;mid=2247490135&amp;idx=1&amp;sn=77c890db321af753bdb52f1a944bc920&amp;chksm=fad1f862cda671745a38222d5d71080adffcfa1ee5f6ecaf0521d2ca02ace3af5d2c16a53447&amp;scene=126&amp;sessionid=1681655923#rd">http://mp.weixin.qq.com/s?__biz=MzUzODkwMDMxNA==&amp;mid=2247490135&amp;idx=1&amp;sn=77c890db321af753bdb52f1a944bc920&amp;chksm=fad1f862cda671745a38222d5d71080adffcfa1ee5f6ecaf0521d2ca02ace3af5d2c16a53447&amp;scene=126&amp;sessionid=1681655923#rd</a></blockquote><p>阳光普照，园丁心坎春意暖；雨露滋润，桃李枝头蓓蕾红。——祝老师们节日愉快。<br/></p><p style="text-align: center;"><img class="rich_pages js_insertlocalimg" data-ratio="1.55390625" data-s="300,640" data-src="https://mmbiz.qpic.cn/sz_mmbiz_png/c7Zcuzjgx3yz2ZvCvc1sTYkDFPe3OeyEib7T8rzZnQKTVO7rJiaHJIibsr4Ect1iaxmjuCZelPBQOu1BjJzCsl8Ajw/640?wx_fmt=png" data-type="png" data-w="1280" style="" src="../Images/12d0eaf864b58c508a1c6f7bbfa9fe60.png" data-original-src="https://mmbiz.qpic.cn/sz_mmbiz_png/c7Zcuzjgx3yz2ZvCvc1sTYkDFPe3OeyEib7T8rzZnQKTVO7rJiaHJIibsr4Ect1iaxmjuCZelPBQOu1BjJzCsl8Ajw/640?wx_fmt=png"/></p><p><br/></p>
