<h1>山寨APP曝恶意吸费隐患如何防范？</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MjM5NzE0NTIxMg==&amp;appmsgid=10000026&amp;itemidx=1&amp;scene=126&amp;sessionid=1681369341#wechat_redirect">http://mp.weixin.qq.com/s?__biz=MjM5NzE0NTIxMg==&amp;appmsgid=10000026&amp;itemidx=1&amp;scene=126&amp;sessionid=1681369341#wechat_redirect</a></blockquote><p> 智能机用户如何下载安全的应用？</p><p>1、辨识客户端图标；</p><p>2、了解其下载数量；</p><p>3、浏览下载市场中相关评价；</p><p>4、查看应用菜单中的“帮助”了解软件商情况；</p><p>5、下载手机安全软件；</p><p>6、最重要的是开发者在梆梆加固app从源头杜绝山寨！</p><p style="text-align:center"><img src="../Images/d2968e1a754ce471fe649b51b4e58928.png" data-original-src="http://mmsns.qpic.cn/mmsns/YpfGdibD1mRltOiciaAahaIyprqptNQRL0qAkcI8jHczVz3X5HIzlcvsQ/0"/></p><p> </p>
