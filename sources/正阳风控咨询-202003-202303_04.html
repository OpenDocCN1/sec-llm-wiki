<h1>风控驿站，落地望京</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzI1MzA3Mjg4Mg==&amp;mid=2647831392&amp;idx=1&amp;sn=2748d56da415808ebc0aa667e89e6151&amp;chksm=f1fc17fdc68b9eeb8f8eb79c29cf42ccc1df1a6006b7b54fae8b532b65eebdab9450240b7831&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/s?__biz=MzI1MzA3Mjg4Mg==&amp;mid=2647831392&amp;idx=1&amp;sn=2748d56da415808ebc0aa667e89e6151&amp;chksm=f1fc17fdc68b9eeb8f8eb79c29cf42ccc1df1a6006b7b54fae8b532b65eebdab9450240b7831&amp;scene=27#wechat_redirect</a></blockquote><section data-tool="mdnice&#x7F16;&#x8F91;&#x5668;" data-website="https://www.mdnice.com"><figure data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;display: flex;flex-direction: column;justify-content: center;align-items: center;"><section data-tool="mdnice编辑器" data-website="https://www.mdnice.com"><h1 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;font-size: 24px;"><span style="font-size: 18px;">1.时局背景</span></h1><p data-tool="mdnice编辑器"><span style="font-size: 16px;">前段时间参加张伟老师组织的Fintech读书交流会，与《数据化风控》的作者乔杨以及谢士晨、周立峰、求是汪等业内模型大佬同台交流，倍感荣幸。三个多小时的交流，各位老师分享了许多精彩的风控案例，令人惊喜也令人动容；在感叹行业合规整顿、企业数字化转型的同时，每一位老师都出奇一致的强调：</span><span style="font-size: 16px;color: rgb(2, 30, 170);">智能风控的大背景下，企业对于人才的需求不降反增且更加明确，集技术与业务能力于一身的精英化风控人才颇受欢迎。</span></p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;">信贷业务的逻辑不算复杂，个贷风控方面也有充足的RPA空间，所以在敞口收缩压力增大的时候，就要求互联网风控人员应有扎实的技术实力，也应充分了解自己所负责的业务线条及流程全貌，了解生态下的动与静、暗与明。技术和业务的综合能力要求都在逐渐提高，仅仅是模型岗位就有很多要懂：</span><span style="font-size: 16px;color: rgb(2, 30, 170);">如果是模型部署，要懂点IT技术；如果是模型策略，要懂点消费心理；如果是模型服务，要懂点售前方案；如果是模型架构，还要懂点工程管理。</span><span style="font-size: 16px;">于个人，懂的多而深就可以有足够的竞争力抓住机遇；于集体，懂的多而深才可能真正做到千人千面一人一策。</span></p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;">千里马常有，伯乐也常有，优秀的多元化人才始终稀缺，行业应持续重视对复合型风控人才的培养。</span></p><h1 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;font-size: 24px;"><span style="font-size: 18px;">2.风控学社</span></h1><p data-tool="mdnice编辑器"><span style="font-size: 16px;">正阳风控学社自2019年初创立以来，本着</span><span style="font-size: 16px;color: rgb(2, 30, 170);">“风控是个大系统，核心在于人才培养”</span><span style="font-size: 16px;">的理念，聚志士、集智识，虽算不上大作为，也没有经过商业化的洗礼，但还好为大家提供了一个交流话题、同步信息、共享资料、结识好友的社区，悄然间已近两年之久，而这两年间，许多社友一起经历了一波波的风雨莫测波谲云诡：行业洗牌、金融科技崛起、P2P清退、银行全面转型、民间借贷约束、持牌寒栗调整，门槛一道又一道，政策一轮又一轮。</span></p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;">对从业人员来说，行业确在收缩，编制确在减少，供大于求，仍记得2017年模型岗风靡一时，现如今几轮清退后所剩无几。剩余玩家多为正规军，接受正规“军事化”管理培训，另一部分为数不多的野战军也隐匿起来，或转战海外，或擦边隐忍，要么不满足，要么不甘心，却都翘首以待伺机而动。</span></p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;">无论如何，生活还是要继续，风控学社也要继续。</span></p><h1 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;font-size: 24px;"><span style="font-size: 18px;">3.风控社群</span></h1><p data-tool="mdnice编辑器"><span style="font-size: 16px;">风控社群不断发展，经过几次化整为零和零存整取的过程，最终分成了五大版块：市场、产品、策略、模型、运营，另有根据业务内容切分的海外、银行、消金、金融科技等，总计2000余人，仍在不断扩大。各群功能明确：尽可能吸收业内专业干货知识，又避免过多思维和交流上的混杂和牵扯，此举效果明显，得到好评无数。目前几个较为热闹的社群有：策略一纵、模型三师、出海四野、市场五联等，各位需要入群的伙伴可根据个人需求和如下各群功能联系后台阳小妹，申请加入。</span></p><ul data-tool="mdnice编辑器" style="margin-top: 8px;margin-bottom: 8px;padding-left: 25px;" class="list-paddingleft-2"><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;"><strong style="color: black;">市场</strong>：业务来往、行业研报、前沿动态、金融科技等。</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;"><strong style="color: black;">产品</strong>：产品设计、审批系统、决策引擎、用户体验等。</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;"><strong style="color: black;">策略</strong>：政策解读、风控策略、规则设计、决策科学等。</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;"><strong style="color: black;">模型</strong>：变量挖掘、特征工程、算法应用、模型部署等。</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;"><strong style="color: black;">运营</strong>：运营监控、客户提醒、营销获客、用户画像等。</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;"><strong style="color: black;">出海</strong>：全面挖掘印度、印尼、非洲等海外市场机会。</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;"><strong style="color: black;">银行</strong>：全面了解银行数字化转型路线及解决方案。</span></section></li></ul><figure data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;display: flex;flex-direction: column;justify-content: center;align-items: center;"/><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;">社群虽好，然则功能有限，如不全力专心运营，既无法做到持续稳定的知识输出，又无法保证优质内容的精耕细作，所以正阳及风控方面运营团队在多位领导、老师、同事以及诸多社友的大力支持下，决定再前进一步。</span></p><figure data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;white-space: normal;display: flex;flex-direction: column;justify-content: center;align-items: center;"><img data-ratio="0.4634146341463415" data-src="https://mmbiz.qpic.cn/mmbiz_png/06CGwOvfPbGfgV6UVkL5bSibnIqMqTwsFUzG9wic5rI3uvUSzxIibZO1ssoj3pGnIvic7EvywEn9ibcUcGrS9Z5mGJw/640?wx_fmt=png" data-type="png" data-w="1230" style="margin-right: auto;margin-left: auto;display: block;" src="../Images/66b926ebd2a0bc62328477a79cec77f6.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/06CGwOvfPbGfgV6UVkL5bSibnIqMqTwsFUzG9wic5rI3uvUSzxIibZO1ssoj3pGnIvic7EvywEn9ibcUcGrS9Z5mGJw/640?wx_fmt=png"/></figure><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 18px;font-weight: bold;">4.风</span><span style="font-size: 18px;font-weight: bold;">控驿站</span><span style="font-size: 16px;"/></p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;">风控这件事情很奇妙，经常念叨“风控本质是什么”的人，其实也不一定得其真知，见过厉害的前辈多了就会发现：</span><span style="font-size: 16px;color: rgb(2, 30, 170);">风控真是个大系统！</span><span style="font-size: 16px;">越懂风控的人，越低调，越谦和，因为他们也担心自己说不准什么时候就被风控了。另外一个有趣的事情是：能够写成ppt或其他文件分享的风控知识，离真实的风险管理也不够近，风控<span style="font-size: 16px;">应该是绝大部分人需要掌握的能力，</span><span style="font-size: 16px;">却</span>也只是一小部分人从事的职业，很多资料不能在线上随便分享，需要口传心授。</span><span style="font-size: 16px;color: rgb(2, 30, 170);">风险无处不在，风控不可名状！</span></p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;">于是，风控学社运营团队决定于京都胜地望京地铁站附近开设“风控驿站”，为广大风控爱好人士提供如下基础服务：</span></p><ul data-tool="mdnice编辑器" style="margin-top: 8px;margin-bottom: 8px;padding-left: 25px;" class="list-paddingleft-2"><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;">在京人士可以 青梅煮酒高谈阔论；</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;">来京出差可以 留步歇脚寻师访友；</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;">个人筑基可以 研究框架零存整取；</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;">团体精进可以 组织培训专题研讨；</span></section></li></ul><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;"><span style="font-size: 16px;">“风控<span style="font-size: 16px;">驿</span><span style="font-size: 16px;">站</span>”</span>另会推出诸多线下特色活动及功能：</span></p><ul data-tool="mdnice编辑器" style="margin-top: 8px;margin-bottom: 8px;padding-left: 25px;" class="list-paddingleft-2"><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;">多线条风控训练营</span><span style="font-size: 16px;">：模型开发全流程、精细化运营报表体系等；</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;"><span style="color: rgb(1, 1, 1);font-size: 16px;">行业风控人才库</span><span style="color: rgb(1, 1, 1);font-size: 16px;">：海外风控人才库、银行业风控人才库等。</span></span><span style="font-size: 16px;"/></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="color: rgb(1, 1, 1);font-size: 16px;">海内外多场景业务动态追踪</span><span style="color: rgb(1, 1, 1);font-size: 16px;">：印度现金贷<span style="color: rgb(1, 1, 1);font-size: 16px;">白热化浪潮</span>、印尼布局<span style="color: rgb(1, 1, 1);font-size: 16px;">决战之巅</span>、海外金融科技布局现状等；</span><br/><span style="font-size: 16px;"/></section></li></ul><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;">对于各类型行业风控爱好者，可以：</span></p><ul data-tool="mdnice编辑器" style="margin-top: 8px;margin-bottom: 8px;padding-left: 25px;" class="list-paddingleft-2"><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;">深入风控圈子</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;">结识同行好友</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;">培养风控嗅觉</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;">感知行业变化</span></section></li><li style="font-size: 16px;"><section style="margin-top: 5px;margin-bottom: 5px;line-height: 26px;color: rgb(1, 1, 1);"><span style="font-size: 16px;">把握个人机遇</span></section></li></ul><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;"><span style="font-size: 16px;">紧锣密鼓筹备，还请有上述需求者多多关注。</span></span></p><h1 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;font-size: 24px;"><span style="font-size: 18px;">5.求贤若渴</span></h1><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;">北五环望京，驿站之地，面向全国风控爱好者，敞开大门，永久开放。垒起七星灶，铜壶煮三江，摆开八仙桌，招待十六方，<span style="font-size: 16px;">来的都是客，全凭嘴一张，相逢开口笑，过后不思量</span><span style="font-size: 16px;">。</span></span></p><figure data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;display: flex;flex-direction: column;justify-content: center;align-items: center;"><img data-ratio="0.4310197086546701" data-src="https://mmbiz.qpic.cn/mmbiz_png/06CGwOvfPbGfgV6UVkL5bSibnIqMqTwsFw1SvFV4l3kvoICxPQp4kJ0UX7yibI4c6kTJ4iaWJUwvjO3EWACXs48qw/640?wx_fmt=png" data-type="png" data-w="1167" style="display: block;margin-right: auto;margin-left: auto;" src="../Images/e51381179a146f9940a2a6c96ffcc2f3.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/06CGwOvfPbGfgV6UVkL5bSibnIqMqTwsFw1SvFV4l3kvoICxPQp4kJ0UX7yibI4c6kTJ4iaWJUwvjO3EWACXs48qw/640?wx_fmt=png"/><figcaption style="margin-top: 5px;text-align: left;color: rgb(136, 136, 136);font-size: 14px;"><span style="font-size: 16px;color: rgb(51, 51, 51);text-align: justify;">万事俱备，只待贤人：市场、产品、模型、策略、运营、管理、银行、海外、消金、互金、第三方科技等，凡此种种，有广结善缘者欢迎，有侠肝义胆者欢迎，有能谋善断者欢迎，有手眼通天者欢迎，有不甘平庸者欢迎，有侠客柔情者欢迎，有奇技神巧者欢迎，有宏图野心者欢迎，有闲云野鹤者欢迎，有郁不得志者欢迎，总之，欢迎欢迎，热烈欢迎。</span><br/></figcaption></figure><h1 data-tool="mdnice编辑器" style="margin-top: 30px;margin-bottom: 15px;font-weight: bold;font-size: 24px;"><span style="font-size: 18px;">6.联系我们</span></h1><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 26px;"><span style="font-size: 16px;">另，驿站功能多样，配套有会议室、读书区、休闲区等功能区，</span><span style="font-size: 16px;">在商用方面：</span></p><p data-tool="mdnice编辑器" style="white-space: normal;"><span style="font-size: 16px;color: rgb(2, 30, 170);">面向公司</span><span style="font-size: 16px;">，提供长期或临时办公场地、培训场地、会议场地、室内团建场地等。</span></p><p data-tool="mdnice编辑器" style="white-space: normal;"><span style="font-size: 16px;color: rgb(2, 30, 170);">面向个人</span><span style="font-size: 16px;">，提供读书会、自习室、咨询室、茶吧、休闲区等。</span></p><p style="text-align: center;"><img class="rich_pages js_insertlocalimg" data-ratio="0.45012787723785164" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/06CGwOvfPbGmOmfOGXG1EGtta3LpgEZXUlhhIxR5vBGtKsgH3e8rSBVdiaBc9Z5AzqiahDC9EoysVSOpIL22b7cA/640?wx_fmt=png" data-type="png" data-w="1173" style="" src="../Images/165147bf67e478597a891cc0d9804490.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/06CGwOvfPbGmOmfOGXG1EGtta3LpgEZXUlhhIxR5vBGtKsgH3e8rSBVdiaBc9Z5AzqiahDC9EoysVSOpIL22b7cA/640?wx_fmt=png"/><br/></p><p style="text-align: center;"><img class="rich_pages js_insertlocalimg" data-ratio="0.4487847222222222" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/06CGwOvfPbGmOmfOGXG1EGtta3LpgEZXDzgNw4XFic0iaLvDTjvAMrpbt8YRnBUMGY9jEgHk2DJhP2FjkLclBJow/640?wx_fmt=png" data-type="png" data-w="1152" style="" src="../Images/7ba1cc4ddee0e6d13aeb92b4a269be72.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/06CGwOvfPbGmOmfOGXG1EGtta3LpgEZXDzgNw4XFic0iaLvDTjvAMrpbt8YRnBUMGY9jEg
