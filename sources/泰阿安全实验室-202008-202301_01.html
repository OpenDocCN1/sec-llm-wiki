<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=Mzg5MDQyMzg3NQ==&amp;mid=2247483891&amp;idx=1&amp;sn=21b199b87d151eebb1904b3212a4312e&amp;chksm=cfdd9edff8aa17c9741d1c6ade562b9dd92dec529da95e62435521317f1096e2996cfc05fc4b&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/s?__biz=Mzg5MDQyMzg3NQ==&amp;mid=2247483891&amp;idx=1&amp;sn=21b199b87d151eebb1904b3212a4312e&amp;chksm=cfdd9edff8aa17c9741d1c6ade562b9dd92dec529da95e62435521317f1096e2996cfc05fc4b&amp;scene=27#wechat_redirect</a></blockquote><p style="text-align: center;">2023新年快乐，各位关注公众号的小伙伴们，博主还活着，没跑路，没断更。</p><p style="text-align: center;">新的一年看看不忙的时候给各位更新一些干货。</p><p style="text-align: center;"><img class="rich_pages wxw-img js_insertlocalimg" data-ratio="1" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_jpg/BibeFvVBkRAicLr2lqXHA05pPU1iasDFMwppm21QIsTzIubWa9c8MNt8rPNyTOu4aYZSdiaYRefYUoPNz2bqP7Aerg/640?wx_fmt=jpeg" data-type="jpeg" data-w="1080" style="" src="../Images/1ba876bf421b64db01dd8a58c5ef0d41.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_jpg/BibeFvVBkRAicLr2lqXHA05pPU1iasDFMwppm21QIsTzIubWa9c8MNt8rPNyTOu4aYZSdiaYRefYUoPNz2bqP7Aerg/640?wx_fmt=jpeg"/></p><p style="display: none;"><mp-style-type data-value="3"/></p>
