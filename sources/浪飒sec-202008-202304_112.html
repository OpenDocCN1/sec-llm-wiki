<h1>新冠回忆录</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzI1ODM1MjUxMQ==&amp;mid=2247490313&amp;idx=2&amp;sn=4d4d0b40914530a83f87e01627530ef1&amp;chksm=ea082f19dd7fa60ffae57f0edfa201ec3931471540e82b3f7eecefd01a0ffa0ca80af1fadc6c&amp;scene=126&amp;sessionid=1681669798#rd">http://mp.weixin.qq.com/s?__biz=MzI1ODM1MjUxMQ==&amp;mid=2247490313&amp;idx=2&amp;sn=4d4d0b40914530a83f87e01627530ef1&amp;chksm=ea082f19dd7fa60ffae57f0edfa201ec3931471540e82b3f7eecefd01a0ffa0ca80af1fadc6c&amp;scene=126&amp;sessionid=1681669798#rd</a></blockquote><p cid="n0" mdtype="paragraph" style="box-sizing: border-box;line-height: inherit;orphans: 4;margin-top: 1rem;margin-bottom: 1rem;font-family: NanumGothic, sans-serif;white-space: pre-wrap;color: rgb(0, 0, 0);font-size: 14px;text-align: left;">新冠元年冬，新冠疫始于武昌府。</p><p cid="n6" mdtype="paragraph" style="box-sizing: border-box;line-height: inherit;orphans: 4;margin-top: 1rem;margin-bottom: 1rem;font-family: NanumGothic, sans-serif;white-space: pre-wrap;color: rgb(0, 0, 0);font-size: 14px;text-align: left;"><span md-inline="plain" style="box-sizing: border-box;">越明年，荆楚大疫，染者数万。</span></p><p cid="n7" mdtype="paragraph" style="box-sizing: border-box;line-height: inherit;orphans: 4;margin-top: 1rem;margin-bottom: 1rem;font-family: NanumGothic, sans-serif;white-space: pre-wrap;color: rgb(0, 0, 0);font-size: 14px;text-align: left;"><span md-inline="plain" style="box-sizing: border-box;">此去三年，人面不知何处去，桃花依旧笑春风。</span></p><p style="display: none;"><mp-style-type data-value="3"/></p>
