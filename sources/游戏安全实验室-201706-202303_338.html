<h1>祝：中秋节快乐</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzIyMzc0NDU0Ng==&amp;mid=2247484162&amp;idx=1&amp;sn=902ab240a18971eb969d6f8574530f3b&amp;chksm=e818c44fdf6f4d59a33aabaaaa4b240b852d4dd838b48cc89e8791738a5df740cb67a68bde51&amp;scene=126&amp;sessionid=1681668809#rd">http://mp.weixin.qq.com/s?__biz=MzIyMzc0NDU0Ng==&amp;mid=2247484162&amp;idx=1&amp;sn=902ab240a18971eb969d6f8574530f3b&amp;chksm=e818c44fdf6f4d59a33aabaaaa4b240b852d4dd838b48cc89e8791738a5df740cb67a68bde51&amp;scene=126&amp;sessionid=1681668809#rd</a></blockquote><p style="text-align: center;"><span style="line-height: 1.6;color: rgb(255, 169, 0);">喜迎中秋庆团圆，</span></p><p style="text-align: center;"><span style="line-height: 1.6;color: rgb(255, 169, 0);">欢乐笑语万里传。<br/></span></p><p style="text-align: center;"><span style="color: rgb(255, 169, 0);">桂枝明月祝福贺，</span></p><p style="text-align: center;"><span style="color: rgb(255, 169, 0);">音好花开成佳缘。</span></p><p style="text-align: center;"><br/></p><p><img data-s="300,640" data-type="jpeg" data-src="https://mmbiz.qpic.cn/mmbiz_jpg/cZMMEC3jlQt3gzxGwc3lYN5BLuY8ib3ABkCrnRSjm2rASnIkqbXa1e7PchCSjIWgvM02ORhqVKmq0SNjsEj974Q/0?wx_fmt=jpeg" class="" data-ratio="0.925" data-w="1280" src="../Images/0afe57bc853c1b467dc0e557f6c36583.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_jpg/cZMMEC3jlQt3gzxGwc3lYN5BLuY8ib3ABkCrnRSjm2rASnIkqbXa1e7PchCSjIWgvM02ORhqVKmq0SNjsEj974Q/0?wx_fmt=jpeg"/></p>
