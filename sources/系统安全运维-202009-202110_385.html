<h1>长大的意义</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=Mzk0NjE0NDc5OQ==&amp;mid=2247484532&amp;idx=1&amp;sn=148fdcd8397492c170e20ea8951e8f09&amp;chksm=c30bd704f47c5e12ea19508a92e9b2dd02277a3a93ca33582de8487b47001d8b83b76907c298&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/s?__biz=Mzk0NjE0NDc5OQ==&amp;mid=2247484532&amp;idx=1&amp;sn=148fdcd8397492c170e20ea8951e8f09&amp;chksm=c30bd704f47c5e12ea19508a92e9b2dd02277a3a93ca33582de8487b47001d8b83b76907c298&amp;scene=27#wechat_redirect</a></blockquote><div><p style="text-align:left;font-family:'PingFang SC';font-size:16px;"><span style="letter-spacing:1px;color:#333333;">长大的意义在于你可以试着理解原来不理解的事儿，尝试原谅你以前从不曾接受的人，在难过和委屈面前还依旧可以保持乐观的态度。</span></p>
