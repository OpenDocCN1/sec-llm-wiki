<h1>喜欢熬夜的原因</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=Mzk0NjE0NDc5OQ==&amp;mid=2247484529&amp;idx=1&amp;sn=161ba631b0ad1ca1c9adf523a853d402&amp;chksm=c30bd701f47c5e173b8b35628a6343d0836031b1ad36dc1f6625acb96202673c0a6371641a0e&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/s?__biz=Mzk0NjE0NDc5OQ==&amp;mid=2247484529&amp;idx=1&amp;sn=161ba631b0ad1ca1c9adf523a853d402&amp;chksm=c30bd701f47c5e173b8b35628a6343d0836031b1ad36dc1f6625acb96202673c0a6371641a0e&amp;scene=27#wechat_redirect</a></blockquote><div><p style="text-align:left;font-family:'PingFang SC';font-size:16px;"><span style="letter-spacing:1px;color:#333333;">"很喜欢一天结束后，安静躺在床上的那段时间。我可以偶尔软弱，可以不是盛开着的，可以悄悄再偷一会懒。黑夜真好，它善良的包容了我的所有。"</span></p>
