                var content = "今天不发安全资讯。\n年关将至，可能到了年底，开始第二年的安全防护预算，客户纷纷签单。\n就此聊两句。\n\n最近关注的安全厂家公众号，纷纷推送这家签约那家签约，都是涉及某些城市类，大基建类项目，甚至一些外围安全类公众号，以此为生专门收集相关信息整合推送。\n\n各位厂家你们能保证绝对安全吗？做这行都知道网络没有绝对安全，这些发出来的信息就是安全隐患，关注你们这些号能让对手知道我方很多单位网络安全细节，起码安全防具一目了然，做起事也可以针对型操作得心应手。\n\n在此建议国家有关方面把控下安全意识形态，重新梳理屏蔽一些已发布内容，涉及基建或城市型单位等相关安全签约信息，持谨慎态度，非必要不公开。&amp;amp;nbsp;"; // 只保留a标签
