<h1>【视点•趋势】数据中心应用虚拟化逐渐实现新突破</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000099&amp;itemidx=1&amp;sign=a40a3d23caeb9926a9cad42dedf21b9f&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000099&amp;itemidx=1&amp;sign=a40a3d23caeb9926a9cad42dedf21b9f&amp;scene=27#wechat_redirect</a></blockquote><p>因为大型机的计算能力特别强，因此采用可逻辑地划分成相互隔离的小型虚拟机的设计，然后凭借虚拟技术，即可在一个大型机上同时运行多个项目。随着时间的推移，大部分行业已经从大型机转向使用小型机及PC进行计算……</p><p><br/></p>
