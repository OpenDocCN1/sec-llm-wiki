<blockquote>原文：<a href="http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000068&amp;itemidx=1&amp;sign=dd2012c6ded0780d38b7ceba4aeb72e3&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000068&amp;itemidx=1&amp;sign=dd2012c6ded0780d38b7ceba4aeb72e3&amp;scene=27#wechat_redirect</a></blockquote><p>安全和隐私问题仍然是妨碍许多企业采用云服务最大的绊脚石，这甚至在过去的18个月，导致了了云加密系统的蓬勃兴起。虽然加密对于采用云服务的安全方面是相当重要的，但它不应该被看作是“护身符”，Gartner在最近的研究报告中强调……</p>
