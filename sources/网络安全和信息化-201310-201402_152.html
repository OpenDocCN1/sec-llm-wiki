<h1>芯片数据中心指日可待</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000054&amp;itemidx=1&amp;sign=ea70d351ea93c6516dcc83aa62337a2e&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000054&amp;itemidx=1&amp;sign=ea70d351ea93c6516dcc83aa62337a2e&amp;scene=27#wechat_redirect</a></blockquote><p>要扩大数据中心的规模同时降低其成本和能耗，大幅度提高这些数据中心的计算、存储和联网密度才是硬道理。为此，美国加州大学圣地亚哥分校雅各布工程学院的研究人员提出了一种全新的设计方案——“芯片上的机柜（racks-on-chip）”……</p>
