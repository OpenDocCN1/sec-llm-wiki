<h1>【趋势•视界】大数据应用催生首席数据官</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000050&amp;itemidx=1&amp;sign=47cccd81620c8d0422698cea2a02f49d&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000050&amp;itemidx=1&amp;sign=47cccd81620c8d0422698cea2a02f49d&amp;scene=27#wechat_redirect</a></blockquote><p>早在2003 年，美国Capital One 公司就任命了业内第一个首席数据官(CDO)。自那时起，CXO的行列里就多了一个CDO的成员。如今大数据应用盛行，更加剧了CDO职位的诞生。特别是美国政府部门，已率先认清这一形势……</p><p><br/></p>
