<h1>【话题热议】IT影响力正不断增强还是减弱？</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000038&amp;itemidx=2&amp;sign=4174c9d1c02cae52eb4f410bb5d7c12f&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000038&amp;itemidx=2&amp;sign=4174c9d1c02cae52eb4f410bb5d7c12f&amp;scene=27#wechat_redirect</a></blockquote><p>有人认为BYOD正在蓬勃发展是因为IT无法提供员工想要的体验，BYOD的成功表明IT的影响力正在减弱。而还有些人则持相反的意见，关键技术正在不断涌现，技术在业务成功中扮演的角色从未如此巨大，IT影响力正在扩大……</p>
