<h1>爱迪生的复仇：USB或将引发供电革命</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000020&amp;itemidx=1&amp;sign=74a4d49d74593b8b4770e379f7fe216d&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000020&amp;itemidx=1&amp;sign=74a4d49d74593b8b4770e379f7fe216d&amp;scene=27#wechat_redirect</a></blockquote><p>在交流电一统天下的今天，直流电却在悄悄酝酿着一场革命，而其中的关键则是早已司空见惯的USB技术。这不仅会给供电行业带来一场革命，还将更好地提升用电效率，甚至推动物联网的发展……</p>
