<h1>Oracle：Java在物联网时代拥有巨大潜力</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000010&amp;itemidx=3&amp;sign=ad658c921731641501e7096f67cbf137&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000010&amp;itemidx=3&amp;sign=ad658c921731641501e7096f67cbf137&amp;scene=27#wechat_redirect</a></blockquote><p>        甲骨文公司正大力将Java推向嵌入式系统，但目前不少人质疑Java是否有能力承担这一职。最近一段时间“物联网”概念的升温再次将它推向时代的风口浪尖，不过Java在嵌入式领域的实际表现到底怎么样？结论似乎褒贬不一。</p>
