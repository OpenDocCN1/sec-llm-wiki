<h1>移动安全部署增加 但BYOD政策依旧缺失</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000004&amp;itemidx=1&amp;sign=fff47b8faafce6122dbf8f93a4066fa2&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5MzMwMDU5NQ==&amp;appmsgid=10000004&amp;itemidx=1&amp;sign=fff47b8faafce6122dbf8f93a4066fa2&amp;scene=27#wechat_redirect</a></blockquote><p><span style="color: rgb(49, 49, 49); font-family: 宋体, Arial, sans-serif; font-size: 14px; line-height: 26px; text-indent: 28px;  background-color: rgb(255, 255, 255);">根据一项新的研究显示，对移动威胁和潜在数据泄露的担忧使企业越来越多地投资于移动安全</span><span style="color: rgb(49, 49, 49); font-family: 宋体, Arial, sans-serif; font-size: 14px; line-height: 26px; text-indent: 28px;  background-color: rgb(255, 255, 255);">技术，但他们通常缺乏有关个人设备的全面的战略和政策。</span></p>
