%; min-height: 1.5em; line-height: 2em;"><figure data-offset-key="eqkuc-0-0" data-editor="9t1g4" data-block="true"><section powered-by="xiumi.us"><p><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">如果你能躲开，你的人生将处处精彩；</span><span style="font-size: 15px;">如果你躲不开，你的人生将因此变得异常艰难！</span><span style="font-size: 15px;"> </span></p><p><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="4.7" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBFjGmEialnic68QxIyI8d7xTjEMmFnWPTNicv5rVkj0Cc1sMqM1xZ6cdPg/640?wx_fmt=png" data-type="png" data-w="750" src="../Images/7aebd21b1ab53085690823c4482053c1.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBFjGmEialnic68QxIyI8d7xTjEMmFnWPTNicv5rVkj0Cc1sMqM1xZ6cdPg/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="7.044" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUB8nfWGgPGTP7QTxhbUb7lWDPxqcP94Uib6QPLiay4FnfQ4vwuBEsj8QUw/640?wx_fmt=png" data-type="png" data-w="750" src="../Images/16b9b85a1204d7fa4f864e9dd6695ea5.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUB8nfWGgPGTP7QTxhbUb7lWDPxqcP94Uib6QPLiay4FnfQ4vwuBEsj8QUw/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="4.982666666666667" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBJ5mA4RNMaMFXHY0l2WFoG5ll3R2iaSiafp4FYhgTOwyABC0D1UpUZwzA/640?wx_fmt=png" data-type="png" data-w="750" src="../Images/55cd2878a916f0f0c51162515a115a55.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBJ5mA4RNMaMFXHY0l2WFoG5ll3R2iaSiafp4FYhgTOwyABC0D1UpUZwzA/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="5.172" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBNnj1fnrKyPxLvwdKtKTqbrX81bLHeiavnmiaF1FMncVPjd1YmcPqdXDg/640?wx_fmt=png" data-type="png" data-w="750" src="../Images/643611f30b459aa544897f1293fe87d0.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBNnj1fnrKyPxLvwdKtKTqbrX81bLHeiavnmiaF1FMncVPjd1YmcPqdXDg/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="3.908" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUB410IrreD4QiatX6OTibRt9LSOH4PkIfgtFAznibUZ2306wST1UmxSz6OA/640?wx_fmt=png" data-type="png" data-w="750" src="../Images/e6445a4dfa05e818d302453e72b91321.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUB410IrreD4QiatX6OTibRt9LSOH4PkIfgtFAznibUZ2306wST1UmxSz6OA/640?wx_fmt=png"/></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">观其主角的一生，是不是觉得都是被骗的一生。</span><span style="font-size: 15px;">现实生活中是否真的有这种一生被骗的例子呢？</span><span style="font-size: 15px;">我不知道。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">但是换做你是其中的主角，你也会这样选择吗？</span><span style="font-size: 15px;">也会和他有同样的选择吗？</span><span style="font-size: 15px;">若是给你重新来过的机会，你会不会还坚持自己的选择呢？</span><span style="font-size: 15px;">其实换一种选择，人生可能就会从此不一样。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="3.9192660550458718" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBZoNFKXnbbcN79sBRqt4qyibeiapN402XMVIOLldWMsQD6PPF5t7auOUw/640?wx_fmt=png" data-type="png" data-w="545" src="../Images/2b1d423fcf287f86957ad53309a2a729.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBZoNFKXnbbcN79sBRqt4qyibeiapN402XMVIOLldWMsQD6PPF5t7auOUw/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="3.75219683655536" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBDficuUhvyL4FUGlb9kkkXWm7yETwXMpXpK3ZzViaLibOCiadKnldLpS2CA/640?wx_fmt=png" data-type="png" data-w="569" src="../Images/265293602bf7716cf38199421a85d367.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBDficuUhvyL4FUGlb9kkkXWm7yETwXMpXpK3ZzViaLibOCiadKnldLpS2CA/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="3.8465703971119134" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBicvKiauCp8tyhC3kCfGdLkNZItYuEtRCrAdmUoA7q0CqVV0iaicWkASH0g/640?wx_fmt=png" data-type="png" data-w="554" src="../Images/3320716301434853cfb73d11e77c668d.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBicvKiauCp8tyhC3kCfGdLkNZItYuEtRCrAdmUoA7q0CqVV0iaicWkASH0g/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="3.6264855687606112" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUB6OzpqZoleDKb0ib66HUcLBp78icAIjFVG8eTmgsRyQnvSoiaT0nOJWDNQ/640?wx_fmt=png" data-type="png" data-w="589" src="../Images/bedd334502cb8387f4f3af0556bdf62f.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUB6OzpqZoleDKb0ib66HUcLBp78icAIjFVG8eTmgsRyQnvSoiaT0nOJWDNQ/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="3.3333333333333335" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBbafTBN5OGnyicQ1qY2ex0nEO9xMAg4Dc434nAteYZ7PpDYtictdqTLmg/640?wx_fmt=png" data-type="png" data-w="750" src="../Images/49cd3846b41b782ddbf711bad9f07755.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9Bx42pjSvPInDCxyO4NS1rUBbafTBN5OGnyicQ1qY2ex0nEO9xMAg4Dc434nAteYZ7PpDYtictdqTLmg/640?wx_fmt=png"/></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">人生何处无骗局，游戏皮肤骗局、校园贷骗局、杀猪盘骗局、庞氏骗局、以房养老骗局，这仅是我们截取的一些典型骗局类型，还有原始股骗局、资金盘骗局、网购赔付骗局……</span></p><p><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">高收益、暴富美梦等等都是诱惑你的糖衣炮弹，抵制住了这些糖衣炮弹的攻击，你就能远离骗局的伤害，所以重要的是看你如何选择。</span></p><p><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">选择不同，最后得到的结局也会不同。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">在遇到骗局的诱惑时，你，会如何选择呢？</span></p><p><br/></p><section style="margin-left: 16px;margin-right: 16px;line-height: normal;"><span style="color: rgb(136, 136, 136);"><strong><span style="font-size: 12px;">文案：</span></strong></span><span style="color: rgb(136, 136, 136);"><strong><span style="color: rgb(136, 136, 136);font-size: 12px;">耳东</span></strong></span></section><section style="margin-left: 16px;margin-right: 16px;line-height: normal;"><span style="color: rgb(136, 136, 136);"><strong><span style="color: rgb(136, 136, 136);font-size: 12px;">绘图：</span></strong></span><span style="color: rgb(136, 136, 136);"><strong><span style="color: rgb(136, 136, 136);font-size: 12px;">青猫一千年</span></strong></span></section><p style="margin-right: 16px;margin-left: 16px;max-width: 100%;min-height: 1em;font-family: -apple-system-font, system-ui, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;letter-spacing: 0.544px;white-space: normal;line-height: 1.75em;box-sizing: border-box !important;overflow-wrap: break-word !important;"
