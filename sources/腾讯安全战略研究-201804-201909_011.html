<h1>上交易所，有K线图？炒鞋是一场庄家割韭菜的游戏</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MjM5MTA0NjU3Ng==&amp;mid=2652705074&amp;idx=1&amp;sn=8ccde2ffad5ef6f8ef0d7cd6e919583a&amp;chksm=bd523fed8a25b6fb0a8b627f8a4c682c6230ecb20dd7389ca04236043954ef628fe492b75d8e&amp;scene=126&amp;sessionid=1681323443#rd">http://mp.weixin.qq.com/s?__biz=MjM5MTA0NjU3Ng==&amp;mid=2652705074&amp;idx=1&amp;sn=8ccde2ffad5ef6f8ef0d7cd6e919583a&amp;chksm=bd523fed8a25b6fb0a8b627f8a4c682c6230ecb20dd7389ca04236043954ef628fe492b75d8e&amp;scene=126&amp;sessionid=1681323443#rd</a></blockquote><section class="xmyeditor style_1 style_2" data-id="6542" data-md5="a3dbc"><section label="Powered by xmyeditor.com" powered-by="xmyeditor.com" data-md5="a3dbc" class="style_2 style_3"><section powered-by="xmyeditor.com" data-md5="a3dbc"><section data-md5="a3dbc"><section powered-by="xmyeditor.com" data-md5="a3dbc"><section data-role="outer" label="Powered by 135editor.com"><section powered-by="xiumi.us"><section><section><section powered-by="xiumi.us"><section><section><section powered-by="xiumi.us"><section><section><section powered-by="xiumi.us"><section data-role="paragraph" data-i="15604841492095" data-color="#1e9be8" data-custom="#1e9be8"><section data-style="margin-top: 2px; margin-bottom: 0px; max-width: 100%; min-height: 1.5em; line-height: 2em;" mpa-from-tpl="t"><figure data-block="true" data-editor="9t1g4" data-offset-key="eqkuc-0-0"><section powered-by="xiumi.us"><section style="line-height: 1.75em;margin-left: 0px;margin-right: 0px;"><img data-ratio="0.3275488069414317" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/8Lg2vwlPTaSHwZHuM9L2P1YsEmVNMB1pXwMfibozYDMCJiaMiaJNWWfD8b7qKYkLj4RchvbKMiaMgacxIO9FLHj7Qg/640?wx_fmt=png" data-type="png" data-w="922" src="../Images/df67b5b15506eaf3fca51050167a5be2.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/8Lg2vwlPTaSHwZHuM9L2P1YsEmVNMB1pXwMfibozYDMCJiaMiaJNWWfD8b7qKYkLj4RchvbKMiaMgacxIO9FLHj7Qg/640?wx_fmt=png"/></section><p><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><span style="font-size: 12px;color: rgb(136, 136, 136);"><strong>本文转载自菲凡烽火台（feifanfenghuotai）</strong></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><span style="font-size: 12px;color: rgb(136, 136, 136);"><strong>文字 | 耳东</strong></span></p><p><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">最近网上流传着一个段子：</span><span style="font-size: 15px;">一个刚毕业的小明，每月拿着8000块的工资，家里资助了100万买房，但是他并没有买房，而是将所有的钱买了自己心爱的限量版球鞋，家里人知道后，气得直说他玩物丧志，败家子。</span></p><p><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="0.3249097472924188" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HReFSzJNDEGWP0bQOEFz08rdjvEP9CTMfwDR1ghQSafJjyvEZHjYMIA/640?wx_fmt=png" data-type="png" data-w="554" src="../Images/df32a45b546469bb268a888693b8501b.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HReFSzJNDEGWP0bQOEFz08rdjvEP9CTMfwDR1ghQSafJjyvEZHjYMIA/640?wx_fmt=png"/></p><p><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">三个月过去了，小明把当初买的球鞋全部转手卖出，最后在北京全款买了房子，从此走上了人生巅峰。</span></p><p><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">看到这里，各位看官内心是不是无比地激动，是不是很想这种年化收益1200%的暴富机会砸到自己的头上？</span><span style="font-size: 15px;">那就耐心往下看，了解这个所谓的“炒鞋”究竟是何等的暴富风口。</span></p><p><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="0.6534296028880866" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HZGe5EVPZ3NDKYqFFqJan3NsahnM2fu6IuKZhibYNNAJicy46x5iakaamQ/640?wx_fmt=png" data-type="png" data-w="554" src="../Images/50d6a564f0c948324b292761b49e48ce.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HZGe5EVPZ3NDKYqFFqJan3NsahnM2fu6IuKZhibYNNAJicy46x5iakaamQ/640?wx_fmt=png"/></p><p><br/></p><section class="xmt-style-block" data-style-type="5" data-tools="新媒体排版" data-id="2192590"><p style="margin: 5px auto;width: 4em;" class=""><img class="__bg_gif" data-ratio="0.9191011235955057" data-src="https://mmbiz.qpic.cn/mmbiz_gif/8Lg2vwlPTaTCCHRwekmbMSQ9jhaibCw8CNVM4ltZ23o3mHonO07k6OoibKIoJoWicZrI67aeic5T1Uak2voLapxx7w/640?wx_fmt=gif" data-type="gif" data-w="445" style="width: 100% !important;height: auto !important;visibility: visible !important;" src="../Images/7cfdc4d08a22ab1a5266b35f0987984f.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_gif/8Lg2vwlPTaTCCHRwekmbMSQ9jhaibCw8CNVM4ltZ23o3mHonO07k6OoibKIoJoWicZrI67aeic5T1Uak2voLapxx7w/640?wx_fmt=gif"/><br/></p></section><section><section data-id="87856" data-color="#1e9be8" data-custom="#1e9be8"><section data-id="87843" data-color="#212122" data-custom="#212122"><section><section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><span style="color: rgb(0, 82, 255);font-size: 17px;"><strong>新的暴富风口：</strong></span><span style="color: rgb(0, 82, 255);font-size: 17px;"><strong>炒鞋</strong></span></p></section></section></section></section></section><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">还在想炒股？</span><span style="font-size: 15px;">炒房？</span><span style="font-size: 15px;">炒币？</span><span style="font-size: 15px;">那你就Out 了。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">“</span><span style="font-size: 15px;color: rgb(0, 82, 255);"><strong>70后炒房，80后炒股，90后炒币，00后炒</strong></span><span style="font-size: 15px;color: rgb(0, 82, 255);"><strong>鞋</strong></span><span style="font-size: 15px;">”成为了资本风口圈的新标语。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-family: mp-quote, -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-family: mp-quote, -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;">其实炒鞋说白了就是利用市场的供求稀缺性，供不应求，鞋子的发售量越少，价格就会越高，遭到了球鞋爱好者的追捧，自然价格就会飙升。</span><span style="font-family: mp-quote, -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;">而其中造成炒鞋市场火热、价格居高不下的是纯粹的炒鞋投机者。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">其实“炒鞋”文化由来已久，源自于SNEAKER 文化，已经有上百年的历史，而篮球运动的兴起和NBA的火爆更是将SNEAKER 文化推向了一个新的顶峰。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">“炒鞋”之前一直都是圈里的人在玩，一般是以贩养穿，但是随着《中国新说唱》、《这就是街舞》等嘻哈综艺节目的播出，更是在国内掀起了一股嘻哈打扮热潮，“炒鞋”就破了圈，在日常生活中我们多多少少都有听说过AJ、椰子鞋、OG等词语这些鞋圈词汇，现在的年轻人也都以脚踩AJ、Yeezy等球鞋而觉得“有面子”。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="0.5776173285198556" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HXdBLcxiclWlzgPBia6ZCr1R8FazAYzkE6HmrbHyF3ytQkBDSTRPtcDiag/640?wx_fmt=png" data-type="png" data-w="554" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/2583e6dcf70b78bfd461dbd989cb5d79.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HXdBLcxiclWlzgPBia6ZCr1R8FazAYzkE6HmrbHyF3ytQkBDSTRPtcDiag/640?wx_fmt=png"/></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"> “炒鞋” 究竟是为什么会变得这么火热？</span><span style="font-size: 15px;">其实可以总结成3个词：</span><span style="color: rgb(0, 82, 255);"><strong><span style="font-size: 15px;">限量版、明星效应和投机</span></strong></span><span style="font-size: 15px;">。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">“限量版”，看到这个词就说明球鞋的稀缺性，adidas、Nike、Air Jordan等球鞋品牌商大打“饥饿营销”的策略，一些系列的球鞋限量发售，不仅线上的官网需要抽签获得购买资格，而且线下的实体店也都是大排长龙的疯抢景象。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">“供不应求”使得人们都趋之若鹜，更是催生了“炒鞋党”专职进行抢鞋，再转手高价卖出。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="1.0568720379146919" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HQ6Scp5ksS2F7gGbvT3WSUvYnljD48vZ2YsYSolMvdXQzrjjibicm3OVw/640?wx_fmt=png" data-type="png" data-w="422" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/38b881046ef91527e6980f193d8bbe06.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HQ6Scp5ksS2F7gGbvT3WSUvYnljD48vZ2YsYSolMvdXQzrjjibicm3OVw/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="0.49015748031496065" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0Hibs16PFzzrtriaqx8bqTXwavc7UKyva9AVkylr3a1cMCZDcXbE0XZbOw/640?wx_fmt=png" data-type="png" data-w="508" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/4ee98b7b1cb3e0624caef7c0846c8834.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0Hibs16PFzzrtriaqx8bqTXwavc7UKyva9AVkylr3a1cMCZDcXbE0XZbOw/640?wx_fmt=png"/></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">除了限制球鞋发售数量之外，球鞋品牌商还抓住消费者“虚荣”的心理，发售全球特制、或者球星联名等限量版球鞋。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">目前，全世界最贵的鞋是Air Yeezy2(Red October)，以 1700 万美元的价格在网上成交，折合人民币上亿元。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"/><span style="font-size: 15px;">上亿元买一双球鞋？</span><span style="font-size: 15px;">原谅我不懂有钱人的世界。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.5552486187845304" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HdA3S4RARqh8N2lnSpfjMVEuMNXiaZVf0rsKqZyIXtlAFAH3XBeI6eyQ/640?wx_fmt=png" data-type="png" data-w="362" src="../Images/694dcff6eb930b58df313d2477cf51fb.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HdA3S4RARqh8N2lnSpfjMVEuMNXiaZVf0rsKqZyIXtlAFAH3XBeI6eyQ/640?wx_fmt=png"/></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="color: rgb(0, 82, 255);"><strong><span style="font-size: 15px;">“明星效应”，其实就是一种隐形的广告效应。</span></strong></span><span style="font-size: 15px;">1985年芝加哥公牛队新秀, 迈克尔-乔丹, 就与耐克公司签署了的合同，耐克随即发表第一款合作款Air Jordan。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">球鞋商和NBA球星签署联名款的球鞋是常态，更是一种广告代言，现在市面的科比战靴、詹姆斯战靴、库里兄弟战靴等，都是大卖的系列，球鞋商利用NBA球星的强大号召力，实现了完美的球鞋带货计划，可谓是佩服得五体投地啊。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.656319290465632" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0Hzy9pUWmzHCThibIVnicg7rhTYToQkIXMCtGBGDMiaibw0ycmdoQLwB55eQ/640?wx_fmt=png" data-type="png" data-w="451" src="../Images/36282541a337bc1a68a9a549c1ee19cd.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0Hzy9pUWmzHCThibIVnicg7rhTYToQkIXMCtGBGDMiaibw0ycmdoQLwB55eQ/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"> </span><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">另外在国内外的娱乐圈也不乏球鞋爱好收藏者，最著名的当属美国著名说唱歌手侃爷（Kanye West），开创了一个Yeezy 帝国。</span><span style="font-size: 15px;">另外还有罗志祥、萧敬腾、周杰伦、白敬亭等等球鞋控明星。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">他们脚上穿的鞋、身上穿的衣服、帽子、配饰等等都能登上时尚版面，带货能力妥妥的，“明星同款”也就成为了销量火爆的加持。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.640495867768595" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HTk2yKDcKicacq2Z9sVGX3lMPTdQkAU9uHWtc14h3IONJmBmaAv2LFsA/640?wx_fmt=png" data-type="png" data-w="484" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/00939dbf597e9d92314eb18f1cdf4e2a.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HTk2yKDcKicacq2Z9sVGX3lMPTdQkAU9uHWtc14h3IONJmBmaAv2LFsA/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.8297101449275363" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HdVng8rkYYTsib1x4KDlZNqG7AuXoPHCicvoVo8ibN1pAqPD5ibDn2Ziapmw/640?wx_fmt=png" data-type="png" data-w="552" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/853c8147e373642750584581ee7a5425.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HdVng8rkYYTsib1x4KDlZNqG7AuXoPHCicvoVo8ibN1pAqPD5ibDn2Ziapmw/640?wx_fmt=png"/></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="color: rgb(0, 82, 255);"><strong><span style="font-size: 15px;">“投机”，就是鞋子的本质属性已经发生了改变，不再是单纯的商品，而被炒作成为了一种“金融产品”。</span></strong></span><span style="font-size: 15px;"/></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">本来在SNEAKER圈内，大家都是以自身爱好球鞋为由，以贩养穿，而且是出于喜爱的理由，收集各种球鞋，成为一名单纯的sneaker head。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">但是随着破圈，球鞋的投机行为越来越多，掀起了全民炒鞋的浪潮，有很多年轻的00后也都当起了球鞋的二道贩子，这就让球鞋脱离了其本质，逐渐成为了一种炒作的工具。</span><span style="font-size: 15px;">例如猛龙当家球星莱纳德的签名鞋从几千块的价格炒作飙升了10万。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="1.2289156626506024" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0H2pG76ekTYbwI5h6v08uh8RdZtrvqV7sUG9e1icIzyqibx6rgBqgptzXg/640?wx_fmt=png" data-type="png" data-w="332" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/e29868bccaed1436e7a921bf20c37ece.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0H2pG76ekTYbwI5h6v08uh8RdZtrvqV7sUG9e1icIzyqibx6rgBqgptzXg/640?wx_fmt=png"/></p><p><br/></p><section><section data-id="87856" data-color="#1e9be8" data-custom="#1e9be8"><section data-id="87843" data-color="#212122" data-custom="#212122"><section><section><section class="xmt-style-block" data-style-type="5" data-tools="新媒体排版" data-id="2192590"><p style="margin: 5px auto;width: 4em;" class=""><img class="__bg_gif" data-ratio="0.9191011235955057" data-src="https://mmbiz.qpic.cn/mmbiz_gif/8Lg2vwlPTaTCCHRwekmbMSQ9jhaibCw8CNVM4ltZ23o3mHonO07k6OoibKIoJoWicZrI67aeic5T1Uak2voLapxx7w/640?wx_fmt=gif" data-type="gif" data-w="445" style="width: 100% !important;height: auto !important;visibility: visible !important;" src="../Images/7cfdc4d08a22ab1a5266b35f0987984f.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_gif/8Lg2vwlPTaTCCHRwekmbMSQ9jhaibCw8CNVM4ltZ23o3mHonO07k6OoibKIoJoWicZrI67aeic5T1Uak2voLapxx7w/640?wx_fmt=gif"/><br/></p></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><span style="color: rgb(0, 82, 255);font-size: 17px;"><strong>上交易所，有K线图？</strong></span><span style="font-size: 15px;"/><br/></p></section></section></section></section></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"> </span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">“炒鞋月入百万”，已经成为了炒鞋圈人人都想要到达的高度，每个人都想通过“炒鞋”来发家致富。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"/><span style="font-size: 15px;">“ 10 年前你错过炒房，5 年前你错过炒比特币，现在难道你还要错过炒鞋吗?”成为了炒鞋党们追风口的“正当理由”。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">炒鞋的热情空前高涨，催生了多家球鞋交易所。</span><span style="font-size: 15px;color: rgb(0, 82, 255);"><strong>这些交易所启动球鞋电子化交易，整个版面有分时图、挂单买卖K线图、涨跌幅数据等，简直可以堪称为一个专业的金融投机平台。</strong></span><span style="font-size: 15px;"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"> </span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="1.6521739130434783" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0H2oGNkpvqKbVyYbj4YIicH85UbXR6UEtv5UQzI4eq5iaOTyibjcvaEHycA/640?wx_fmt=png" data-type="png" data-w="253" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/630f163444be5f01ba08b9f4e11a96ff.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0H2oGNkpvqKbVyYbj4YIicH85UbXR6UEtv5UQzI4eq5iaOTyibjcvaEHycA/640?wx_fmt=png"/></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">另外根据球鞋市场上的品牌占有率，进而还衍生出了球鞋类的三个大盘指数：</span><span style="color: rgb(0, 82, 255);"><strong><span style="font-size: 15px;">Jordan指数、Nike指数、Adidas指数</span></strong></span><span style="font-size: 15px;">。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">专业程度堪比道琼斯指数、上证指数、恒生指数。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="0.4566787003610108" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HUvJYYEIIicSicviao8M6JRoDBB1x5KaicIuv4W2jwh3sjK2ZGF7VMWAic4g/640?wx_fmt=png" data-type="png" data-w="554" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/e47b910bd40a65e6bc02d19871424e8c.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HUvJYYEIIicSicviao8M6JRoDBB1x5KaicIuv4W2jwh3sjK2ZGF7VMWAic4g/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"> </span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="color: rgb(0, 82, 255);"><strong><span style="font-size: 15px;">炒鞋市场还分为一级市场和二级市场，有三大参与对象：</span></strong><strong><span style="font-size: 15px;">球鞋商、球鞋爱好者，以及炒鞋党和多家球鞋交易所，他们的投资标的就是球鞋。</span></strong></span><span style="font-size: 15px;"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"/><span style="font-size: 15px;">具体的运作方式是：</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">1. </span><span style="font-size: 15px;color: rgb(0, 82, 255);"><strong>球鞋商通过抽签、限购等饥饿营销的方式发售品牌球鞋</strong></span><span style="font-size: 15px;">，这个时候球鞋进入了一级市场，球鞋爱好者，炒鞋党线上忙着抽签、线下忙着排队抢购球鞋；</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">2. </span><span style="font-size: 15px;color: rgb(0, 82, 255);"><strong>球鞋爱好者，炒鞋党抢购到球鞋后会进入二级市场，这里就是疯狂投机的温床</strong></span><span style="font-size: 15px;">，球鞋爱好者，炒鞋党通过价高者得的方式转手自己手中的球鞋，还有的人为了让鞋子转手地更快，将球鞋寄存在炒鞋交易所，有兴趣的人通过交易所报价，不断换手，最终花落高价者，交易所再将球鞋寄出，这就加快了换手率，节省了球鞋寄来寄去的成本。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">看到这个炒鞋的具体运作方式，</span><span style="font-size: 15px;color: rgb(0, 82, 255);"><strong>鞋子这种普普通通穿在脚上的商品，如今变成了一种高不可攀的“金融产品”</strong></span><span style="font-size: 15px;">，我不得不对炒鞋党打Call：炒鞋，你们真的好专业！</span></p><section><br/></section><section><br/></section><section class="xmt-style-block" data-style-type="5" data-tools="新媒体排版" data-id="2192590"><p style="margin: 5px auto;width: 4em;" class=""><img class="__bg_gif" data-ratio="0.9191011235955057" data-src="https://mmbiz.qpic.cn/mmbiz_gif/8Lg2vwlPTaTCCHRwekmbMSQ9jhaibCw8CNVM4ltZ23o3mHonO07k6OoibKIoJoWicZrI67aeic5T1Uak2voLapxx7w/640?wx_fmt=gif" data-type="gif" data-w="445" style="width: 100% !important;height: auto !important;visibility: visible !important;" src="../Images/7cfdc4d08a22ab1a5266b35f0987984f.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_gif/8Lg2vwlPTaTCCHRwekmbMSQ9jhaibCw8CNVM4ltZ23o3mHonO07k6OoibKIoJoWicZrI67aeic5T1Uak2voLapxx7w/640?wx_fmt=gif"/><br/></p></section><section><section data-id="87856" data-color="#1e9be8" data-custom="#1e9be8"><section data-id="87843" data-color="#212122" data-custom="#212122"><section><section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><span style="color: rgb(0, 82, 255);font-size: 17px;"><strong>全都是泡沫</strong></span><span style="font-size: 15px;"/></p></section></section></section></section></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"> </span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">文章看到这里，是不是不想错过这个暴富的大好机会，已经按捺不住内心蠢蠢欲动的“小野兽”了，想立刻关掉文章，退出微信，立刻下载各种炒鞋交易所软件来投机一把？</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"/><span style="font-size: 15px;">想到未来高涨的行情，可观的收益，内心还忍不住有点小激动呢！</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">我不得不摆出“尔康手”，大喊一句：</span><span style="color: rgb(0, 82, 255);font-size: 17px;"><strong>且慢！</strong><strong>！</strong><strong>！</strong></span><span style="font-size: 15px;"/></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">其实这种类似的</span><span style="font-size: 15px;color: rgb(0, 82, 255);"><strong>商品经过投机成为一种“金融产品”的案例屡见不鲜</strong></span><span style="font-size: 15px;">，最著名的是17世纪荷兰的</span><span style="font-size: 15px;color: rgb(0, 82, 255);"><strong>郁金香泡沫事件</strong></span><span style="font-size: 15px;">。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">1630 年前后，荷兰人培育出了一些新奇的郁金香品种，其颜色和花型都深受人们的欢迎，迅速成为了欧洲上层社会地位和身份的象征，王室贵族和达官贵人都纷纷趋之若鹜，供不应求导致了郁金香价格暴涨，攀升了几十上百倍，但是一个冬天过后郁金香泡沫崩溃了，郁金香市场一片混乱，价格急剧下降，囤积了大量的郁金香商人血本无归。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">在我们国内也有类似的泡沫事件，1984年君子兰被命名为长春市的市花，长春市政府提出了“</span><span style="font-size: 15px;color: rgb(0, 82, 255);"><strong>窗台经济</strong></span><span style="font-size: 15px;">”，号召市民每家每户都种植君子兰，但是长春市民都自已家里窗台上有君子兰为荣，之后君子兰炒作成风，一些珍品君子兰在但是甚至炒作到了将近10万元，君子兰一度被称为“绿色金条”，随后君子兰泡沫破裂，重新回归到其观赏盆景的本质。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">这种疯狂的投机案例还有：</span><span style="color: rgb(0, 82, 255);"><strong><span style="font-size: 15px;">炒藏獒、炒兰花、炒红木、炒普洱茶……</span></strong></span><span style="font-size: 15px;"/></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">说到底这种商品投机行为，</span><span style="font-size: 15px;color: rgb(0, 82, 255);"><strong>是一种“庄家坐庄”的炒作“稀缺性”行为，本身就是一场“击鼓传花”寻找接盘侠的游戏</strong></span><span style="font-size: 15px;">。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">在“炒鞋”市场中，炒鞋党声势浩大地宣传：</span><span style="font-size: 15px;">这双鞋多么难买，那双鞋多么难得、这双是签名款、那双是限量版，吸引了其他炒鞋党的注意，然后通过炒鞋交易所，几经转手，将炒成“天价”的球鞋转给了其他接盘的人，坐庄的人赚得盆满钵满。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">但是随着球鞋市场回归本质，价格回落，无人再接盘，那么最后接盘的人就只能被套牢，花高价买的球鞋就成了烫手山芋。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">“房住不炒”、“鞋穿不炒”是真理，在这种脱离的商品本质的投机游戏中，小心成为炮灰。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">但总会有人止不住为了金钱而冲锋陷阵，总觉得自己在这场游戏中会比任何人都跑得快。</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">如果你是“明学”的资深学员，怼我一句：</span><span style="font-size: 15px;">我不要你觉得，我要我觉得。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"/><span style="font-size: 15px;">“只要站在风口上，猪也能飞起来”，那就祝愿你钱程似锦，但也别忘了“风口过后，摔死的都是猪”！</span></p><section><br/></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.7777777777777778" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HWiclEBFJgjgVqCHE6lJeyhLSzm9x7cTXibgjlfOPatzwicLxicFYmFbOSA/640?wx_fmt=png" data-type="png" data-w="387" src="../Images/d46d8bcda84aeec57ca6cd59313e032f.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BzIKhF2QZe4ahHo7cxuVy0HWiclEBFJgjgVqCHE6lJeyhLSzm9x7cTXibgjlfOPatzwicLxicFYmFbOSA/640?wx_fmt=png"/></p><section data-role="outer" label="Powered by 135editor.com" style="max-width: 100%;box-sizing: border-box !important;overflow-wrap: break-word !important;"><section class="" style="max-width: 100%;box-sizing: border-box !important;overflow-wrap: break-word !important;"><p style="margin-right: 16px;margin-left: 16px;max-width: 100%;min-height: 1em;line-height: 1.75em;box-sizing: border-box !important;overflow-wrap: break-word !important;"><br/></p><section class="" data-style-type="5" data-tools="新媒体排版" data-id="2207325" style="max-width: 100%;lette
