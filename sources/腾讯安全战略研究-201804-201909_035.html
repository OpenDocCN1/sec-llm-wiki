 mpa-from-tpl="t"><figure data-block="true" data-editor="9t1g4" data-offset-key="eqkuc-0-0"><section data-style-type="5" data-id="2192590"><section data-role="outer" label="Powered by 135editor.com"><section data-role="outer" label="Powered by 135editor.com"><section data-role="paragraph"><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;">前段时间，有人问：</span><span style="font-size: 15px;">最近很火的循环信用卡是什么鬼？</span><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"> </span><br/><span style="font-size: 15px;">循环信用卡：每月可套取3.5万还款100，一年套现42万，免费率、不限量、无逾期、免息使用、循环使用……</span><br/><span style="font-size: 15px;"> </span><br/><span style="font-size: 15px;">有这等好事？会不会是骗子？</span><br/><span style="font-size: 15px;"> </span><br/><span style="font-size: 15px;">然后填写个人资料：身份证、手机号、家庭住址、身份证正反照、手持身份证个人照……</span><br/><span style="font-size: 15px;"> </span><br/><span style="font-size: 15px;">多地警方提醒：</span><span style="color: rgb(75, 99, 223);"><strong><span style="font-size: 15px;">办理循环信用卡是诈骗，谨防个人信息泄露！</span></strong></span><span style="font-size: 15px;"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 15px;"><br/>为此，我们曾经写过一篇文章</span><a href="http://mp.weixin.qq.com/s?__biz=MjM5MTA0NjU3Ng==&amp;mid=2652704782&amp;idx=1&amp;sn=dbba302b5a6afc1b5fb0a221df3af9e6&amp;chksm=bd523ed18a25b7c72c15bebe3c66f8557ea0b585c5e0fc21c2e593eb81af73c00cdbebe707a5&amp;scene=21#wechat_redirect" target="_blank" data-itemshowtype="11" data-linktype="2"><span style="font-size: 15px;">《国家给网络难民发了420亿扶贫金？</span><span style="font-size: 15px;"/><span style="font-size: 15px;">多地网警揭“循环信用卡”骗局》</span></a><span style="font-size: 15px;">。</span><br/><span style="font-size: 15px;"> </span><br/><span style="font-size: 15px;">对于咨询的人，我们也积极回答，甚至告诉他们个人信息泄露可能带来的一些麻烦。</span><s
