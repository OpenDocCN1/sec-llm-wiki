<h1>杀猪盘二次骗局出现，别相信那些“热心的陌生人”</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MjM5MTA0NjU3Ng==&amp;mid=2652706423&amp;idx=1&amp;sn=87d30972828fed1159dea66454eb73f0&amp;chksm=bd5238a88a25b1be94d380287c92261f041c9c18c28a0b094005eac74a41256f6e996e19600b&amp;scene=126&amp;sessionid=1681323406#rd">http://mp.weixin.qq.com/s?__biz=MjM5MTA0NjU3Ng==&amp;mid=2652706423&amp;idx=1&amp;sn=87d30972828fed1159dea66454eb73f0&amp;chksm=bd5238a88a25b1be94d380287c92261f041c9c18c28a0b094005eac74a41256f6e996e19600b&amp;scene=126&amp;sessionid=1681323406#rd</a></blockquote><p style="text-align: center;"><img class="rich_pages" data-ratio="0.3275488069414317" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/8Lg2vwlPTaSHwZHuM9L2P1YsEmVNMB1pXwMfibozYDMCJiaMiaJNWWfD8b7qKYkLj4RchvbKMiaMgacxIO9FLHj7Qg/640?wx_fmt=png" data-type="png" data-w="922" style="" src="../Images/df67b5b15506eaf3fca51050167a5be2.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/8Lg2vwlPTaSHwZHuM9L2P1YsEmVNMB1pXwMfibozYDMCJiaMiaJNWWfD8b7qKYkLj4RchvbKMiaMgacxIO9FLHj7Qg/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><br/></p><section style="margin-left: 16px;margin-right: 16px;text-align: center;line-height: normal;"><span style="color: rgb(136, 136, 136);"><strong><span style="font-size: 14px;">本文转载自菲凡烽火台（ID：feifanfenghuotai）</span></strong></span></section><section style="margin-left: 16px;margin-right: 16px;text-align: center;line-height: normal;"><span style="color: rgb(136, 136, 136);"><strong><span style="font-size: 14px;">文 | 尼莫</span></strong></span></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><section data-id="6542" data-md5="a3dbc"><section data-md5="a3dbc" label="Powered by xmyeditor.com" powered-by="xmyeditor.com"><section data-md5="a3dbc" powered-by="xmyeditor.com"><section data-md5="a3dbc"><section data-md5="a3dbc" powered-by="xmyeditor.com"><section label="Powered by 135editor.com" data-role="outer"><section powered-by="xiumi.us"><section><section><section powered-by="xiumi.us"><section><section><section powered-by="xiumi.us"><section><section><section powered-by="xiumi.us"><section data-role="paragraph" data-i="15604841492095" data-custom="#1e9be8" data-color="#1e9be8"><section data-style="margin-top: 2px; margin-bottom: 0px; max-width: 100%; min-height: 1.5em; line-height: 2em;" mpa-from-tpl="t"><figure data-block="true" data-editor="9t1g4" data-offset-key="eqkuc-0-0"><section powered-by="xiumi.us"><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">去年爆火的骗局盘中，杀猪盘说第二，没有其他的敢说第一，遇到这个盘的人，荷包不死也会被剥层皮，人均受骗30万。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">今年春节至今，小菲已经接触到了差不多50个杀猪盘的受害者，有个受害者告诉小菲，她自己是春节的时候，因为疫情原因得呆家里，实在无聊便下载交友软件，才让骗子有机可乘。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.8597785977859779" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPzJxoykWiaYaZMQnyF5eWVYLENwRRmsZyqBd78Z2p8fM1D5xU6xYibIiaQ/640?wx_fmt=png" data-w="542" data-type="png" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/82c07b3f67bfa802f0ff6cf0f47d8224.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPzJxoykWiaYaZMQnyF5eWVYLENwRRmsZyqBd78Z2p8fM1D5xU6xYibIiaQ/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><section data-tools="新媒体排版" data-id="2983874" data-style-type="undefined"><section data-tools="新媒体排版" data-id="11833" data-style-type="标题" style="max-width: 100%;"><section style="border-width: 0px;border-style: none;border-color: initial;padding: 0px;max-width: 100%;"><section style="box-sizing: border-box;max-width: 100%;" powered-by=".us"><section style="text-align: center;margin-top: 10px;margin-bottom: 10px;box-sizing: border-box;max-width: 100%;"><section style="display: inline-block;vertical-align: top;box-sizing: border-box;max-width: 100%;"><section style="width: 2.5em;height: 2.5em;border-width: 2px;border-style: solid;box-sizing: border-box;border-color: rgb(3, 82, 219);max-width: 100%;"><br/></section><section style="margin: -2em 0px 0px 0.5em;background-color: rgb(254, 255, 255);text-align: left;padding: 0px 5px;box-sizing: border-box;max-width: 100%;"><section style="box-sizing: border-box;color: rgb(0, 0, 0);max-width: 100%;"><span style="color: rgb(3, 82, 219);"><strong>01</strong></span></section></section></section></section></section></section></section></section><section data-id="87843" data-color="#212122" data-custom="#212122"><section><section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><span style="color: rgb(3, 82, 219);font-size: 17px;"><strong>遇到杀猪盘</strong></span><span style="font-size: 16px;"/></p></section></section></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">我跟好多普通人一样，也是憧憬着能够遇到爱情，然后跟那个人过上柴米油盐酱醋茶的小日子，虽然平淡，但是只要日常中给我一点小确幸，我就心满意足了。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">今年春节，我又被催婚了，本来很心烦，结果因为疫情原因只能呆在家里，一开始想着说不用出去被喂狗粮，还是不错的，没想到呆了2天就挺无聊。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">刷着某音，我看到了一个社交软件的推广，那个男声优声音太好听，好奇之下我下载了某社交APP，然后，我就遇到了骗子。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">一开始我是真的陷进去了，觉得上天待我不薄让我遇到了这么好的人，我以为我们会奔现结婚生子，没想到，我只是别人养的一只待“宰”的猪，嗯，我遇到杀猪盘了，被骗了40多万，其中6万是借的外债。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><strong><span style="font-size: 16px;">灵魂受到了一次很大的暴击！</span></strong><span style="font-size: 16px;"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><strong><span style="font-size: 16px;"><br/></span></strong></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><strong><span style="font-size: 16px;"><br/></span></strong></p><section data-tools="新媒体排版" data-id="2983874" data-style-type="undefined"><section data-tools="新媒体排版" data-id="11833" data-style-type="标题" style="max-width: 100%;"><section style="border-width: 0px;border-style: none;border-color: initial;padding: 0px;max-width: 100%;"><section style="box-sizing: border-box;max-width: 100%;" powered-by=".us"><section style="text-align: center;margin-top: 10px;margin-bottom: 10px;box-sizing: border-box;max-width: 100%;"><section style="display: inline-block;vertical-align: top;box-sizing: border-box;max-width: 100%;"><section style="width: 2.5em;height: 2.5em;border-width: 2px;border-style: solid;box-sizing: border-box;border-color: rgb(3, 82, 219);max-width: 100%;"><br/></section><section style="margin: -2em 0px 0px 0.5em;background-color: rgb(254, 255, 255);text-align: left;padding: 0px 5px;box-sizing: border-box;max-width: 100%;"><section style="box-sizing: border-box;color: rgb(0, 0, 0);max-width: 100%;"><span style="color: rgb(3, 82, 219);"><strong>02</strong></span></section></section></section></section></section></section></section></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><span style="font-size: 17px;color: rgb(3, 82, 219);"><strong><span style="font-size: 17px;font-family: mp-quote, -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;">给骗子下套</span></strong></span><span style="font-family: mp-quote, -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 16px;"/><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">本身我就有在社交软件记录自己身边发生事的习惯，发生这个事之后我就上了某乎，写了我的被骗经历，想着如果能被更多的人看到，她们可以不被“宰”，那我算是做了点好事，没想到，就是因为这个，我又遇到了骗子。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">一开始，有人私聊我，说她看到我的帖子，她也遇到了杀猪盘，一起吐槽骗子狗推，各种发泄，聊到后面她就跟我说，幸好她的钱追回来了，我一开始是很吃惊的，而且我也很好奇她是怎么追回的。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">她表示，她在暗网找了个黑客，买了个源代码，那个黑客利用源代码帮她追回来的。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.7851605758582503" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPmbCc8ZrMxACqvECnXMhZoM6srepqfpNrGPcIP6fjdkicBzbo5e73UIA/640?wx_fmt=png" data-w="1806" data-type="png" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/e0a26f020075de44beabcbbc1f708a1d.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPmbCc8ZrMxACqvECnXMhZoM6srepqfpNrGPcIP6fjdkicBzbo5e73UIA/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">一开始也没觉得什么，后面她给我看了她的截图，里面的回款金额引起了我的警觉。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">这个地方是疑点开始的地方，因为我们都遇到了杀猪盘，被骗流程都差不多，但是我看到转账截图里是整数倍的款汇进来，这个很不寻常，因为</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>我们在被骗的过程中，不是一次性被骗这么多钱的，是分开的，每一笔也都不是整数倍，所以按道理金额不会是直接整数倍就汇进来</strong></span><span style="font-size: 16px;">。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.6973684210526315" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPGJMkyCGlLsp2wvI2DibfdnPia2P40C6M3K4ib4bgXO96yTRy44IyviaeHg/640?wx_fmt=png" data-w="380" data-type="png" src="../Images/e323015e9826206c0ee00d0f96f7d1a3.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPGJMkyCGlLsp2wvI2DibfdnPia2P40C6M3K4ib4bgXO96yTRy44IyviaeHg/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">虽然有这个疑问，但是我也觉得，或许别人是一次性找回再帮她返款汇入银行卡的，也是有可能整数倍汇钱进来。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">还有，这个截图并没有看到就是农业银行的官网客服号入账，很可能是别人编辑好的短信发给她而已。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">带着这些疑问，我还是问她要了那个黑客的联系方式。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.5932688865019692" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPJzl86LDL2Bia7XTh9LNdibXfpUPqib0f7oFINvr2IDbvOs3VtELVvnK2w/640?wx_fmt=png" data-w="2793" data-type="png" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/707a3b47adc16703cacaad946ad4766f.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPJzl86LDL2Bia7XTh9LNdibXfpUPqib0f7oFINvr2IDbvOs3VtELVvnK2w/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><section data-tools="新媒体排版" data-id="2983874" data-style-type="undefined"><section data-tools="新媒体排版" data-id="11833" data-style-type="标题" style="max-width: 100%;"><section style="border-width: 0px;border-style: none;border-color: initial;padding: 0px;max-width: 100%;"><section style="box-sizing: border-box;max-width: 100%;" powered-by=".us"><section style="text-align: center;margin-top: 10px;margin-bottom: 10px;box-sizing: border-box;max-width: 100%;"><section style="display: inline-block;vertical-align: top;box-sizing: border-box;max-width: 100%;"><section style="width: 2.5em;height: 2.5em;border-width: 2px;border-style: solid;box-sizing: border-box;border-color: rgb(3, 82, 219);max-width: 100%;"><br/></section><section style="margin: -2em 0px 0px 0.5em;background-color: rgb(254, 255, 255);text-align: left;padding: 0px 5px;box-sizing: border-box;max-width: 100%;"><section style="box-sizing: border-box;color: rgb(0, 0, 0);max-width: 100%;"><span style="color: rgb(3, 82, 219);"><strong>03</strong></span></section></section></section></section></section></section></section></section><section data-id="87843" data-color="#212122" data-custom="#212122"><section><section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><span style="font-size: 17px;color: rgb(3, 82, 219);"><strong>求证过程</strong></span><span style="font-size: 16px;"/></p></section></section></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">加上了黑客，我直接开门见山，说明来意。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">黑客表示，我得买个源代码渗透对方账号导致紊乱攻击，然后以银行申诉的方式进行追回。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">据我所知，就算是平常转错钱到别人的账户里，需要提供自己的银行卡号等各种信息找到那个转错人的户籍地去找到那个人，然后公安部门的人协调之后才可能顺利让银行把钱转回，现在这个黑客却说可以通过这个途径，虽然有点小怀疑，但是毕竟骗子的账户可能会有其他特殊情况，那我暂时相信一下。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">我把一个账号发给他，这个账号确实是我转过给骗子的，黑客表示，对方账号在境外，如果想要开始找回，那就需要到暗网上面买源代码。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.4565842438182864" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPDOePULzzNR8QNm7d5B77iafEZwxeOoibPuBZiaExN0aFibibot5yAVRFKsw/640?wx_fmt=png" data-w="1739" data-type="png" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/9e6ed7269f6a7974d26562a7f3b83f18.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPDOePULzzNR8QNm7d5B77iafEZwxeOoibPuBZiaExN0aFibibot5yAVRFKsw/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.5890625" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_jpg/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTP5Jb5Uib28SuCrrwMky5J4gSDv0OSYk1aaGdobhEhXUAuOt8ynyicmSKA/640?wx_fmt=jpeg" data-w="1280" data-type="jpeg" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/daab161b58dadc28a7f5dd4fa3d40dd8.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_jpg/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTP5Jb5Uib28SuCrrwMky5J4gSDv0OSYk1aaGdobhEhXUAuOt8ynyicmSKA/640?wx_fmt=jpeg"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">我不知道怎么去暗网买，黑客表示可以帮我代买，价格分成3种，1种是100%可以找回，价格9800,1种6899，可以找回80%，1种是3999，可以找回50%。购买后如果找回成功，需要我支付找回金额的10%付给他做为劳务费。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.9400705052878966" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_jpg/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPHfRqUujkbfeTdljCPCVSyvsUtHqTQeRMhh2LCiaqy26CSQIzLAGdZibw/640?wx_fmt=jpeg" data-w="851" data-type="jpeg" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/9134767d024f165ae04be05c6e25fe20.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_jpg/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPHfRqUujkbfeTdljCPCVSyvsUtHqTQeRMhh2LCiaqy26CSQIzLAGdZibw/640?wx_fmt=jpeg"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">这个时候，我隐约觉得，这个黑客应该是为了骗取我让他代买暗网上面源代码的钱。所以，我心生一计，用一个我没有给骗子转过账的银行卡号发给他，诈一下他，看看他究竟是不是有猫腻。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">果然，他告诉我，我给他的第二个银行卡号也是骗子的，说他们都是骗子的账号，资金最后都流入了马来西亚。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">后面我直接问，我被骗了多少钱，也是为了佐证我的猜测，因为我开头留了个心眼，故意说我被骗了四十万，其实并不止这个数字。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">所以，</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>这个很明显又是一个针对遇到杀猪盘的人的骗局</strong></span><span style="font-size: 16px;">。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="0.8856825749167592" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPCBicIH5yPbiaTicNTL0Ua0EXZj6kQiclLPAYbiaVVubSouzLT4dXd9gCFTw/640?wx_fmt=png" data-w="901" data-type="png" style="box-shadow: rgb(170, 170, 170) 0px 0px 14px 0px;" src="../Images/639bbd7521e13b1120111a59c39510b5.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPCBicIH5yPbiaTicNTL0Ua0EXZj6kQiclLPAYbiaVVubSouzLT4dXd9gCFTw/640?wx_fmt=png"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">识破了这个骗子之后，我直接找了个借口，退出来了。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><section data-tools="新媒体排版" data-id="2983874" data-style-type="undefined"><section data-tools="新媒体排版" data-id="11833" data-style-type="标题" style="max-width: 100%;"><section style="border-width: 0px;border-style: none;border-color: initial;padding: 0px;max-width: 100%;"><section style="box-sizing: border-box;max-width: 100%;" powered-by=".us"><section style="text-align: center;margin-top: 10px;margin-bottom: 10px;box-sizing: border-box;max-width: 100%;"><section style="display: inline-block;vertical-align: top;box-sizing: border-box;max-width: 100%;"><section style="width: 2.5em;height: 2.5em;border-width: 2px;border-style: solid;box-sizing: border-box;border-color: rgb(3, 82, 219);max-width: 100%;"><br/></section><section style="margin: -2em 0px 0px 0.5em;background-color: rgb(254, 255, 255);text-align: left;padding: 0px 5px;box-sizing: border-box;max-width: 100%;"><section style="box-sizing: border-box;color: rgb(0, 0, 0);max-width: 100%;"><span style="color: rgb(3, 82, 219);"><strong>04</strong></span></section></section></section></section></section></section></section></section><section data-id="87843" data-color="#212122" data-custom="#212122"><section><section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><span style="font-size: 17px;color: rgb(3, 82, 219);"><strong>如何识破骗局？</strong></span><span style="font-size: 16px;"/></p></section></section></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">这是个活生生被骗子逼成福尔摩斯的典型例子，其实这样的骗局，</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>骗子们利用的就是受害者们急于找回被骗的钱的心理</strong></span><span style="font-size: 16px;">。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">他们先是在各种社交软件上寻找目标，因为现在好多社交平台都可以记录很多东西，比如我们也有在网络上面发布杀猪盘的文章，底部就经常有一些杀猪盘的受害者留言想要加入我们的受害者群，那么这些人就会成为他们的目标之一。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">还有一部分人是会将自己的受骗经历通过写文章的方式发布出去，骗子们也可以通过这样的方式找到受害者。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">第一步，</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>骗子们会伪装成杀猪盘的受害者来跟你套近乎</strong></span><span style="font-size: 16px;">，说自己也是遭遇了杀猪盘，跟你私聊，互相诉苦，因为有相同的遭遇，所以很容易你们俩就说到一块去了，等时机成熟，他们就会抛出，被骗的钱通过黑客的手段拿回来，这个是你的痛点。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">第二步，你肯定会很好奇他们是怎么要回来的，因为几乎99%的人都会想要去一探究竟的，谁都想被骗的钱能够顺利拿回来。这个时候，</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>如果你问他们要黑客的联系方式，那你就上钩了</strong></span><span style="font-size: 16px;">。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">不过他们还得慢慢引导你进去他们为你精心准备好的陷阱——让你购买那些所谓的</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>黑客入侵系统需要支付的“劳务费”、前期需要购买的“源代码”</strong></span><span style="font-size: 16px;">等等，估计以后还会有新的说法。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">这样的方式不仅是针对杀猪盘的受害者，其实像是</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>那些被日化收益平台坑过的人，被一些其他赌博网站被骗之后不敢报警的人，都是他们的目标</strong></span><span style="font-size: 16px;">！</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">但是，不管他们用的什么理由来忽悠你，最终一定就是要拿你口袋里的钱！这点是肯定的！</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><img data-ratio="1" data-src="https://mmbiz.qpic.cn/mmbiz_gif/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPp216kzNciaMUy90tafJzzD0vVSoqW3Mricqf2R1K5aY199FMoianNB8SQ/640?wx_fmt=gif" data-w="270" data-type="gif" style="width: 140px;height: 140px;" src="../Images/39901bb8f8be05da81662501e8d8cf42.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_gif/ybicB7PDu9BxcCH7ekaibibK7pmlUa2HlTPp216kzNciaMUy90tafJzzD0vVSoqW3Mricqf2R1K5aY199FMoianNB8SQ/640?wx_fmt=gif"/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;text-align: center;"><br/></p><section data-tools="新媒体排版" data-id="2903421" data-style-type="undefined"><section data-tools="新媒体排版" style="max-width: 100%;"><section style="border-width: 0px;border-style: none;border-color: initial;max-width: 100%;"><section powered-by="KolEditor.us" style="box-sizing: border-box;max-width: 100%;"><section style="margin-top: 10px;margin-bottom: 10px;text-align: center;box-sizing: border-box;max-width: 100%;"><section style="padding: 5px;display: inline-block;vertical-align: middle;box-sizing: border-box;max-width: 100%;"><section style="display: inline-block;vertical-align: middle;width: 1.2em;height: 1.2em;border-width: 2px;border-style: solid;transform: rotate(45deg);box-sizing: border-box;border-color: rgb(204, 204, 204);background-color: rgb(0, 0, 255);max-width: 100%;"><br/></section><section style="margin-left: -0.5em;display: inline-block;vertical-align: middle;width: 1.2em;height: 1.2em;border-width: 2px;border-style: solid;transform: rotate(45deg);box-sizing: border-box;border-color: rgb(200, 232, 246);max-width: 100%;"><br/></section></section></section></section></section></section></section><section data-id="87843" data-color="#212122" data-custom="#212122"><section><section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"/></p></section></section></section><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">本案例中的这位小姐姐，她说其实从一开始就怀疑那个告诉她可以拿回钱的人了。因为这个人一问三不知，如果按照正常的逻辑，这个人好不容易拿到了返回的钱，她对于怎么拿回钱的经历肯定是一清二楚并且刻苦铭心的。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"><br/></span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">但是这个人似乎对她怎么要回钱都没有去刻画一些细节，都是泛泛而谈，并且急于将她介绍给那个黑客对接。</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">总而言之，不要轻易给陌生人转账。如果不幸掉坑了，请果断报警，不报警的话骗子只会更加肆无忌惮！</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">虽然这种案件破案难度很大，钱很难要回来，但是可以引起社会足够的重视，越来越多的人知道这个骗局之后，骗子就没办法那么容易得逞了！</span></p><p style="line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="margin-right: 16px;margin-left: 16px;white-space: normal;line-height: 1.75em;"><br/></p><section data-tools="新媒体排版" data-id="2207325" data-style-type="undefined" style="white-space: normal;"><section style="max-width: 100%;"><section style="margin-right: auto;margin-left: auto;max-width: 80px !important;"><img data-ratio="0.20155038759689922" data-src="https://mmbiz.qpic.cn/mmbiz_png/8Lg2vwlPTaS2BG6aqT9s31mANC1Nzgz2ricS60WKLGCiciaWZib50lLLUsuxQE8wFZ7SmGIegxEOJ7oUIHRuxozrtA/640?wx_fmt=png" data-type="png" data-w="129" style="margin-right: auto;margin-left: auto;" src="../Images/abec3b329fdacb3417141c4665da86ee.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/8Lg2vwlPTaS2BG6aqT9s31mANC1Nzgz2ricS60WKLGCiciaWZib50lLLUsuxQE8wFZ7SmGIegxEOJ7oUIHRuxozrtA/640?wx_fmt=png"/></section><section style="margin-right: auto;margin-left: auto;max-width: 80px !important;"><br/></section></section></section><section style="margin-right: 16px;ma
