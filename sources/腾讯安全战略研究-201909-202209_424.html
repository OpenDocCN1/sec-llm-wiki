<h1>亲历揭秘：钱花越多赚得越多的消费返利，如何骗我20万？</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MjM5MTA0NjU3Ng==&amp;mid=2652705874&amp;idx=1&amp;sn=baf7fb60f2d2bf5ca061ae740b8b62d7&amp;chksm=bd523a8d8a25b39bfd48bf4ce7b3a002a28c8fe71305572f85837ad69ef9910049c1f12683da&amp;scene=126&amp;sessionid=1681323422#rd">http://mp.weixin.qq.com/s?__biz=MjM5MTA0NjU3Ng==&amp;mid=2652705874&amp;idx=1&amp;sn=baf7fb60f2d2bf5ca061ae740b8b62d7&amp;chksm=bd523a8d8a25b39bfd48bf4ce7b3a002a28c8fe71305572f85837ad69ef9910049c1f12683da&amp;scene=126&amp;sessionid=1681323422#rd</a></blockquote><p><img class="rich_pages" data-ratio="0.3275488069414317" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/8Lg2vwlPTaSHwZHuM9L2P1YsEmVNMB1pXwMfibozYDMCJiaMiaJNWWfD8b7qKYkLj4RchvbKMiaMgacxIO9FLHj7Qg/640?wx_fmt=png" data-type="png" data-w="922" style="text-align: center;font-family: mp-quote, -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;" src="../Images/df67b5b15506eaf3fca51050167a5be2.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/8Lg2vwlPTaSHwZHuM9L2P1YsEmVNMB1pXwMfibozYDMCJiaMiaJNWWfD8b7qKYkLj4RchvbKMiaMgacxIO9FLHj7Qg/640?wx_fmt=png"/><br/></p><section class="xmyeditor style_1 style_2" data-id="6542" data-md5="a3dbc"><section class="style_2 style_3" data-md5="a3dbc" label="Powered by xmyeditor.com" powered-by="xmyeditor.com"><section data-md5="a3dbc" powered-by="xmyeditor.com"><section data-md5="a3dbc"><section data-md5="a3dbc" powered-by="xmyeditor.com"><section label="Powered by 135editor.com" data-role="outer"><section powered-by="xiumi.us"><section><section><section powered-by="xiumi.us"><section><section><section powered-by="xiumi.us"><section><section><section powered-by="xiumi.us"><section data-role="paragraph" data-i="15604841492095" data-custom="#1e9be8" data-color="#1e9be8"><section data-style="margin-top: 2px; margin-bottom: 0px; max-width: 100%; min-height: 1.5em; line-height: 2em;" mpa-from-tpl="t"><figure data-block="true" data-editor="9t1g4" data-offset-key="eqkuc-0-0"><section powered-by="xiumi.us"><section data-role="outer"><section data-id="708" data-custom="#f5f5f4" data-color="#f5f5f4"><section><section data-role="paragraph"><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><section style="text-align: center;margin-left: 16px;margin-right: 16px;line-height: 1.5em;"><span style="color: rgb(136, 136, 136);"><strong><span style="font-size: 14px;">本文转载自菲凡烽火台</span></strong></span></section><section style="text-align: center;margin-left: 16px;margin-right: 16px;line-height: 1.5em;"><span style="color: rgb(136, 136, 136);"><strong><span style="font-size: 14px;">文 | 菲凡小菲</span></strong></span></section><section style="text-align: justify;margin-left: 16px;margin-right: 16px;line-height: 1.5em;"><span style="font-size: 16px;"><br/></span></section><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">如果现在还有人跟我说：0元购物，花的越多，赚的越多，消费100元，返还110元……<br/></span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"> </span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">我一定会狠狠地骂他：我信你个鬼，糟老头，坏得很！</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;font-family: mp-quote, -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;"> </span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">消费返利，曾经是最火爆的骗局，也是我不愿提及的惨痛经历，我不但亏掉了20万，连一起多年的女友也分手了，原以为这种骗局已经远去了，没想到一直存在！因而，我将自己曾经的经历分享出来，供大家学习，以免还有人上当受骗！</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"> </span></p><p style="text-align: center;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="1" data-src="https://mmbiz.qpic.cn/mmbiz_gif/ybicB7PDu9Byewzibob7KPsEX0x5Xm8I1fLJEoVDHdzeuIlCprfn1ZatJwJ2iaHVm0HcPRPE7AeFmA9v1AwZD9WMQ/640?wx_fmt=gif" data-type="gif" data-w="300" style="box-shadow: none;width:45%;height:auto;" src="../Images/2c19637459aae65b87066f5d16dc5f8e.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_gif/ybicB7PDu9Byewzibob7KPsEX0x5Xm8I1fLJEoVDHdzeuIlCprfn1ZatJwJ2iaHVm0HcPRPE7AeFmA9v1AwZD9WMQ/640?wx_fmt=gif"/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">以下是叙述内容，A为受害者，B为小菲。</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"> </span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">A：“我看到最近市面上出现了很多那种区块链投资的产品，我身边有朋友也在做这个，告诉我说只要走个路，刷个视频，读个小说就能月入十万，我其实打从心里我是压根不信这个……”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">B：“但是你身体很诚实，还是去参与了？”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">A：“哇，小菲，我什么都还没说，你怎么会知道？”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">B：“你如果没有被骗，也不会有咱们这次的对话了。”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">A：“呵呵，其实我被骗并不是指这个东西，我知道这个东西也是有问题的，我只是参与一下，想弄懂它们是怎么骗人的而已。至于我接下来想要讲的重点，是我两年前的一个被骗经历，这个经历真的让我痛了很久，甚至有段时间我都不敢告诉家里人，整个人就跟抑郁了一样，工作也不想工作，就天天像个烂泥一样瘫在房间里，后来因为自己背了一屁股债，不得已才重拾自己的精神状态，出去打工赚钱，今年才把欠债还清了。”</span></p><p><br/></p><p style="text-align: center;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="1" data-src="https://mmbiz.qpic.cn/mmbiz_jpg/ybicB7PDu9Byewzibob7KPsEX0x5Xm8I1faLckU2efdkC3UclAiausNehZibEZ41uFly3yf8a0FMJ2e1lsVjicSSbJw/640?wx_fmt=jpeg" data-type="jpeg" data-w="240" src="../Images/b5a2795db0df0a277a3cb0c3f24a38bc.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_jpg/ybicB7PDu9Byewzibob7KPsEX0x5Xm8I1faLckU2efdkC3UclAiausNehZibEZ41uFly3yf8a0FMJ2e1lsVjicSSbJw/640?wx_fmt=jpeg"/></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">B：“两年前？那就是2017年，那时候最风靡的应该就是消费返利类的庞氏骗局。”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">A：“对对对！就是<strong>那个消费返利，号称0元购物，花得越多，赚得越多，把我害惨了</strong>，两年前我才大学毕业不久，就被骗了20万！”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">B：“那你也挺厉害的，大学毕业不久就敢投20万，我毕业的那时候可没这个魄力。”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">A：“哎呀，我这还不是年轻气盛，涉世未深，所以被骗了嘛。”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">B：“那你就说说吧，把你被骗的经历发出来，供大家以警示作用的。”</span></p><p><br/></p><p style="text-align: center;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="1" data-src="https://mmbiz.qpic.cn/mmbiz_jpg/ybicB7PDu9Byewzibob7KPsEX0x5Xm8I1frKkY1YxzpJ81BbiaO1aTvGDachSeYh6KRHLD9hXUnDp8NfvPsCg6vzg/640?wx_fmt=jpeg" data-type="jpeg" data-w="300" style="width: 212px;height: 212px;" src="../Images/27ced1795ba6cc60e2dbd120cc738195.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_jpg/ybicB7PDu9Byewzibob7KPsEX0x5Xm8I1frKkY1YxzpJ81BbiaO1aTvGDachSeYh6KRHLD9hXUnDp8NfvPsCg6vzg/640?wx_fmt=jpeg"/></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">A：“2016年，我从湖南的一所大学毕业，然后按照大多数大学生的轨迹一样，我就在长沙找了一份工作，然后安安分分的开始打工赚钱，一年下来，也能挣个大几万，但是买房买车那是真的不敢奢望。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">在大城市虽然挣得多，但是花销也大啊，我自己是一个果粉，遇到iPhone出新机了我就想买，平常开销也是大手大脚。那个时候又谈了一个女朋友，基本上每逢一个节假日就要给我女朋友送点小礼物，所以基本上也存不了什么钱，到了第二年，卡上的存款还没突破三位数，我就有点慌了，觉得自己不能这么一直这样，于是就问问身边的同事和同学，有没有什么发财的路子。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">我还记得那是在2017年5月份，有一个公司同事推荐我去下载一个APP，跟我说上面买东西不花一分钱，比如什么衣服、粮油，甚至包括小家电和手机都不需要花一分钱就能抱回家，我当时是一点不信，但是当同事把他新换的iPhone手机摆在我面前的时候，我信了，因为我这个同事非常节俭，根本不可能花钱去购置这么昂贵的一款手机。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">后来我就跟随他的引导下，下载了这款APP，当时这款APP其实特别火，<strong>号称是0元购物，消费返利，消费者在APP上面花的每一分钱，都会在未来的某一时间全部还给消费者，产品还是属于消费者</strong>。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">我当时非常惊讶，觉得这个开发者脑袋估计坏掉了，这不是明摆着给消费者送钱么？而当我看到上面的那款iPhone手机的价格，我也顿时打了退堂鼓，因为这上面的价格实在太高了，比我去官网店买足足贵了三倍！但是我同事一直给我灌输这个APP有人站台，获得当地政府和领导支持，肯定是优质企业。</span></p><p><br/></p><p style="text-align: center;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="0.8" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_gif/ybicB7PDu9Byewzibob7KPsEX0x5Xm8I1fPL84j0ukUSnGxtRsibg7QjcBSc0ic3WC1aX1uo7yU4TAUTXdPI9wTxMg/640?wx_fmt=gif" data-type="gif" data-w="300" src="../Images/6a2797a75915be6e75edd0e1016d376a.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_gif/ybicB7PDu9Byewzibob7KPsEX0x5Xm8I1fPL84j0ukUSnGxtRsibg7QjcBSc0ic3WC1aX1uo7yU4TAUTXdPI9wTxMg/640?wx_fmt=gif"/></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">让我不要在意价格，因为最后钱都会退回给我们。我当时看到同事手上的新iPhone手机，心一横，就找朋友借了10000元，我自己套信用卡套了10000元，凑了20000元下单了一部iPhone手机。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">当我收到新手机的时候，其实我是既高兴又忐忑的，高兴是因为我有了新手机，忐忑的是我还需要等待时间等平台把钱还给我，而且我甚至不知道这个平台最终会不会真的把钱打回我的账户上！</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">没想到才过了半个月，平台就把PX币返给我了，而我立马把PX币提现了，看到我手上的新手机又看到我账户上分文未动的钱，我真的震撼到了！</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">于是我的薅羊毛就正式开始了，我不断地刷信用卡，把钱套出来，甚至去借女朋友和亲朋好友的钱，把钱越滚越多地投进APP里面，一口气买了微波炉、烤箱、榨汁机、电视机等等，总共货值零零散散加起来也有十多万。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">我的这种行为当然也引起了我女朋友的怀疑，但是当我买了一个新的手机送给她时，她也打消了疑虑，还怪我怎么不早点告诉她！</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"><br/></span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">随后的一段时间，我和我女朋友两个人疯狂地参与到消费返利活动中，每天我们几乎都能收到包裹，光是新手机我们都收到了十来部手机。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">为了摸清楚平台日益更新的玩法，我甚至辞掉了工作，专心在家琢磨，当时我其实想得很简单，我把平台上的产品转手出售，赚的比工作的死工资要多得多。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">但谁知道之后平台就出问题了，8月份提现突然限制了，我和我女朋友开始有点不好的预感，我们之后也看到群里很多像我们这样的人也在询问发生了什么事，群管理人也在安慰我们，说是系统在维护，以后的提现系统会恢复，但提现系统迟迟没有恢复，<strong>群管理人后来甚至建议我们去邀约更多的人进来平台玩，这样平台就有钱给我们了</strong>。</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="text-align: center;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><img data-ratio="1" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_gif/ybicB7PDu9Byewzibob7KPsEX0x5Xm8I1fzqicRticS3jkH7Gb8pLTibbHIOxmwbY9j58T0PUJTvyKU30LZz701A7Cw/640?wx_fmt=gif" data-type="gif" data-w="255" style="width: 182px;height: 182px;" src="../Images/1311fba4d09fe52559ff1e031f1e154d.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_gif/ybicB7PDu9Byewzibob7KPsEX0x5Xm8I1fzqicRticS3jkH7Gb8pLTibbHIOxmwbY9j58T0PUJTvyKU30LZz701A7Cw/640?wx_fmt=gif"/></p><p style="text-align: center;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">我和我女朋友顿时醒悟了过来，</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>这就是一个击鼓传花的骗局</strong></span><span style="font-size: 16px;">，可笑我和我女朋友两个大学毕业的大学生，竟然深陷这样的骗局不可自拔，甚至砸了二十多万，说出来简直让人笑掉大牙。<br/></span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">后来就传来平台被立案，负责人都被抓了起来。很多像我们这样的投资人，连忙结伴去了警察局，想要讨回我们的血汗钱，警方征询我们这些受害人的具体情况，后来就没消息了。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">我心知这笔钱很难要得回来了，女朋友也因为这个事情怪罪于我，跟我分了手，还说我毁了她的一生，让她一辈子抬不起头来，我也自知有愧，也赔了她10000元当做补偿，最后我把所有的货品低价甩卖，减轻我的损失，但依旧还有20多万的资金窟窿。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">这些钱都是我从银行、亲朋好友、同事那里借来的，我当时是真的要疯了，我才大学毕业1年，就背债20多万，但我知道，像我这样的人，不在少数，整个平台的受害群体少说有20多万人，有些人甚至砸了几百上千万，我只是这些不幸群体中的一员罢了。”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">B：“嗯，很生动，也很惨痛，不过为了让其他读者对这样的骗局了解的更深入，我有几个疑问也想问问你。”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">A：“你说，我知无不言言无不尽。”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">B：“第一，PX币是什么东西，跟现在的区块链数字货币一样么？第二，你说你加入了一个群，这个群是谁拉你进去的，群里一般都是发的什么内容？第三，现在过去两年了，你讨回了这笔钱了么？”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">A：“小菲果然是慧眼如炬……”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">B：“别废话，我后期要编辑文字很累。”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">A：“是是是，PX币就类似于平台商城里面的积分，我们买东西最后都是返还的PX币，再由PX币转换成现金提现到我们的银行卡里。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">这个PX币与现金的比率是恒定的1:1，跟数字货币应该还是有区别。而那个群就是平台的官方群，是官方的工作人员拉我进群的，工作人员亲手教我们怎么在商城平台上薅羊毛，也时常会发布一些新产品的上线，让我们去参与购买。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">至于第三点，目前我们这些受害人，依旧在等待政府给我们的解决方案，我们只能去相信政府了，不然，我们还能做什么呢？”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">B：“好的，鉴于篇幅有限，咱们今天就暂时到这里，你还有什么想要对大家说的么？”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">A：“</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>希望大家对于这种骗局，提高警惕，只要你不贪心，那么骗局就不会找上你。</strong><strong>其实很多时候，是你自己本身，把骗局吸引到了你身边。</strong></span><span style="font-size: 16px;">”</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">B：“谢谢，现在让小菲为大家梳理消费返利骗局的套路吧。”</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"> </span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">小菲：这是一个</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>非常典型打着“互联网+零售”旗帜来实施非法集资的庞氏骗局</strong></span><span style="font-size: 16px;">。</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"><br/></span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">我可以很形象地用“钓鱼”的说法给大家讲解消费返利的诈骗套路。</span></p><section data-id="87856" data-color="#1e9be8" data-custom="#1e9be8"><section><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p><section class="xmt-style-block" data-style-type="5" data-tools="新媒体排版" data-id="2470617"><section class="xmt-style-block" data-style-type="5" data-tools="新媒体排版" data-id="1882026"><section class="RankEdtior" style="margin-top:20px;"><section class="" style="border-color:initial;border-style:none;border-width:0px;" data-css="border-color: initial;border-style: none;border-width: 0px;position: static"><h2 class="ative brush" placeholder="请输入标题" style="border-left: 5px solid rgb(75, 99, 223);font-size: 16px;line-height: 32px;margin-bottom: 10px;margin-top: 10px;padding: 5px 10px;" data-css="border-left-color: rgb(249, 7, 7);border-left-style: solid;border-left-width: 5px;color: rgb(102, 102, 102);font-size: 16px;line-height: 32px;margin-bottom: 10px;margin-top: 10px;padding: 5px 10px"><section style="white-space: normal;color: rgb(0, 0, 0);margin-left: 16px;margin-right: 16px;"><span style="color:#0052ff;"><span style="font-size: 17px;"><strong>第一步：</strong><strong>下诱饵</strong></span></span><span style="color:#0052ff;"/></section></h2></section></section></section></section><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"/></p></section></section><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">想要钓鱼，没有诱饵怎么行？既然是骗局，当然希望尽快撒饵。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">还有什么比政府更具有公信力？所以平台在宣传中谎称：平台获得政府支持，这是一家优质企业。这种正面宣传会让人放松警惕。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">其次，平台从供应商和代理商获取的广告宣传费，给平台会员让利，让消费返利，花得越多，赚得越多，听起来合情合理。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">其实这是经不起推敲的，可是在糖衣炮弹的利益之下，有多少人会去推敲呢？</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>0元购物，就是诱饵。</strong></span><span style="font-size: 16px;">诱饵既下，接下来就是等鱼上钩！</span></p><p><br/></p><section data-id="87856" data-color="#1e9be8" data-custom="#1e9be8"><section><section data-id="87856" data-color="#1e9be8" data-custom="#1e9be8" style="white-space: normal;"><section><section class="xmt-style-block" data-style-type="5" data-tools="新媒体排版" data-id="2470617"><section class="xmt-style-block" data-style-type="5" data-tools="新媒体排版" data-id="1882026"><section class="RankEdtior" style="margin-top: 20px;"><section class="" data-css="border-color: initial;border-style: none;border-width: 0px;position: static" style="border-color: initial;border-style: none;border-width: 0px;"><h2 class="ative brush" placeholder="请输入标题" data-css="border-left-color: rgb(249, 7, 7);border-left-style: solid;border-left-width: 5px;color: rgb(102, 102, 102);font-size: 16px;line-height: 32px;margin-bottom: 10px;margin-top: 10px;padding: 5px 10px" style="margin-top: 10px;margin-bottom: 10px;padding: 5px 10px;border-left: 5px solid rgb(75, 99, 223);line-height: 32px;"><section style="margin-right: 16px;margin-left: 16px;color: rgb(0, 0, 0);"><span style="color:#0052ff;"><span style="font-size: 17px;"><strong>第二步：鱼上钩</strong></span></span><span style="color:#0052ff;"/></section></h2></section></section></section></section><p style="margin-right: 16px;margin-left: 16px;line-height: 1.75em;"><span style="font-size: 16px;"/></p></section></section><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p></section></section><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">不是下了诱饵，就会有鱼上钩的。平台不停推出各类活动，如百团大战，金秋百分百活动等，这些活动，这些活动都是</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>刺激会员参与，参与度越深，陷得越深</strong></span><span style="font-size: 16px;">。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">跟前面的受害者一样，朋友尝到甜头，刺激他参与了，他尝到了甜头，又刺激到他女朋友参与，就这样，参与的人越来越多，投入的钱越来越多。</span></p><p><br/></p><section data-id="87856" data-color="#1e9be8" data-custom="#1e9be8"><section><section data-id="87856" data-color="#1e9be8" data-custom="#1e9be8" style="white-space: normal;"><section><section class="xmt-style-block" data-style-type="5" data-tools="新媒体排版" data-id="2470617"><section class="xmt-style-block" data-style-type="5" data-tools="新媒体排版" data-id="1882026"><section class="RankEdtior" style="margin-top: 20px;"><section class="" data-css="border-color: initial;border-style: none;border-width: 0px;position: static" style="border-color: initial;border-style: none;border-width: 0px;"><h2 class="ative brush" placeholder="请输入标题" data-css="border-left-color: rgb(249, 7, 7);border-left-style: solid;border-left-width: 5px;color: rgb(102, 102, 102);font-size: 16px;line-height: 32px;margin-bottom: 10px;margin-top: 10px;padding: 5px 10px" style="margin-top: 10px;margin-bottom: 10px;padding: 5px 10px;border-left: 5px solid rgb(75, 99, 223);line-height: 32px;"><section style="margin-right: 16px;margin-left: 16px;color: rgb(0, 0, 0);"><span style="color:#0052ff;"><span style="font-size: 17px;"><strong>第三步：收线</strong></span></span><span style="color:#0052ff;"/></section></h2></section></section></section></section><p style="margin-right: 16px;margin-left: 16px;line-height: 1.75em;"><span style="font-size: 16px;"/></p></section></section><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><br/></p></section></section><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">当上钩的鱼越来越多，吸纳的钱越来越多，平台就准备收线了，做最后一步：</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>卷款跑路</strong></span><span style="font-size: 16px;">。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">一旦平台不能提现，大家就慌了。回头想想，消费返利骗局也是挺荒诞的，骗子只是设计了一个骗局，市场价6000的iPhone，就能以23800元卖出，相当于大家把钱交到骗子手上，然后等着骗子把钱返回来。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">不过，骗子深谙钓鱼之道，不能猛拉鱼线，而应该一边拉，一边放，往复循环。</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>每到关键节点，既得利益者便出来安抚人心，无非就是系统维护、系统升级等理由，借此拖延骗局，能拖一天是一天</strong></span><span style="font-size: 16px;">，当你意识到上当受骗时，平台既得利益者，早就携巨款和小姨子逃之夭夭了。</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"> </span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">消费返利，顾名思义，就是你消费，平台返还一定数额的利益。别以为消费返利骗局已经远去了，其实一直都还存在，只不过消费返利有了变种。</span></p><p><br/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">以前的消费返利，就是像上面案例那样，你平台上购买的东西，高于市场价几倍，平台承诺返利。</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"><br/></span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><strong><span style="font-size: 16px;">现在的消费返利，变异为预付卡消费，你充值越高，消费返利的额度越高，目的就是为了套取你的预付卡资金。</span></strong><span style="font-size: 16px;"/></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"> </span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">甚至，为了骗局更合情合理，消费返利还设置了返点消费，就是你消费越高，返点越高，不过返点消费都是有周期和时限的。</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"> </span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">还有的消费返利变种还</span><span style="font-size: 16px;color: rgb(3, 82, 219);"><strong>与传销相结合</strong></span><span style="font-size: 16px;">，就是你自己消费可以获得返利，你拉人消费、充值预付卡消费，你还可以获得返利，层级不限，拉的人头越多，返利额度越高，不但可以让你实现真正的0元消费，甚至可以大赚一笔。不过，你可以算一下，你赚了那点钱，平台可是坑了你亲人朋友好多钱。</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"> </span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;">不管怎么变种，消费返利的套路都是一样的，消费返利平台的结局也是一样的，就是免不了要跑路和崩盘，而你投进去的钱，很难要回来了。</span></p><p style="text-align: justify;line-height: 1.75em;margin-left: 16px;margin-right: 16px;"><span style="font-size: 16px;"><br/></span></p><section style="margin-right: 16px;margin-left: 16px;white-space: normal;line-height: 1.75em;"><span style="font-size: 16px;"> </span></section><section class="xmt-style-block" data-style-type="5" data-tools="新媒体排版" data-id="2207325" style="white-space: normal;"><section class="KolEditor"><section style="margin-right: auto;margin-left: auto;max-width: 80px !important;"><img cla
