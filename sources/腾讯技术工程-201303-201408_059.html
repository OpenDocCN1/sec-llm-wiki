<h1>三、报名规则</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5ODYwMjI2MA==&amp;appmsgid=100026349&amp;itemidx=4&amp;sign=61dbb5f0122decc983306b6c50a9d2e5&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/mp/appmsg/show?__biz=MjM5ODYwMjI2MA==&amp;appmsgid=100026349&amp;itemidx=4&amp;sign=61dbb5f0122decc983306b6c50a9d2e5&amp;scene=27#wechat_redirect</a></blockquote><p style="margin-top:8px;margin-bottom:0"><span style="">1、</span><span style="">欢迎咱们TEG的运动员们踊跃报名，各部门报名接口人：<strong><span style="text-decoration:underline;"><span style="color:#0070C0">部门秘书。</span></span></strong></span></p><p><span style="">2、</span><span style="">所有运动会比赛项目均为团队项目，以部门为单位。</span></p><p><span style="">3、</span><span style="">由于大部分比赛都是同时进行的，所以各比赛项目成员避免重复。</span></p><p style=""><span style="">4、</span><span style="">每个项目每队必须指定1名队长，由队长负责制。</span></p><p><br/></p>
