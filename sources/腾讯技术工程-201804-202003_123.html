left-2"><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">添加观察者</span></p></li><ul class=" list-paddingleft-2" style="list-style-type: square;"><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">问题：是否需要在 本次迭代中，继续通知 新加入的观察者</span></p></li><li><p style="text-align: left;"><span style="font-size: 16px;">解决：被观察者参数 </span><a href="https://github.com/chromium/chromium/blob/master/base/observer_list.h" style="box-sizing: border-box;font-size: 16px;user-select: text !important;" data-linktype="2"><span style="font-size: 16px;">`base::ObserverListPolicy`</span></a><span style="font-size: 16px;"> </span></p><p style="text-align: justify;"><span style="font-size: 16px;">决定迭代过程中，是否通知 新加入的观察者</span></p></li></ul><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">移除观察者</span></p></li><ul class=" list-paddingleft-2" style="list-style-type: square;"><li><p style="text-align: justify;"><span style="font-size: 16px;">问题：循环内（间接）删除节点，导致迭代器失效（崩溃）</span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">for(auto it = c.begin(); it != c.end(); ++it) c.erase(it);</span></code></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">解决：观察者节点 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">MarkForRemoval()</span></code><span style="font-size: 16px;"> 标记为 “待移除”，然后等迭代结束后移除</span></p></li></ul><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">通知迭代重入</span></p></li><ul class=" list-paddingleft-2" style="list-style-type: square;"><li><p style="text-align: justify;"><span style="font-size: 16px;">问题：许多情况下，若不考虑 重入情况，可能会导致 </span><a href="http://md.aclickall.com/Insane-Observer-Pattern.md#%E9%97%AE%E9%A2%98-%E6%AD%BB%E5%BE%AA%E7%8E%AF" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">死循环问题</span></a></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">解决：模板参数 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">allow_reentrancy</span></code><span style="font-size: 16px;"> 若为 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">false</span></code><span style="font-size: 16px;">，在迭代时断言 “正在通知迭代时 不允许重入”</span></p></li></ul><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">销毁被观察者</span></p></li><ul class=" list-paddingleft-2" style="list-style-type: square;"><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">问题：需要立即停止 迭代过程，让所有迭代器 全部失效</span></p></li><li><p style="text-align: left;"><span style="font-size: 16px;">解决：通过特殊的 </span><a href="https://github.com/chromium/chromium/blob/master/base/observer_list_internal.h" style="box-sizing: border-box;font-size: 16px;user-select: text !important;" data-linktype="2"><span style="font-size: 16px;">`base::internal::WeakLinkNode`</span></a><span style="font-size: 16px;"> +</span></p><p style="text-align: justify;"><span style="font-size: 16px;">双向链表 </span><a href="https://github.com/chromium/chromium/blob/master/base/containers/linked_list.h" style="box-sizing: border-box;font-size: 16px;user-select: text !important;" data-linktype="2"><span style="font-size: 16px;">`base::LinkedList`</span></a><span style="font-size: 16px;"> 存储 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::ObserverList</span></code><span style="font-size: 16px;"> 所有的迭代器；在 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::ObserverList</span></code><span style="font-size: 16px;"> 析构时，将迭代器 标记为无效（自动停止迭代），并 移除、销毁</span></p></li></ul><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">线程安全问题</span></p></li><ul class=" list-paddingleft-2" style="list-style-type: square;"><li><p style="text-align: justify;"><span style="font-size: 16px;">问题：由于 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::ObserverList</span></code><span style="font-size: 16px;"> 不是线程安全的，在通知迭代时，需要保证其他操作在 同一线程/序列</span></p></li><li><p style="text-align: left;"><span style="font-size: 16px;">解决：被观察者成员 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">iteration_sequence_checker_</span></code><span style="font-size: 16px;"/></p><p style="text-align: justify;"><span style="font-size: 16px;">在迭代开始时关联序列，在结束时解除关联，在迭代过程中检查 移除观察者/通知重入/销毁被观察者 操作是否序列安全（参考 [sec|线程安全检查]）</span></p></li></ul></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="font-size: 16px;">和 </span><a href="https://github.com/chromium/chromium/blob/master/base/memory/singleton.h" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="box-sizing: border-box;font-size: 16px;">base::Singleton</span></code></a><span style="font-size: 16px;"> 一样，Chromium/base 的设计模式实现 堪称 C++ 里的典范 —— 无论是功能上，还是性能上，均为 “<strong style="box-sizing: border-box;user-select: text !important;">人无我有，人有我优</strong>”。</span></p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><br/></p><blockquote mpa-from-tpl="t" mpa-is-content="t" style="box-sizing: border-box;margin-top: 10px;margin-right: 10px;margin-bottom: 18px;padding-left: 6px;color: rgb(62, 71, 83);border-left-width: 5.5px;border-left-color: rgb(3, 124, 230);font-size: 18px;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);unicode-bidi: embed;user-select: text !important;"><span class="" style="box-sizing: border-box;color: rgb(0, 0, 0);user-select: text !important;"><strong mpa-is-content="t" mpa-from-tpl="t" style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;"><strong mpa-from-tpl="t" mpa-is-content="t" style="box-sizing: border-box;user-select: text !important;"><strong style="box-sizing: border-box;user-select: text !important;">写在最后</strong>  </strong></strong></span></blockquote><blockquote style="box-sizing: border-box;color: rgb(62, 71, 83);font-size: 18px;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><p style="box-sizing: border-box;margin-right: 8px;margin-bottom: 1em;margin-left: 8px;font-family: 微软雅黑;font-size: 16px;line-height: 1.75;user-select: text !important;text-align: justify;"><span style="font-size: 14px;">站在巨人的肩膀上。—— 艾萨克·牛顿</span></p></blockquote><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="font-size: 16px;">Chromium/base 库一直在 <strong style="box-sizing: border-box;user-select: text !important;">迭代、优化</strong>，<strong style="box-sizing: border-box;user-select: text !important;">学习、借鉴</strong> 许多其他优秀的开源项目。</span><span style="font-size: 16px;">例如，[sec|线程标记检查] 使用的标记就来源于 </span><a href="https://github.com/abseil/abseil-cpp" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="box-sizing: border-box;font-size: 16px;">abseil</span></code></a><span style="font-size: 16px;">。</span></p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">由于 Chromium/base 改动频繁，本文某些细节 <strong style="box-sizing: border-box;user-select: text !important;">可能会过期</strong>。如果有什么新发现，<strong style="box-sizing: border-box;user-select: text !important;">欢迎补充</strong>~ 😉</p><p><br/></p><p style="text-align: center;"><img class="rich_pages" data-ratio="0.729264475743349" data-src="https://mmbiz.qpic.cn/mmbiz_gif/j3gficicyOvatricjRxhpM1x45aB6doaVg7WMhINPwOiaqpskia1kH7hgibO0dicW2HLcW8HRGMzESQwehIcyckLXtwsA/640?wx_fmt=gif" data-type="gif" data-w="639" style="" src="../Images/73ce1e331a81f047666a0397bddd08e2.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_gif/j3gficicyOvatricjRxhpM1x45aB6doaVg7WMhINPwOiaqpskia1kH7hgibO0dicW2HLcW8HRGMzESQwehIcyckLXtwsA/640?wx_fmt=gif"/></p>
