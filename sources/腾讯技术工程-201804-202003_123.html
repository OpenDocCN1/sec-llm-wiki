<h1>漫谈 C++ 的各种检查</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MjM5ODYwMjI2MA==&amp;mid=2649744319&amp;idx=1&amp;sn=0310caf84717ab4578a04f56d1649a89&amp;chksm=bed370c489a4f9d2b30e00c58b99efd6b21c715a00b18495768c7c90d17a4bcb4019bf6d3e54&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/s?__biz=MjM5ODYwMjI2MA==&amp;mid=2649744319&amp;idx=1&amp;sn=0310caf84717ab4578a04f56d1649a89&amp;chksm=bed370c489a4f9d2b30e00c58b99efd6b21c715a00b18495768c7c90d17a4bcb4019bf6d3e54&amp;scene=27#wechat_redirect</a></blockquote><figure style="box-sizing: border-box;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 16px;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;" data-mpa-powered-by="yiban.io"/><p><span style="caret-color: rgba(0, 0, 0, 0.298039);color: rgba(0, 0, 0, 0.298039);font-family: -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;letter-spacing: 0.5440000295639038px;text-align: start;">以下文章来源于BOTManJL</span><span style="caret-color: rgba(0, 0, 0, 0.298039);color: rgba(0, 0, 0, 0.298039);font-family: -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;letter-spacing: 0.5440000295639038px;text-align: start;background-color: rgb(255, 255, 255);"> </span><span style="caret-color: rgba(0, 0, 0, 0.298039);color: rgba(0, 0, 0, 0.298039);font-family: -apple-system-font, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;letter-spacing: 0.5440000295639038px;text-align: start;">，作者BOT Man</span></p><p style="text-align: center;"><img class="rich_pages" data-ratio="0.1575" data-src="https://mmbiz.qpic.cn/mmbiz_gif/j3gficicyOvasIjZpiaTNIPReJVWEJf7UGpmokI3LL4NbQDb8fO48fYROmYPXUhXFN8IdDqPcI1gA6OfSLsQHxB4w/640?wx_fmt=gif" data-type="gif" data-w="400" style="" src="../Images/14a3977d80248b2b97b4e3468e87af85.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_gif/j3gficicyOvasIjZpiaTNIPReJVWEJf7UGpmokI3LL4NbQDb8fO48fYROmYPXUhXFN8IdDqPcI1gA6OfSLsQHxB4w/640?wx_fmt=gif"/></p><p><br/></p><figure style="box-sizing: border-box;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 16px;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"/><figure style="box-sizing: border-box;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 16px;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><br/></figure><figure style="box-sizing: border-box;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 16px;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><br/></figure><blockquote style="box-sizing: border-box;color: rgb(62, 71, 83);font-size: 18px;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><section style="box-sizing: border-box;margin-right: 8px;margin-bottom: 1em;margin-left: 8px;font-family: 微软雅黑;font-size: 16px;text-align: justify;line-height: normal;"><span style="font-size: 14px;">What you don't use you don't pay for. (zero-overhead principle) </span></section><section style="box-sizing: border-box;margin-right: 8px;margin-bottom: 1em;margin-left: 8px;font-family: 微软雅黑;font-size: 16px;text-align: right;line-height: normal;"><span style="font-size: 14px;">    —— Bjarne Stroustrup</span></section></blockquote><p><span class="" style="box-sizing: border-box;color: rgb(0, 0, 0);user-select: text !important;"><strong mpa-is-content="t" mpa-from-tpl="t" style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;"><strong mpa-from-tpl="t" mpa-is-content="t" style="box-sizing: border-box;user-select: text !important;"><br/></strong></strong></span></p><blockquote mpa-from-tpl="t" mpa-is-content="t" style="box-sizing: border-box;margin-top: 10px;margin-right: 10px;margin-bottom: 18px;padding-left: 6px;color: rgb(62, 71, 83);border-left-width: 5.5px;border-left-color: rgb(3, 124, 230);font-size: 18px;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);unicode-bidi: embed;user-select: text !important;"><span class="" style="box-sizing: border-box;color: rgb(0, 0, 0);user-select: text !important;"><strong mpa-is-content="t" mpa-from-tpl="t" style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;"><strong mpa-from-tpl="t" mpa-is-content="t" style="box-sizing: border-box;user-select: text !important;"><strong mpa-is-content="t" mpa-from-tpl="t" style="font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 18px;white-space: normal;background-color: rgb(255, 255, 255);box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;"><strong mpa-from-tpl="t" mpa-is-content="t" style="box-sizing: border-box;user-select: text !important;"><strong style="box-sizing: border-box;user-select: text !important;">背景阅读</strong></strong></strong></strong></strong></span></blockquote><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">在学习了 <a href="https://github.com/chromium/chromium/tree/master/base" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">Chromium/base 库</a>（<a href="http://md.aclickall.com/Chromium-Base-Notes.md" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">笔记</a>）后，我体会到了一般人和 <strong style="box-sizing: border-box;user-select: text !important;">优秀工程师</strong> 的差距 —— 拥有较高的个人素质固然重要，但更重要的是能 <strong style="box-sizing: border-box;user-select: text !important;">降低开发门槛</strong>，让其他人更快的融入团队，一起协作（尤其像 Chromium <strong style="box-sizing: border-box;user-select: text !important;">开源项目</strong> 由社区维护，开发者水平参差不齐）。</p><blockquote style="box-sizing: border-box;color: rgb(62, 71, 83);font-size: 18px;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><p style="box-sizing: border-box;margin-right: 8px;margin-bottom: 1em;margin-left: 8px;font-family: 微软雅黑;font-size: 16px;line-height: 1.75;user-select: text !important;text-align: justify;"><span style="font-size: 14px;">没吃过猪肉，但见过猪跑。🙃</span></p></blockquote><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">项目中，降低开发门槛的方法有很多：除了 制定 <strong style="box-sizing: border-box;user-select: text !important;">代码规范</strong>、划分 <strong style="box-sizing: border-box;user-select: text !important;">功能模块</strong>、完善 <strong style="box-sizing: border-box;user-select: text !important;">单元测试</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(unit test)</em>、推行 <strong style="box-sizing: border-box;user-select: text !important;">代码审查</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(code review)</em>、整理 <strong style="box-sizing: border-box;user-select: text !important;">相关文档</strong> 之外，针对强类型的编译语言 C++，Chromium/base 库加入了大量的 <strong style="box-sizing: border-box;user-select: text !important;">检查</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(check)</em>。</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">为什么代码中需要各种检查？在 C++ 中调用一个函数、使用一个类、实例化一个模板时，对传入的参数、使用的时机，往往会有很多 <strong style="box-sizing: border-box;user-select: text !important;">限制</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(constraint/restriction)</em>（例如，数值参数不能传入负数、对象的访问不是线程安全的、函数调用不能重入）；而处理限制的方法有很多：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><span style="font-size: 16px;">口口相传：在 <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">代码审查</strong> 时，有经验的开发者 向 新手开发者 传授经验（很容易失传）</span></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">文档说明：在 <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">相关文档</strong> 中，提示使用者 功能模块的各种隐含限制（很容易被忽略）</span></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">检查限制：在合理划分 <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">功能模块</strong> 的前提下，对模块的隐含限制 进行检查，并加入针对检查的 <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">单元测试</strong>（最安全的保障，单元测试即文档）</span></p></li></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">本文主要分享 Chromium/base 库中使用的一些限制检查。</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><br/></p><blockquote mpa-from-tpl="t" mpa-is-content="t" style="box-sizing: border-box;margin-top: 10px;margin-right: 10px;margin-bottom: 18px;padding-left: 6px;color: rgb(62, 71, 83);border-left-width: 5.5px;border-left-color: rgb(3, 124, 230);font-size: 18px;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);unicode-bidi: embed;user-select: text !important;"><span class="" style="box-sizing: border-box;color: rgb(0, 0, 0);user-select: text !important;"><strong mpa-is-content="t" mpa-from-tpl="t" style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;"><strong mpa-from-tpl="t" mpa-is-content="t" style="box-sizing: border-box;user-select: text !important;"><strong style="box-sizing: border-box;user-select: text !important;">漫谈 C++ 的各种检查</strong>  </strong></strong></span></blockquote><h2 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(3, 124, 230);font-size: 17px;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="box-sizing: border-box;user-select: text !important;">1 编译时检查</span></h2><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">编译时静态检查，主要依靠 C++ 语言提供的 <strong style="box-sizing: border-box;user-select: text !important;">语法支持</strong>/<strong style="box-sizing: border-box;user-select: text !important;">静态断言</strong> 和 <strong style="box-sizing: border-box;user-select: text !important;">编译器扩展</strong> 实现 —— 在检查失败的情况下，编译失败。</p><h3 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="box-sizing: border-box;user-select: text !important;">1.1 测试设施</span></h3><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">如何确保代码中添加的检查有效呢？最高效的方法是：为 “检查” 添加单元测试。但对于 编译时检查 遇到了一个 <strong style="box-sizing: border-box;user-select: text !important;">难点</strong> —— 如果检查失败，那么编译就无法通过。</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">为此，Chromium 支持 <a href="https://dev.chromium.org/developers/testing/no-compile-tests" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">编译失败测试 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(no-compile test)</em></a>：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><span style="font-size: 16px;">单元测试文件中，每个用例通过 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">#ifdef</span></code><span style="font-size: 16px;"> 切割</span></p></li><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">每个用例中，标明 编译失败后期望的 报错细节</span></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">通过 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">#define</span></code><span style="font-size: 16px;"> 运行各个用例</span></p></li><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">在编译失败后，检查 报错细节 是否和预期一致</span><span style="box-sizing: border-box;user-select: text !important;"/></p></li></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">对应的单元测试文件后缀为 <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">*_unittest.nc</code>，通过 <a href="https://github.com/chromium/chromium/blob/master/build/nocompile.gni" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">nocompile.gni</code></a> 加入单元测试工程。</p><h3 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="box-sizing: border-box;user-select: text !important;">1.2 可拷贝性检查</span></h3><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">C++ 语言本身有很多编译时检查（例如 类的成员访问控制 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(member access control)</em>、<code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">const</code> 关键字 在编译成汇编语言后，不能反编译还原），但 C++ 对象默认是可拷贝的，从而带来了许多问题（参考 <a href="http://md.aclickall.com/2018/Resource-Management.md#%E8%B5%84%E6%BA%90%E5%92%8C%E5%AF%B9%E8%B1%A1%E7%9A%84%E6%98%A0%E5%B0%84%E5%85%B3%E7%B3%BB" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">资源管理小记</a>）。</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">尤其是 <strong style="box-sizing: border-box;user-select: text !important;">多态</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(polymorphic)</em> 类的默认拷贝行为，一般都不符合预期：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><a href="https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rc-copy-virtual" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">C.67: A polymorphic class should suppress copying</span></a></p></li><li><p style="text-align: justify;"><a href="https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rh-copy" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">C.130: For making deep copies of polymorphic classes prefer a virtual clone function instead of copy construction/assignment</span></a></p></li></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">为此，Chromium 提供了两个 <a href="https://github.com/chromium/chromium/blob/master/base/macros.h" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">常用的宏</a>：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">DISALLOW_COPY_AND_ASSIGN</span></code><span style="font-size: 16px;"> 用于禁用类的 拷贝构造函数 和 拷贝赋值函数</span></p></li><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">DISALLOW_IMPLICIT_CONSTRUCTORS</span></code><span style="font-size: 16px;"> 用于禁用类的 默认构造函数 和 拷贝行为</span></p></li></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">由于 Chromium 大量使用了 C++ 的多态特性，这些宏随处可见。</p><h3 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="box-sizing: border-box;user-select: text !important;">1.3 参数类型检查</span></h3><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">Chromium 还基于 <a href="http://md.aclickall.com/2017/Cpp-Metaprogramming.md" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">现代 C++ 元编程</a> 技术，通过 <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">static_assert</code> 进行静态断言。</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: left;white-space: normal;background-color: rgb(255, 255, 255);">在之前写的 <a href="http://md.aclickall.com/Inside-Cpp-Callback.md" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">深入 C++ 回调</a> 中分析了：</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: left;white-space: normal;background-color: rgb(255, 255, 255);"> Chromium 的<code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">base::Callback &lt;&gt;</code> + </p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">base::Bind()</code> 回调机制，提到了相关的静态断言检查。</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">base::Bind</code> 为了 <a href="http://md.aclickall.com/Inside-Cpp-Callback.md#%E5%A6%82%E4%BD%95%E5%A4%84%E7%90%86%E5%A4%B1%E6%95%88%E7%9A%84%EF%BC%88%E5%BC%B1%E5%BC%95%E7%94%A8%EF%BC%89%E4%B8%8A%E4%B8%8B%E6%96%87" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">处理失效的（弱引用）上下文</a>，针对弱引用指针<a href="https://github.com/chromium/chromium/blob/master/base/memory/weak_ptr.h" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">base::WeakPtr</code></a>扩展了<code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">base::IsWeakReceiver</code>检查，判断弱引用的上下文是否有效；并通过静态断言检查传入参数，<strong style="box-sizing: border-box;user-select: text !important;">强制要求使用者遵循</strong> 弱引用检查的规范：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::Bind</span></code><span style="font-size: 16px;"> 不允许直接将 <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">`this` 指针</strong> 绑定到 类的成员函数 上，因为 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">this</span></code><span style="font-size: 16px;"> 裸指针可能失效 变成野指针</span></p></li><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::Bind</span></code><span style="font-size: 16px;"> 不允许绑定 <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">lambda 表达式</strong>，因为 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::Bind</span></code><span style="font-size: 16px;"> 无法检查 lambda 表达式捕获的 弱引用 的 有效性</span></p></li><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::Bind</span></code><span style="font-size: 16px;"> 只允许将 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::WeakPtr</span></code><span style="font-size: 16px;"> 指针绑定到 <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">没有返回值的</strong>（返回 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">void</span></code><span style="font-size: 16px;">）类的成员函数 上，因为 当弱引用失效时不调用回调，也没有返回值</span></p></li></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">base::Callback</code>区分<a href="http://md.aclickall.com/Inside-Cpp-Callback.md#%E5%9B%9E%E8%B0%83%E5%8F%AA%E8%83%BD%E6%89%A7%E8%A1%8C%E4%B8%80%E6%AC%A1%E8%BF%98%E6%98%AF%E5%8F%AF%E4%BB%A5%E5%A4%9A%E6%AC%A1" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">回调只能执行一次还是可以多次</a>，通过引用限定符 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(reference qualifier)</em> <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">&amp;&amp;</code> / <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">const &amp;</code>，区分在对象处于 非 const 右值 / 其他状态时的 <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">Run</code> 成员函数，只允许一次回调 <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">base::OnceCallback</code> 在非 const 右值状态下调用 <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">Run</code> 函数，保证严谨的 <a href="http://md.aclickall.com/2018/Resource-Management.md#%E8%B5%84%E6%BA%90%E5%92%8C%E5%AF%B9%E8%B1%A1%E7%9A%84%E6%98%A0%E5%B0%84%E5%85%B3%E7%B3%BB" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">资源管理语义</a>：</p><pre style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: Roboto, &quot;Courier New&quot;, Consolas, Inconsolata, Courier, monospace;text-align: start;background-color: rgb(255, 255, 255);user-select: text !important;"><code class="cpp language-cpp hljs" style="box-sizing: border-box;margin: auto 5px;padding: 0.5em;color: rgb(56, 58, 66);font-family: Consolas, Inconsolata, Courier, monospace;border-radius: 2px;display: block;overflow-x: auto;background: rgb(250, 250, 250);user-select: text !important;overflow-wrap: normal !important;word-break: normal !important;overflow-y: auto !important;text-align: justify;">base::OnceClosure cb; <span class="hljs-built_in" style="box-sizing: border-box;color: rgb(193, 132, 1);user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;">std</span>::move(cb).Run();        <span class="hljs-comment" style="box-sizing: border-box;color: rgb(160, 161, 167);font-style: italic;user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;">// OK</span><br style="box-sizing: border-box;user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;"/>base::OnceClosure cb; cb.Run();                   <span class="hljs-comment" style="box-sizing: border-box;color: rgb(160, 161, 167);font-style: italic;user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;">// not compile</span><br style="box-sizing: border-box;user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;"/><span class="hljs-keyword" style="box-sizing: border-box;color: rgb(166, 38, 164);user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;">const</span> base::OnceClosure cb; cb.Run();             <span class="hljs-comment" style="box-sizing: border-box;color: rgb(160, 161, 167);font-style: italic;user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;">// not compile</span><br style="box-sizing: border-box;user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;"/><span class="hljs-keyword" style="box-sizing: border-box;color: rgb(166, 38, 164);user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;">const</span> base::OnceClosure cb; <span class="hljs-built_in" style="box-sizing: border-box;color: rgb(193, 132, 1);user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;">std</span>::move(cb).Run();  <span class="hljs-comment" style="box-sizing: border-box;color: rgb(160, 161, 167);font-style: italic;user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;">// not compile</span><br style="box-sizing: border-box;user-select: text !important;overflow-wrap: inherit !important;word-break: inherit !important;"/></code></pre><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">另外，静态断言检查还广泛应用在 Chromium/base 的<strong style="box-sizing: border-box;user-select: text !important;">容器</strong>、<strong style="box-sizing: border-box;user-select: text !important;">智能指针</strong> 模板的实现中，用于生成<a href="http://md.aclickall.com/2017/Cpp-Metaprogramming.md#%E5%AE%9E%E4%BE%8B%E5%8C%96%E9%94%99%E8%AF%AF" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">可读性更好的</a><strong style="box-sizing: border-box;user-select: text !important;">实例化错误信息</strong>。</p><h3 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="box-sizing: border-box;user-select: text !important;">1.4 线程标记检查</span></h3><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">最新的 Chromium 使用了 Clang 编译，通过扩展 <strong style="box-sizing: border-box;user-select: text !important;">线程标记</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(thread annotation)</em>，<a href="https://clang.llvm.org/docs/ThreadSafetyAnalysis.html" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">静态分析线程安全问题</a>。（参考：<a href="https://llvm.org/devmtg/2011-11/Hutchins_ThreadSafety.pdf" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">Thread Safety Annotations for Clang - DeLesley Hutchins</a>）</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: left;white-space: normal;background-color: rgb(255, 255, 255);">Chromium/base 的单元测试文件 ：</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><a href="https://github.com/chromium/chromium/blob/master/base/thread_annotations_unittest.nc" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">thread_annotations_unittest.nc</code></a> 描述了一些 锁的错误使用场景（假设数据 data 被锁 lock 保护，定义标记为 Type data GUARDED_BY(lock);）：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">访问 data 之前，忘记获取 lock</span></p></li><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">获取 lock 之后，忘记释放 lock</span><span style="box-sizing: border-box;user-select: text !important;"/></p></li></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">这些错误能在编译时被 Clang 检查到，从而编译失败。</p><h2 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(3, 124, 230);font-size: 17px;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="box-sizing: border-box;user-select: text !important;">2 运行时检查</span></h2><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">运行时动态检查，主要基于 Chromium/base 库提供的 <strong style="box-sizing: border-box;user-select: text !important;">断言 <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">DCHECK</code>/<code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">CHECK</code></strong> 实现 —— 如果断言失败，运行着的程序会立即终止。</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">其中，<code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">DCHECK</code> 只对调试版 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(debug)</em> 有效，而 <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">CHECK</code> 也可用于发布版 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(release)</em> —— 从而避免在发布版进行无用的检查。</p><h3 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="box-sizing: border-box;user-select: text !important;">2.1 测试设施</span></h3><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">检查的方法很直观 —— 构造一个检查失败的场景，期望断言失败。</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: left;white-space: normal;background-color: rgb(255, 255, 255);">Chromium/base 基础设施中的<code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">EXPECT_DCHECK_DEATH</code><span style="text-align: justify;">提供了这个功能，对应的单元测试文件后缀为 </span><code style="text-align: justify;box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-top-left-radius: 2px;border-top-right-radius: 2px;border-bottom-right-radius: 2px;border-bottom-left-radius: 2px;display: inline;">*_unittest.cc</code><span style="text-align: justify;">。</span></p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: left;white-space: normal;background-color: rgb(255, 255, 255);"><span style="text-align: justify;"/></p><h3 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="box-sizing: border-box;user-select: text !important;">2.2 数值溢出检查</span></h3><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">C++ 的数值类型，都是固定大小的<a href="https://en.cppreference.com/w/cpp/language/type" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">标量类型</a> —— 如果存储数值超出范围，会导致<strong style="box-sizing: border-box;user-select: text !important;">溢出</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(overflow)</em>。</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">例如，尝试通过 <strong style="box-sizing: border-box;user-select: text !important;">使用无符号数 避免出现负数</strong>，往往是一个典型的徒劳之举。（比如 <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">unsigned(0) - unsigned(1) == UINT_MAX</code>，参考 <a href="https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Res-nonnegative" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">ES.106: Don’t try to avoid negative values by using <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">unsigned</code></a>）</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">为此，Chromium 的 <a href="https://github.com/chromium/chromium/tree/master/base/numerics" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">base/numerics</a> 提供了一个 无依赖 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(dependency-free)</em>、仅头文件 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(header-only)</em> 的模板库，处理数值溢出问题：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::StrictNumeric</span></code><span style="font-size: 16px;">/</span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::strict_cast&amp;lt;&amp;gt;()</span></code><span style="font-size: 16px;"> <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">编译时 阻止溢出</strong> —— 如果 类型转换 有溢出的可能性，通过静态断言报错</span></p></li><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::CheckedNumeric</span></code><span style="font-size: 16px;">/</span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::checked_cast&amp;lt;&amp;gt;()</span></code><span style="font-size: 16px;"> <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">运行时 检查溢出</strong> —— 如果 数值运算/类型转换 出现溢出，立即终止程序</span></p></li><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::ClampedNumeric</span></code><span style="font-size: 16px;">/</span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::saturated_cast&amp;lt;&amp;gt;()</span></code><span style="font-size: 16px;"> <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">运行时 截断运算</strong> —— 如果 数值运算/类型转换 出现溢出，对计算结果 <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">截断</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(non-sticky saturating)</em> 处理</span></p></li></ul><h3 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="box-sizing: border-box;user-select: text !important;">2.3 线程相关检查</span></h3><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">最新的 Chromium/base 线程模型引入了线程池，并支持了<strong style="box-sizing: border-box;user-select: text !important;">序列</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(sequence)</em> 的概念 —— 相对于线程池中的普通任务乱序调度，同一序列的任务 能保证被顺序调度 —— 因此，<a href="https://github.com/chromium/chromium/blob/master/docs/threading_and_tasks.md#prefer-sequences-to-physical-threads" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">推荐使用逻辑序列 而不是物理线程</a>：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">同一物理线程 只能同时运行 一个逻辑序列，使得 序列模型 等效于 单线程模型</span></p></li><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">同一物理线程 可以用于运行 多个逻辑序列，提高 物理线程 的利用率</span><span style="box-sizing: border-box;user-select: text !important;"/></p></li></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">线程/序列 相关的检查主要依赖于 <strong style="box-sizing: border-box;user-select: text !important;">线程/序列 本地存储</strong>：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: left;"><span style="font-size: 16px;">每个线程有独立的 </span><a href="https://github.com/chromium/chromium/blob/master/base/threading/thread_local_storage.h" style="box-sizing: border-box;font-size: 16px;user-select: text !important;" data-linktype="2"><span style="font-size: 16px;">`base::ThreadLocalStorage`</span></a><span style="font-size: 16px;"> </span></p><p style="text-align: justify;"><span style="font-size: 16px;">线程本地存储 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(thread local storage, TLS)</em><em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;"/></span></p></li><li><p style="text-align: left;"><span style="font-size: 16px;">每个序列有独立的 </span><a href="https://github.com/chromium/chromium/blob/master/base/threading/sequence_local_storage_slot.h" style="box-sizing: border-box;font-size: 16px;user-select: text !important;" data-linktype="2"><span style="font-size: 16px;">`base::SequenceLocalStorageSlot`</span></a><span style="font-size: 16px;"> </span></p><p style="text-align: justify;"><span style="font-size: 16px;">序列本地存储 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(sequence local storage, SLS)</em><em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;"/></span></p></li><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">当 逻辑序列 被放到 物理线程 上执行时，把当前序列的 SLS 关联到 执行线程的 TLS</span><span style="box-sizing: border-box;user-select: text !important;"/></p></li></ul><h4 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(62, 71, 83);font-size: 0.9em;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><strong><span style="color: rgb(0, 0, 0);"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">2.3.1 线程安全检查</span><span style="box-sizing: border-box;user-select: text !important;"/></span></strong></h4><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">很多时候，某个对象只会在 <strong style="box-sizing: border-box;user-select: text !important;">同一线程/序列</strong> 中 <strong style="box-sizing: border-box;user-select: text !important;">创建/访问/销毁</strong>：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><span style="font-size: 16px;">正常情况下，<strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">无竞争</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(contention-free)</em> 模型没必要保证 <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">线程安全</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(thread-safety)</em>，因为 线程同步操作/原子操作 会带来 <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">不必要的开销</strong><strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;"/></span></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">异常情况下，一旦被 多线程同时使用，访问冲突导致 <strong style="box-sizing: border-box;color: rgb(62, 71, 83);user-select: text !important;">数据竞争</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(data race)</em>，可能出现 未定义行为</span></p></li></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: left;white-space: normal;background-color: rgb(255, 255, 255);">为此，Chromium 借助：</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);"><a href="https://github.com/chromium/chromium/blob/master/base/threading/thread_checker.h" data-linktype="2" style="box-sizing: border-box;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="box-sizing: border-box;font-size: 15px;">base::ThreadChecker</span></code></a><span style="font-size: 15px;">/</span><a href="https://github.com/chromium/chromium/blob/master/base/sequence_checker.h" data-linktype="2" style="box-sizing: border-box;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="box-sizing: border-box;font-size: 15px;">base::SequenceChecker</span><span style="box-sizing: border-box;"/></code></a></p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: left;white-space: normal;background-color: rgb(255, 255, 255);"><strong style="box-sizing: border-box;user-select: text !important;">检查对象是否只在 同一线程/序列 中使用</strong>：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">[THREAD|SEQUENCE]_CHECKER(checker)</span></code><span style="font-size: 16px;"> 创建并关联 线程/序列 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">checker</span></code></p></li><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">DCHECK_CALLED_ON_VALID_</span><a href="http://md.aclickall.com/checker" style="box-sizing: border-box;font-size: 16px;user-select: text !important;" data-linktype="2"><span style="font-size: 16px;">THREAD|SEQUENCE</span></a></code><span style="font-size: 16px;"> 检查或关联 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">checker</span></code><span style="font-size: 16px;"> 和 当前执行环境的 线程/序列</span></p></li><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">DETACH_FROM_</span><a href="http://md.aclickall.com/checker" style="box-sizing: border-box;font-size: 16px;user-select: text !important;" data-linktype="2"><span style="font-size: 16px;">THREAD|SEQUENCE</span></a></code><span style="font-size: 16px;"> 解除 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">checker</span></code><span style="font-size: 16px;"> 和 线程/序列 的关联</span></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">另外，发布版的检查实现为 </span><a href="https://en.wikipedia.org/wiki/Null_object_pattern" style="box-sizing: border-box;font-size: 16px;user-select: text !important;" data-linktype="2"><span style="font-size: 16px;">空对象</span></a><span style="font-size: 16px;">，即总能通过检查</span></p></li></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">实现的 <strong style="box-sizing: border-box;user-select: text !important;">核心思想</strong> 非常简单：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">线程/序列 创建时，通过 TLS/SLS 记录 当前线程/序列的 ID（例如 线程 ID、序列 ID）</span></p></li><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">checker</span></code><span style="font-size: 16px;"> 构造时，记录 当前线程/序列的 ID</span></p></li><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">checker</span></code><span style="font-size: 16px;"> 检查时，读取 当前线程/序列的 ID，和 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">checker</span></code><span style="font-size: 16px;"> 记录的 ID 比较</span></p></li><li><p style="text-align: justify;"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">checker</span></code><span style="font-size: 16px;"> 析构时，先执行检查（可以提前 解除关联）</span></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">另外，</span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">checker</span></code><span style="font-size: 16px;"> 读写 数据成员时，需要进行互斥的 线程同步操作（锁）</span></p></li></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">在[sec|通知迭代检查] 提到，<code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">base::ObserverList</code>借助 <code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;">iteration_sequence_checker_</code> 在迭代时检查 对象操作 是否线程/序列安全。</p><h4 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(62, 71, 83);font-size: 0.9em;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><strong><span style="box-sizing: border-box;font-size: 16px;color: rgb(0, 0, 0);user-select: text !important;">2.3.2 线程限制检查</span></strong><span style="box-sizing: border-box;font-size: 16px;color: rgb(62, 71, 83);user-select: text !important;"/><span style="box-sizing: border-box;user-select: text !important;"/></h4><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">程序中常常会有一些 <strong style="box-sizing: border-box;user-select: text !important;">特殊用途的线程</strong>（例如 客户端 UI 主线程），而这些线程往往有着 <strong style="box-sizing: border-box;user-select: text !important;">特殊的限制</strong>（例如，UI 线程要求保持 <strong style="box-sizing: border-box;user-select: text !important;">响应性</strong> <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(responsive)</em>，<a href="https://github.com/chromium/chromium/blob/master/docs/threading_and_tasks.md#keeping-the-browser-responsive" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">实时响应用户输入</a>）。</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">为此，Chromium 借助 ：</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><a href="https://github.com/chromium/chromium/blob/master/base/threading/thread_restrictions.h" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="box-sizing: border-box;font-size: 16px;">base::ThreadRestrictions</span></code></a> <strong style="box-sizing: border-box;user-select: text !important;">检查可能涉及线程限制的函数在当前执行的线程上是否允许</strong>：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><span style="font-size: 16px;">阻塞 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(blocking)</em> 操作</span></p></li><ul class=" list-paddingleft-2" style="list-style-type: square;"><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">主要包括文件 I/O 操作（有可能被系统缓存，从而不阻塞）</span></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;box-sizing: border-box;user-select: text !important;">可能导致线程 交出 CPU 执行机会，进入 wait 状态</span></p></li></ul><li><p style="text-align: justify;"><span style="font-size: 16px;">同步原语 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(sync primitive)</em><em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;"/></span></p></li><ul class=" list-paddingleft-2" style="list-style-type: square;"><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">执行 线程同步操作</span></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">可能导致程序 死锁 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(deadlock)</em>/卡顿 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(jank)</em><em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;"/></span></p></li></ul><li><p style="text-align: justify;"><span style="font-size: 16px;">CPU 密集工作 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(CPU intensive work)</em><em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;"/></span></p></li><ul class=" list-paddingleft-2" style="list-style-type: square;"><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">超过 100ms CPU 时间的操作</span></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">可能导致程序 卡顿 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(jank)</em><em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;"/></span></p></li></ul><li><p style="text-align: justify;"><span style="font-size: 16px;">单例 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(singleton)</em> 操作</span></p></li><ul class=" list-paddingleft-2" style="list-style-type: square;"><li><p style="text-align: justify;"><span style="font-size: 16px;">对于 非泄露型 </span><a href="https://github.com/chromium/chromium/blob/master/base/memory/singleton.h" style="box-sizing: border-box;font-size: 16px;user-select: text !important;" data-linktype="2"><span style="font-size: 16px;">`base::Singleton`</span></a><span style="font-size: 16px;">，会在 </span><a href="https://github.com/chromium/chromium/blob/master/base/at_exit.h" style="box-sizing: border-box;font-size: 16px;user-select: text !important;" data-linktype="2"><span style="font-size: 16px;">`base::AtExitManager`</span></a><span style="font-size: 16px;"> 注册 “退出时销毁单例对象”</span></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">如果主线程先退出，在 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::AtExitManager</span></code><span style="font-size: 16px;"> 中销毁单例，导致仍在运行的 non-joinable 线程再访问单例时，出现野指针崩溃</span></p></li></ul></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">实现的 <strong style="box-sizing: border-box;user-select: text !important;">核心思想</strong> 也很简单：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><span style="font-size: 16px;">通过 TLS 记录 当前线程的限制情况（每种限制用一个 TLS </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">bool</span></code><span style="font-size: 16px;"> 存储）</span></p></li><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">对于 可能涉及限制的函数，调用前先检查 当前线程 是否允许某个限制</span><span style="box-sizing: border-box;user-select: text !important;"/></p></li></ul><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="font-size: 16px;">在最新的Chromium/base 中，线程限制检查被进一步封装为：</span></p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="font-size: 16px;"/><a href="https://github.com/chromium/chromium/blob/master/base/threading/scoped_blocking_call.h" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="box-sizing: border-box;font-size: 16px;">base::ScopedBlockingCall</span></code></a><span style="font-size: 16px;">，并应用于大量文件 I/O 相关函数中。</span></p><h4 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(62, 71, 83);font-size: 0.9em;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><strong><span style="box-sizing: border-box;font-size: 16px;color: rgb(0, 0, 0);user-select: text !important;">2.3.3 死锁检查</span></strong><span style="box-sizing: border-box;user-select: text !important;"/></h4><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: left;white-space: normal;background-color: rgb(255, 255, 255);"><span style="font-size: 16px;">Chromium 通过 </span><a href="https://github.com/chromium/chromium/blob/master/base/task/common/checked_lock.h" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="box-sizing: border-box;font-size: 16px;">base::internal::CheckedLock</span></code></a></p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="font-size: 16px;">检查 死锁 <em style="box-sizing: border-box;color: rgb(86, 86, 86);user-select: text !important;">(deadlock)</em>。</span></p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">实现的 <strong style="box-sizing: border-box;user-select: text !important;">核心思想</strong> 非常简单 —— <strong style="box-sizing: border-box;user-select: text !important;">检查等待链是否成环</strong>：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">维护一个 全局的 &lt;从每个 lock 到其 predecessor lock&gt; 映射表（创建时添加，销毁时移除）</span></p></li><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">维护一个 当前线程的 &lt;已获取 lock&gt; 列表（TLS 存储；获取时记录，释放时移除）</span></p></li><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">创建时，断言 predecessor 已创建（如果 predecessor 不存在，可能顺序错误）</span></p></li><li><p style="text-align: justify;"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">获取时，断言 predecessor 是当前线程最近获取的 lock（若不是，可能顺序错误）</span></p></li></ul><h3 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(0, 0, 0);font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="box-sizing: border-box;user-select: text !important;">2.4 观察者模式检查</span></h3><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">在之前写的 <a href="http://md.aclickall.com/Insane-Observer-Pattern.md" style="box-sizing: border-box;user-select: text !important;" data-linktype="2">令人抓狂的观察者模式</a> 中，介绍了如何通过 ：</p><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="font-size: 16px;">Chromium/base 提供的</span><a href="https://github.com/chromium/chromium/blob/master/base/observer_list.h" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="box-sizing: border-box;font-size: 16px;">base::ObserverList</span></code></a><span style="font-size: 16px;">，检查观察者模式的一些潜在问题。</span></p><h4><strong><span style="box-sizing: border-box;color: rgb(0, 0, 0);user-select: text !important;">2.4.1 生命周期检查</span></strong><span style="box-sizing: border-box;user-select: text !important;"/></h4><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;">由于观察者和被观察者的生命周期往往是解耦的，所以总会出现一些阴差阳错的问题：</p><ul style="" class=" list-paddingleft-2"><li><p style="text-align: justify;"><a href="http://md.aclickall.com/Insane-Observer-Pattern.md#%E9%97%AE%E9%A2%98-%E8%A7%82%E5%AF%9F%E8%80%85%E5%85%88%E9%94%80%E6%AF%81" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">观察者先销毁</span></a></p></li><ul class=" list-paddingleft-2" style="list-style-type: square;"><li><p style="text-align: justify;"><span style="font-size: 16px;">问题：若 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::ObserverList</span></code><span style="font-size: 16px;"> 通知时不检查 观察者是否有效，可能导致 野指针崩溃</span></p></li><li><p style="text-align: left;"><span style="font-size: 16px;">解决：观察者继承于 </span><span style="box-sizing: border-box;font-size: 16px;"><a href="https://github.com/chromium/chromium/blob/master/base/observer_list_types.h" style="box-sizing: border-box;font-size: 16px;user-select: text !important;" data-linktype="2">`base::CheckedObserver`</a></span></p><p style="text-align: left;"><span style="box-sizing: border-box;font-size: 16px;"/><span style="text-align: justify;font-size: 16px;">在通知前 </span><code style="text-align: justify;box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-top-left-radius: 2px;border-top-right-radius: 2px;border-bottom-right-radius: 2px;border-bottom-left-radius: 2px;display: inline;"><span style="font-size: 16px;">base::ObserverList</span></code><span style="text-align: justify;font-size: 16px;"> 检查观察者弱引用 </span><code style="text-align: justify;box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-top-left-radius: 2px;border-top-right-radius: 2px;border-bottom-right-radius: 2px;border-bottom-left-radius: 2px;display: inline;"><span style="font-size: 16px;">base::WeakPtr</span></code><span style="text-align: justify;font-size: 16px;"> 的有效性</span></p></li></ul><p style="text-align: justify;"><span style="font-size: 16px;"/></p><li><p style="text-align: justify;"><a href="http://md.aclickall.com/Insane-Observer-Pattern.md#%E9%97%AE%E9%A2%98-%E8%A2%AB%E8%A7%82%E5%AF%9F%E8%80%85%E5%85%88%E9%94%80%E6%AF%81" style="box-sizing: border-box;user-select: text !important;" data-linktype="2"><span style="box-sizing: border-box;font-size: 16px;user-select: text !important;">被观察者先销毁</span></a></p></li><ul class=" list-paddingleft-2" style="list-style-type: square;"><li><p style="text-align: justify;"><span style="font-size: 16px;">问题：若 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::ObserverList</span></code><span style="font-size: 16px;"> 销毁时不检查 观察者列表是否为空，可能导致 被观察者销毁后，观察者不能再移除（野指针崩溃）</span></p></li><li><p style="text-align: justify;"><span style="font-size: 16px;">解决：模板参数 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">check_empty</span></code><span style="font-size: 16px;"> 若为 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;color: rgb(62, 71, 83);font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">true</span></code><span style="font-size: 16px;">，在析构时断言 “观察者已被全部移除”</span></p></li></ul></ul><h4 style="box-sizing: border-box;margin-top: 1.5rem;margin-bottom: 10px;font-weight: bold;color: rgb(62, 71, 83);font-size: 0.9em;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><strong><span style="box-sizing: border-box;color: rgb(0, 0, 0);user-select: text !important;">2.4.2 通知迭代检查</span></strong><span style="box-sizing: border-box;user-select: text !important;"/></h4><p style="box-sizing: border-box;margin: 15px 8px 1em;color: rgb(62, 71, 83);font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;;font-size: 16px;line-height: 1.75;text-align: justify;white-space: normal;background-color: rgb(255, 255, 255);user-select: text !important;"><span style="font-size: 16px;">观察者可能在 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::ObserverList</span></code><span style="font-size: 16px;"> 通知时，再访问同一个 </span><code style="box-sizing: border-box;margin: auto 5px;font-size: 14px;font-family: 微软雅黑;white-space: pre-wrap;border-radius: 2px;display: inline;user-select: text !important;"><span style="font-size: 16px;">base::ObserverList</span></code><span style="font-size: 16px;"> 对象：</span></p><ul style="" class=" list-padding
