<h1>我在 MySQL 的那些年</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MjM5ODYwMjI2MA==&amp;mid=2649752813&amp;idx=2&amp;sn=11900abc8b6473c6f9522ab3df63701b&amp;chksm=becc979689bb1e80db9dd3ceff99d499930c22379e510e5d7e9a75483382ee1940c9a0d5c82c&amp;scene=27#wechat_redirect">http://mp.weixin.qq.com/s?__biz=MjM5ODYwMjI2MA==&amp;mid=2649752813&amp;idx=2&amp;sn=11900abc8b6473c6f9522ab3df63701b&amp;chksm=becc979689bb1e80db9dd3ceff99d499930c22379e510e5d7e9a75483382ee1940c9a0d5c82c&amp;scene=27#wechat_redirect</a></blockquote><section data-tool="mdnice&#x7F16;&#x8F91;&#x5668;" data-website="https://www.mdnice.com" style="" data-mpa-powered-by="yiban.io"><p style="text-align: center;"><img class="rich_pages" data-ratio="0.1575" data-src="https://mmbiz.qpic.cn/mmbiz_gif/j3gficicyOvasIjZpiaTNIPReJVWEJf7UGpmokI3LL4NbQDb8fO48fYROmYPXUhXFN8IdDqPcI1gA6OfSLsQHxB4w/640?wx_fmt=gif" data-type="gif" data-w="400" style="" src="../Images/14a3977d80248b2b97b4e3468e87af85.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_gif/j3gficicyOvasIjZpiaTNIPReJVWEJf7UGpmokI3LL4NbQDb8fO48fYROmYPXUhXFN8IdDqPcI1gA6OfSLsQHxB4w/640?wx_fmt=gif"/></p><figure data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;display: flex;flex-direction: column;justify-content: center;align-items: center;"><br/></figure><figure data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;display: flex;flex-direction: column;justify-content: center;align-items: center;"/><p data-tool="mdnice编辑器" style="">作者：赖铮（Allen Lai），前 MySQL 官方团队成员，专注数据库内核开发近二十年，先后就职于达梦，Teradata，北大方正以及 MySQL InnoDB 存储引擎团队，是达梦数据库内核，方正 XML 数据库，以及 MySQL InnoDB 的 GIS 支持，透明加密功能的主要开发者。现任腾讯 TEG 云架构平台部数据库团队专家工程师，负责腾讯云 CDB 数据库内核的研发。</p><figure data-tool="mdnice编辑器" style=""><img data-ratio="1.0080763582966226" data-src="https://mmbiz.qpic.cn/mmbiz_png/j3gficicyOvavaQIBO0fyJ0ln8SddnHR2SrDibCE6w4VG2EofsOL4sicj0wEcAgwEAoxk8vZDIls8tPQiaRPnDNl7Rw/640?wx_fmt=png" data-type="png" data-w="1362" style="margin: 10px auto;height: 320px;border-radius: 0px 0px 5px 5px;display: block;object-fit: contain;width: 318px;" src="../Images/3b8788a96743360f3cf6a1dedf0df595.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/j3gficicyOvavaQIBO0fyJ0ln8SddnHR2SrDibCE6w4VG2EofsOL4sicj0wEcAgwEAoxk8vZDIls8tPQiaRPnDNl7Rw/640?wx_fmt=png"/></figure><h4 data-tool="mdnice编辑器" style="font-weight: bold;font-size: 17px;color: rgb(14, 136, 235);margin-top: 10px;margin-bottom: 10px;"><br/></h4><figure data-tool="mdnice编辑器" style=""><img data-ratio="0.35083532219570407" data-src="https://mmbiz.qpic.cn/mmbiz_png/j3gficicyOvavaQIBO0fyJ0ln8SddnHR2S5CWJM9W1jh0pGMDibBD8SpJChAuTWjD8I6UNePcEiaSxSx4gTS4AWH1A/640?wx_fmt=png" data-type="png" data-w="1257" style="margin: 10px auto;height: 86px;border-radius: 0px 0px 5px 5px;display: block;object-fit: contain;width: 245px;" src="../Images/5818eb0df14d384fd4029d426a2651da.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/j3gficicyOvavaQIBO0fyJ0ln8SddnHR2S5CWJM9W1jh0pGMDibBD8SpJChAuTWjD8I6UNePcEiaSxSx4gTS4AWH1A/640?wx_fmt=png"/></figure><h4 data-tool="mdnice编辑器" style="font-weight: bold;font-size: 17px;color: rgb(14, 136, 235);margin-top: 10px;margin-bottom: 10px;"><br/><br/></h4><h4 data-tool="mdnice编辑器" style="font-weight: bold;font-size: 17px;color: rgb(14, 136, 235);margin-top: 10px;margin-bottom: 10px;"><span style="color: rgb(3, 124, 230);"><strong style="font-weight: border;color: #3e4753;">面试</strong></span><span style="color: rgb(3, 124, 230);display: none;"/><br/></h4><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">2012 年的春天，阳光明媚，鸟语花香，我正在张江的一栋橙黄色的大楼里跟我的小伙伴们一起奋力的敲打着键盘，随着一阵轻柔的电话铃响起，手机屏幕上显示出一个陌生的号码，是不是又是骚扰电话，没管他，我接着敲自己的键盘。手机一直在震动着，好像催促着我，我拿起它，电话接通，那头传来一个非常轻柔而且职业化的女声，“你好，我是 Oracle 的招聘顾问 Amy，请问您现在方便吗？…”。我的职业生涯从此与 MySQL 发生了交集。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">Amy 告诉我 MySQLInnoDB 团队有意在中国招聘合适的数据库内核工程师，问我有没有兴趣加入。我去，MySQL，the
world’s most popular open source database，邀请我加入？我想都没想就回答她，当然有，而且兴趣很大。Amy 是个非常专业的 HR，非常有效率的安排了我后面的面试事宜，怀着一丝忐忑和兴奋，我开始了进入 MySQL 团队的面试。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">面试第一轮：InnoDB 团队 manager，Calvin。Calvin 是数据库领域的专家，早年中科大毕业出国的那批牛人之一（后续的文章我会专门介绍 MySQL 的牛人们）。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">面试第二轮：InnoDB 性能优化专家 Innam，Innam 是缓冲池性能优化的作者。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">面试第三轮：InnoDB 大神 o。o 是 InnoDB 创始团队成员之一，存储引擎技术的大神级专家</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">面试第四轮：InnoDB 架构师 Jimmy。Jimmy 也是数据库内核的全能型专家，而且是之前是 sybase 内核团队的老大。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">MySQL 的面试并没有想象中的那么多规则和高难度，前后 4 轮，基本都是聊天，主要围绕以前做过的事情和对数据库内核的理解。印象比较深的是三件事，一个是 Innam 的口音实在太重，加上从遥远的加拿大打过来，偶英语听力也的确水平不高，所以，好多问题都没听懂，当时是慌得一批。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">另外一个是 o 用 google talk 问了一个如何发现事务死锁的问题，而且打字速度超级快，以至于我认为对面是个打字机器，直到见到他真人才发现，他就是一台没有感情的程序机器（其实，o 还是很有意思的一个人，后面的连载会介绍他的一些趣事）。Jimmy 的面试是在一个南京西路的咖啡厅里面进行的，两个人似曾相识一般聊了蛮久。Jimmy 是特别赞的一个人，很有亲和力。整个面试的流程总体感觉比较轻松，偶也没有刻意准备，或许真的是幸运。</p><h4 data-tool="mdnice编辑器" style="font-weight: bold;font-size: 17px;color: rgb(14, 136, 235);margin-top: 10px;margin-bottom: 10px;"><span style="color: rgb(3, 124, 230);display: none;"/><span style="color: rgb(3, 124, 230);"><strong style="font-weight: border;color: #3e4753;">团队</strong></span><span style="color: rgb(3, 124, 230);display: none;"/></h4><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">就传统的软件企业来说，MySQL 的团队架构相对比较扁平化，层级很少，像我这样的基础员工，离 Oracle 的老板 Larry
Ellison 也就隔了五层。这里面的原因主要是 Oracle 收购 MySQL 后的很长一段时间里，基本保留了 MySQL 团队的原有架构和人员，只是做了一些简单接入。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">整个 MySQL 分为好几个大的团队，有 MySQL kernel，MySQL replication，MySQL NDB 等等，这些大的团队里面又细分为若干小的团队，比如：MySQL kernel 团队里面又分为优化器，server 层，InnoDB，QA 等。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">当时，我所在的 InnoDB 团队当时有 base 在美国的 Calvin，Kevin，Jimmy，芬兰的 o，澳大利亚的 Sunny，加拿大的 Innam，Michael，瑞典的 Mattias，印度的 Satya，保加利亚的 Vasil，再加上中国的我，一共十一个人却来自八个不同的国家，是一个完全全球化的研发团队。团队里的每一个人都是经验丰富的数据库内核程序员，比如：o 是 2003 年就加入 InnoDB 的资历最深的大神，Sunny 是日后的 InnoDB manager，Kevin 也是曾经参与过 Falcon 存储引擎开发的老将，Jimmy 曾经领导过 Sybase 的研发团队等等。可以跟那么多大佬一起工作，实在是一件幸运的事情。</p><p style="text-align: center;"><img class="rich_pages" data-ratio="0.660952380952381" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/j3gficicyOvavaQIBO0fyJ0ln8SddnHR2S2VWn1iagFtFicaBzR61hZ9x4eug7QPuKm59rIXPRh27zjDaorHtwU9OQ/640?wx_fmt=png" data-type="png" data-w="1050" style="" src="../Images/fc7164678da7fff780a0c3d339d9dee8.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/j3gficicyOvavaQIBO0fyJ0ln8SddnHR2S2VWn1iagFtFicaBzR61hZ9x4eug7QPuKm59rIXPRh27zjDaorHtwU9OQ/640?wx_fmt=png"/></p><figure data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;display: flex;flex-direction: column;justify-content: center;align-items: center;"><figcaption style="margin-top: 5px;text-align: center;color: rgb(136, 136, 136);font-size: 14px;font-family: PingFangSC-Light;">2013 Team meeting in Shanghai</figcaption></figure><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">右起：Jimmy，Yasufumi, Allen, Kevin, o, Shaohua, Mattias, Satya, Sunny,
Vasil，Aditya, ??, Annamalai, Bin, Michael, ??, Krunal…</p><h4 data-tool="mdnice编辑器" style="font-weight: bold;font-size: 17px;color: rgb(14, 136, 235);margin-top: 10px;margin-bottom: 10px;"><span style="color: rgb(3, 124, 230);display: none;"/><span style="color: rgb(3, 124, 230);"><strong style="font-weight: border;color: #3e4753;">工作</strong></span><span style="color: rgb(3, 124, 230);display: none;"/></h4><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">在 InnoDB 工作，是一件非常开心的事情，因为可以在家上班。这对于一个每天需要接送孩子的家长来说，是非常难得的福利，另外也节省了大量的通勤时间，要知道，去一次 Oracle 在上海的办公室，来回要两个多小时的时间。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">由于是一个全球化的团队，而且，成员也比较有经验，所以，大家的工作方式也很特别。基本上是每个人都专注于自己的工作，相对比较独立，需要合作的时候，通过 pigeon，邮件或电话沟通。每周会开一次周会，大家各自汇报自己的工作进展情况，并进行讨论。每年会组织一次 team meeting，大家从全球各地汇聚到一起，总结上年的工作，规划明年的目标，谈谈理想，聊聊人生。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">在 MySQL，研发的流程非常规范。以一个 bug 修复为例，大致要经历以下几个步骤。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">首先，需要根据 bug report 来分析并复现 bug，然后找到修复方法，经过和 5 级大佬讨论后，确定修复方案并通过 bzr 创建新的代码分支。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">编码完成后，还需要创建对应的 MTR test case，并和修复代码一起，放到 reviewboard 上面请大佬 review。Review 的过程可能会持续好几轮，因为像 o 这样的大神 review 的时候非常严谨，不会放过任何一个出问题的细节。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">Review 完成后，需要把要提交的代码放到测试集群上面去测试。这个自动化测试系统非常强劲，它会同时在多平台上面编译好 debug 和 release 版本，再并行测试。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">测试完成，确认没有问题后代码才能最终被合并到主干。</p><figure data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;display: flex;flex-direction: column;justify-content: center;align-items: center;"><img data-ratio="0.07347328244274809" data-src="https://mmbiz.qpic.cn/mmbiz_png/j3gficicyOvavaQIBO0fyJ0ln8SddnHR2SuJf5KGFG1aAKeyRW841WztbHMuPQmhtYVCPfzthOz9GhicViaKSG4mlw/640?wx_fmt=png" data-type="png" data-w="2096" style="border-radius: 0px 0px 5px 5px;display: block;margin: 10px auto;object-fit: contain;" src="../Images/b2e6621ece1c875685c0afc0ba305b42.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/j3gficicyOvavaQIBO0fyJ0ln8SddnHR2SuJf5KGFG1aAKeyRW841WztbHMuPQmhtYVCPfzthOz9GhicViaKSG4mlw/640?wx_fmt=png"/><figcaption style="margin-top: 5px;text-align: center;color: rgb(136, 136, 136);font-size: 14px;font-family: PingFangSC-Light;">我的第一个提交</figcaption></figure><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">以上只是一个简单的 bug 修复过程，而对于更为复杂的特性开发，步骤还会包括前期的创建任务 worklog，并在 worklog 里面相应的填写 HLD（High Level Design），LLD（Low Level Design）等设计内容，并且开发原型等。</p><figure data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;display: flex;flex-direction: column;justify-content: center;align-items: center;"><img data-ratio="0.5452380952380952" data-src="https://mmbiz.qpic.cn/mmbiz_png/j3gficicyOvavaQIBO0fyJ0ln8SddnHR2SsEYaCVkvOZJkETXJX3Nd5TbZwODUZXeV2L5u5HP0n6Ko955WNdbDnA/640?wx_fmt=png" data-type="png" data-w="2100" style="border-radius: 0px 0px 5px 5px;display: block;margin: 10px auto;object-fit: contain;" src="../Images/eda7a736f8d36e5920d4d67004b89b43.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/j3gficicyOvavaQIBO0fyJ0ln8SddnHR2SsEYaCVkvOZJkETXJX3Nd5TbZwODUZXeV2L5u5HP0n6Ko955WNdbDnA/640?wx_fmt=png"/><figcaption style="margin-top: 5px;text-align: center;color: rgb(136, 136, 136);font-size: 14px;font-family: PingFangSC-Light;">我做的check空间索引的特性worklog</figcaption></figure><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">在 InnoDB 工作的六年时间里，我一共做了 461 次提交，做过的主要特性包括，<strong>InnoDB 支持空间索引，透明加密，新的数据字典</strong>等等，以下是其中一些 worklog 的列表：</p><pre data-tool="mdnice编辑器" style="margin-top: 10px;margin-bottom: 10px;border-radius: 5px;box-shadow: rgba(0, 0, 0, 0.55) 0px 2px 10px;"><span style="display: block;background: url(&quot;https://mmbiz.qpic.cn/mmbiz_png/j3gficicyOvavaQIBO0fyJ0ln8SddnHR2SP115l5PEazdN4GfXZFYXsWjVVYJe83rMjPWwa8AMEISbbfLp75eiaCw/640?wx_fmt=png&quot;) 10px 10px / 40px no-repeat rgb(40, 44, 52);height: 30px;width: 100%;margin-bottom: -7px;border-radius: 5px;"/><code style="overflow-x: auto;padding: 16px;color: #abb2bf;display: -webkit-box;font-family: Operator Mono, Consolas, Monaco, Menlo, monospace;font-size: 12px;-webkit-overflow-scrolling: touch;padding-top: 15px;background: #282c34;border-radius: 5px;">WL\#6968 InnoDB GIS: R-tree index support<br/>WL\#6455 InnoDB: GEOMETRY datatypes support<br/>WL\#6745 InnoDB GIS: support DML operation for InnoDB R-tree Index<br/>WL\#7740 InnoDB GIS: Enhance Check Table for InnoDB Spatial index<br/>WL\#8548 InnoDB: Transparent data encryption<br/>WL\#9290 InnoDB: Support Transparent Data Encryption for Redo Log<br/>WL\#9289 InnoDB: Support Transparent Data Encryption for Undo Tablespaces<br/>WL\#9531 InnoDB_New_DD: Enable table encryption and transparent compression<br/>WL\#9535. InnoDB_New_DD: Remove InnoDB system table and modify the view of their<br/>I_S counterparts<br/>WL\#9537 InnoDB_New_DD: Support InnoDB table import/export for new DD<br/></code></pre><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">在这六年里，自己感觉收获了很多很多，体验到了 MySQL 这样一个开源的数据库软件产品是如何进行研发的整个过程，也了解了一个成熟的研发体系和国际化团队是如何运作的。与国外大神们一起工作，不仅仅是学习到了知识和技能，也从他们身上发现了另外一种与我们完全不一样的工作，生活，乃至思维方式。</p><h4 data-tool="mdnice编辑器" style="font-weight: bold;font-size: 17px;color: rgb(14, 136, 235);margin-top: 10px;margin-bottom: 10px;"><span style="color: rgb(3, 124, 230);display: none;"/><span style="color: rgb(3, 124, 230);"><strong style="font-weight: border;color: #3e4753;">离开</strong></span><span style="color: rgb(3, 124, 230);display: none;"/></h4><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">随着互联网公司的爆发式崛起，以及 MySQL 生态链的迅速发展，MySQL 团队的很多成员获得了更好的发展机会而逐渐离开。而我也开始了和腾讯云数据库 CDB 内核 TXSQL 的不解之缘。巧的是，就在我离开 MySQL 不到一年，Oracle 宣布关闭中国研发中心。对于 Oracle 来说，面对着诸如亚马逊，阿里，腾讯的强势冲击以及去 O 的浪潮，它将经历一段艰难的转型期。而对于 MySQL 来说，在可预见的未来依旧会是 the world’s most popular open source database，身为曾经的 MySQL 人，我也会在腾讯继续助力 MySQL 的发展，通过 CDB 内核 TXSQL 为 MySQL 生态链贡献自己的力量。</p><p data-tool="mdnice编辑器" style="padding-top: 8px;padding-bottom: 8px;line-height: 1.75;color: rgb(62, 71, 83);">PS：在后续的系列文章里，我将会陆续跟大家分享一些有<span style="letter-spacing: 0px;">意思的事情，让大家更了解 MySQL 和它的腾讯版本 TXSQL，希望大家喜欢。</span></p></section><p><br/></p><p><br/></p><p style=""><strong><span style="font-size: 15px;color: rgb(0, 0, 0);">腾讯技术官方交流微信群已经开放</span></strong></p><p style=""><strong><span style="font-size: 15px;color: rgb(255, 76, 0);">进群添加微信：journeylife1900</span></strong></p><p style=""><strong><span style="font-size: 15px;color: rgb(255, 76, 0);">（备注：腾讯技术）</span></strong><span style="font-size: 15px;color: rgb(255, 76, 0);"/><br/></p><section data-tool="mdnice&#x7F16;&#x8F91;&#x5668;" data-website="https://www.mdnice.com" style="margin-right: 8px;margin-left: 8px;padding-right: 10px;padding-left: 10px;white-space: normal;background-color: rgb(255, 255, 255);color: black;line-height: 1.6;letter-spacing: 0px;word-break: break-word;font-family: &quot;Helvetica Neue&quot;, Helvetica, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, Arial;font-size: 16px;"><p style="text-align: center;"><img class="rich_pages __bg_gif" data-ratio="0.729264475743349" data-type="gif" data-w="639" data-src="https://mmbiz.qpic.cn/mmbiz_gif/j3gficicyOvatricjRxhpM1x45aB6doaVg7WMhINPwOiaqpskia1kH7hgibO0dicW2HLcW8HRGMzESQwehIcyckLXtwsA/640?wx_fmt=gif" style="box-sizing: border-box !important;width: 639px !important;visibility: visible !important;" src="../Images/73ce1e331a81f047666a0397bddd08e2.png" data-original-src="ht
