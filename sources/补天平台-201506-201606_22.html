<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzI2NzY5MDI3NQ==&amp;mid=2247485232&amp;idx=2&amp;sn=2fb64fe7e1cab6a2f4ec4646aa901c39&amp;chksm=eafa4f7cdd8dc66a72caae9c1d0a15f4c6387b277edb1dd68fe2626002a9e29334c6df5a7ee8&amp;scene=126&amp;sessionid=1681369231#rd">http://mp.weixin.qq.com/s?__biz=MzI2NzY5MDI3NQ==&amp;mid=2247485232&amp;idx=2&amp;sn=2fb64fe7e1cab6a2f4ec4646aa901c39&amp;chksm=eafa4f7cdd8dc66a72caae9c1d0a15f4c6387b277edb1dd68fe2626002a9e29334c6df5a7ee8&amp;scene=126&amp;sessionid=1681369231#rd</a></blockquote><p style="box-sizing: border-box; margin-top: 0px; margin-bottom: 15px; padding: 0px 0px 5px; border: 0px; font-size: 12px; vertical-align: baseline; font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;, tahoma, arial; text-indent: 2em; line-height: 28px; white-space: normal; background-color: rgb(255, 255, 255);"><span style="box-sizing: border-box; margin: 0px; padding: 0px; border: 0px; vertical-align: baseline; font-size: 18px;">阅兵期间，快递不发送机电类、粉末类商品，因此所有带电池的货物要在阅兵后发放。</span></p><p style="box-sizing: border-box; margin-top: 0px; margin-bottom: 15px; padding: 0px 0px 5px; border: 0px; font-size: 12px; vertical-align: baseline; font-family: &#x5FAE;&#x8F6F;&#x96C5;&#x9ED1;, tahoma, arial; text-indent: 2em; line-height: 28px; white-space: normal; background-color: rgb(255, 255, 255);"><span style="box-sizing: border-box; margin: 0px; padding: 0px; border: 0px; vertical-align: baseline; font-size: 18px;">   给大家带来的不便还请谅解。</span></p><p><br/></p>
