<h1>【干货】巧用SSH打通外网限制</h1>
<blockquote>原文：<a href="http://mp.weixin.qq.com/s?__biz=MzIxMTEyOTM2Ng==&amp;mid=2247496611&amp;idx=1&amp;sn=fe234faf83b5f46f452b3e13b6583283&amp;chksm=9758b6daa02f3fcc26ded3e6863114373f84737bc0ec53b3f8ab9838e87770fa2e26e79fdeee&amp;scene=126&amp;sessionid=1681667384#rd">http://mp.weixin.qq.com/s?__biz=MzIxMTEyOTM2Ng==&amp;mid=2247496611&amp;idx=1&amp;sn=fe234faf83b5f46f452b3e13b6583283&amp;chksm=9758b6daa02f3fcc26ded3e6863114373f84737bc0ec53b3f8ab9838e87770fa2e26e79fdeee&amp;scene=126&amp;sessionid=1681667384#rd</a></blockquote><p><br/></p><section class="mp_profile_iframe_wrp"><mpprofile class="js_uneditable custom_select_card mp_profile_iframe" data-pluginname="mpprofile" data-id="Mzg5OTY2MzEyMA==" data-headimg="http://mmbiz.qpic.cn/mmbiz_png/54wp6aVAyemQDrBPRibaR10iaiblGZvquwhnwgVSU3674LLia9rx5Cjibwuua2nb1uiaCY2dwbmu5KH3iaD1QN6gZ1jwQ/0?wx_fmt=png" data-nickname="Linux运维进阶之路" data-alias="" data-signature="关注公众号，进入Linux运维人员学习的乐园，我们一起分享开源的Linux，宏扬Linux开源精神。" data-from="0"/></section><blockquote class="js_blockquote_wrap" data-type="2" data-url="" data-author-name="" data-content-utf8-length="27" data-source-title=""><section class="js_blockquote_digest"><p><span style="font-size: 12px;color: rgb(178, 178, 178);"><strong>文案转载于    ：知乎李耀 </strong></span></p><p><span style="font-size: 12px;color: rgb(178, 178, 178);"><strong>漫图来源于    ：捷哥 </strong></span></p><p><span style="font-size: 12px;color: rgb(178, 178, 178);"><strong>文案格式排版 ：释然</strong></span></p></section></blockquote><section><img class="rich_pages wxw-img js_insertlocalimg" data-ratio="0.8463949843260188" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_jpg/3heAguJrdPy1r9y9TLXJuFD71RIURgHeYasiazmWKkpdQdvQ9NpicxKVfEmIyUWOX7CJAaMkD6ESr1Ny5FicrKicPQ/640?wx_fmt=jpeg" data-type="jpeg" data-w="1276" src="../Images/b787ea66fa779745fa29173bbf8f1efd.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_jpg/3heAguJrdPy1r9y9TLXJuFD71RIURgHeYasiazmWKkpdQdvQ9NpicxKVfEmIyUWOX7CJAaMkD6ESr1Ny5FicrKicPQ/640?wx_fmt=jpeg"/></section><p><br/></p><figure data-size="normal" style="margin-bottom: 1.4em;color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);"/><p style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);text-indent: 2em;margin-bottom: 5px;"><span style="color: rgb(63, 63, 63);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;letter-spacing: 1px;background-color: rgb(255, 255, 255);">笔者在工作中遇到此场景，如下两条网络限制下，总部如何访问分公司内部web服务器？</span></p><ul class="list-paddingleft-2" style="list-style-type: square;"><li style="margin-bottom: 1.4em;color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);"><section style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);margin-bottom: 5px;margin-top: 5px;line-height: normal;"><span style="color: rgb(63, 63, 63);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;letter-spacing: 1px;background-color: rgb(255, 255, 255);">dmz服务器可以访问总部外网服务器22端口，不可以访问web服务器；</span></section></li><li style="margin-bottom: 1.4em;color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);"><section style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);margin-bottom: 5px;margin-top: 5px;line-height: normal;"><span style="color: rgb(63, 63, 63);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;letter-spacing: 1px;background-color: rgb(255, 255, 255);">web服务器不可访问公网，但是到dmz网络无限制。</span></section></li></ul><p style="text-align: center;"><img class="rich_pages wxw-img" data-galleryid="" data-ratio="0.40469483568075115" data-s="300,640" data-src="https://mmbiz.qpic.cn/mmbiz_png/3heAguJrdPy1r9y9TLXJuFD71RIURgHeBicuXeibKS0JMeo2Aicb1YNgttrTzsF3HmKbiaPQH2KLx1iahxwd82Slyfg/640?wx_fmt=png" data-type="png" data-w="1065" style="" src="../Images/bca124ee7b83bef7e47b340ca6147a90.png" data-original-src="https://mmbiz.qpic.cn/mmbiz_png/3heAguJrdPy1r9y9TLXJuFD71RIURgHeBicuXeibKS0JMeo2Aicb1YNgttrTzsF3HmKbiaPQH2KLx1iahxwd82Slyfg/640?wx_fmt=png"/></p><p style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);text-indent: 2em;margin-bottom: 5px;"><span style="color: rgb(63, 63, 63);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;letter-spacing: 1px;background-color: rgb(255, 255, 255);">初看需求，我们第一个想到的肯定是内网端口映射到公网，或者vpn，但是不修改网络策略情况下很难实现。有没有别的方法呢，我们继续从纯网络角度分析现有条件。</span><br/></p><section style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);text-indent: 2em;margin-bottom: 5px;"><span style="color: rgb(63, 63, 63);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;letter-spacing: 1px;background-color: rgb(255, 255, 255);">网络通信是双向的，有请求，有回应，就是我们俗称的“通”。dmz可以访问外部22端口，代表请求，回包两个通信通道都是通畅的，我们是否可以借助回包通道，从外部发起到内部的反向访问呢？答案当然是有的，我们来试一试，需要ssh工具。</span></section><section style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);text-indent: 2em;margin-bottom: 5px;"><span style="color: rgb(63, 63, 63);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;letter-spacing: 1px;background-color: rgb(255, 255, 255);">我们在dmz执行如下命令。</span></section><section style="font-size: 16px;color: rgb(62, 62, 62);line-height: 1.6;word-spacing: 2px;letter-spacing: 2px;font-family: 'Helvetica Neue', Helvetica, 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;"><pre style="font-size: inherit;color: inherit;line-height: inherit;"><code style="overflow-wrap: break-word;margin-right: 2px;margin-left: 2px;line-height: 15px;font-size: 11px;word-spacing: -3px;letter-spacing: 0px;font-family: Consolas, Inconsolata, Courier, monospace;border-radius: 0px;color: rgb(169, 183, 198);background: rgb(40, 43, 46);padding: 0.5em;word-wrap: normal !important;word-break: normal !important;overflow: auto !important;display: -webkit-box !important;"><span style="font-size: inherit;color: inherit;line-height: inherit;word-wrap: inherit !important;word-break: inherit !important;">[root@dmz]</span>#  <span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">ssh</span> <span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">-f</span> <span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">-N</span> <span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">-g</span> <span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">-R</span>  6606<span style="font-size: inherit;color: inherit;line-height: inherit;word-wrap: inherit !important;word-break: inherit !important;">:10.1.1.1:80</span> <span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">root</span>@<span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">115</span>.<span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">100</span>.<span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">100</span>.<span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">100</span><br/></code></pre></section><p style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);line-height: normal;margin-bottom: 5px;margin-top: 5px;text-indent: 2em;"><strong><span style="color: rgb(136, 136, 136);font-size: 12px;">-f：代表后台运行程序<br/></span></strong></p><p style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);line-height: normal;margin-bottom: 5px;margin-top: 5px;text-indent: 2em;"><strong><span style="color: rgb(136, 136, 136);font-size: 12px;">-N：表示使用远程端口转发创建ssh隧道</span></strong></p><p style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);line-height: normal;margin-bottom: 5px;margin-top: 5px;text-indent: 2em;"><strong><span style="color: rgb(136, 136, 136);font-size: 12px;">-g：监听本机所有IP地址</span></strong></p><p style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);line-height: normal;margin-bottom: 5px;margin-top: 5px;text-indent: 2em;"><strong><span style="color: rgb(136, 136, 136);font-size: 12px;">-R，表示使用远程端口转发创建ssh隧道</span></strong></p><section style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);text-indent: 2em;margin-bottom: 5px;"><br/></section><section style="color: rgb(18, 18, 18);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Source Han Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif;font-size: medium;text-align: start;white-space: normal;background-color: rgb(255, 255, 255);text-indent: 2em;margin-bottom: 5px;"><span style="color: rgb(63, 63, 63);font-family: -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei UI&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;font-size: 15px;letter-spacing: 1px;background-color: rgb(255, 255, 255);">命令结合起来什么意思呢，我们使用root用户远程连接到115.100.100.100，并且远程主机监听6606端口，当访问此端口时，会跳转到dmz的80端口。此过程会使用到ssh隧道。dmz运行之后，总部服务器的已经有了端口监听。</span></section><section style="font-size: 16px;color: rgb(62, 62, 62);line-height: 1.6;word-spacing: 2px;letter-spacing: 2px;font-family: 'Helvetica Neue', Helvetica, 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;"><pre style="font-size: inherit;color: inherit;line-height: inherit;"><code style="overflow-wrap: break-word;margin-right: 2px;margin-left: 2px;line-height: 15px;font-size: 11px;word-spacing: -3px;letter-spacing: 0px;font-family: Consolas, Inconsolata, Courier, monospace;border-radius: 0px;color: rgb(169, 183, 198);background: rgb(40, 43, 46);padding: 0.5em;word-wrap: normal !important;word-break: normal !important;overflow: auto !important;display: -webkit-box !important;"><span style="font-size: inherit;color: inherit;line-height: inherit;word-wrap: inherit !important;word-break: inherit !important;">[root@center]</span># <span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">netstat</span> <span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">-tunlp</span> | <span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;word-break: inherit !important;">grep</span> 6606<br/><span style="font-size: inherit;line-height: inherit;color: rgb(248, 35, 117);word-wrap: inherit !important;
