                        <script type="text/javascript" nonce="615864445" reportloaderror="">
              (function () {
                var content = "有那么一瞬间压力大到崩溃，但等到心情平复下来，觉得自己不能这么就屈服，就倒下。每天的两点一线，甚至我的大部分工作都投入到工作，或者投入到写作中，无非是给自己找一些事做。这样我就不会有空闲的时间去想那些烦心的事，感觉挺可笑的，但是现实就是这么残酷。\n\n人到中年，有很多事情开始迷茫起来。每天似乎感觉自己很拼，觉得自己收获了什么，但是似乎又没留下什么，不断重复着矛盾。看着你的同学，你身边的人都买了房，买了车，父母都很健康，是挺羡慕。拉回自己的现实，似乎都是一团糟，但是能怎么样呢，苦笑罢了，还得继续投入到明天的搬砖中。\n\n大家都在贩卖焦虑，都在内卷。累了，就坐一会，自言自语:\"尽力了\"。"; // 只保留a标签

                  return s.html(true);
