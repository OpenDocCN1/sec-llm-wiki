                        <script type="text/javascript" nonce="899554698" reportloaderror="">
              (function () {
                var content = "如何发现窃照设备：1、肉眼观察法：重点搜查正对着自己常出没的位置。尤其是对一些比较常见的针孔摄像头伪装品，如遥控器、插座、烟雾报警器等，要更加仔细地检查。2、相机检测法：使室内处于黑暗环境，打开手机相机进行扫描。如果能在手机屏幕上发现不明红点，极有可能是隐藏的针孔摄像头。3、 反光检测法：发现可疑的小孔后，打开手机的手电筒向孔内照射，如果有反光，那说明可能存在针孔摄像头。4. 房间断电法：部分针孔摄像头工作需要持续供电，为避免被偷拍，可以在睡前关闭房间电源。\n最后还是建议某宝买一个反偷拍红外探测仪，直接搜即可。\n↑补充：\n&amp;lt;a data-itemshowtype=\"0\" target=\"_blank\" href=\"http://mp.weixin.qq.com/s?__biz=MzAxOTM1MDQ1NA==&amp;amp;amp;mid=2451181233&amp;amp;amp;idx=1&amp;amp;amp;sn=f75f0079d82bdc777872434b473b83a5&amp;amp;amp;chksm=8c26f868bb51717e1001575a58984157bfc934f51349a6fa72d653d0a538957daaa99dc2fb35&amp;amp;amp;token=46196704&amp;amp;amp;lang=zh_CN#rd\"&amp;gt;人民币、水瓶等改装的窃照设备展示&amp;lt;/a&amp;gt;\n&amp;lt;a data-itemshowtype=\"0\" target=\"_blank\" href=\"http://mp.weixin.qq.com/s?__biz=MzAxOTM1MDQ1NA==&amp;amp;amp;mid=2451181211&amp;amp;amp;idx=1&amp;amp;amp;sn=d80374d54aa89ce3fdbea2f4fed2453e&amp;amp;amp;chksm=8c26f842bb517154579327aad990029be82dd9c2e314f214ffb56dc185467e6d0da798d3afa0#rd\"&amp;gt;美国执法机构使用的奇特又昂贵的监视设备&amp;lt;/a&amp;gt;"; // 只保留a标签
